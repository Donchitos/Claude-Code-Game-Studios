    requirement: "When the focused toast auto-retires, is promoted away, or tier-swaps, keyboard focus explicitly transfers to the next visible toast (or the anchor) — never a dangling null focus."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-ui-074
    system: building-ui
    gdd: design/gdd/building-ui.md
    requirement: "Warning and Info toasts are differentiated by icon SHAPE + label, never by hue or intensity alone; the armed tool pairs its blue accent with a pressed/highlight state, not hue alone."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-ui-075
    system: building-ui
    gdd: design/gdd/building-ui.md
    requirement: "Build Mode is the explicit entry point for every build tool: a master 'Bauen' toggle (toolbar button + build_mode_toggle key) switches the HUD between World Navigation (default — camera/selection only, no build chrome) and Build Mode; no base or higher-level tool can arm in World Navigation, and firing a tool-select action there auto-enters Build Mode AND arms the tool in the same frame — one player action, no observable intermediate Build-Mode/Idle frame."
    created: 2026-07-23
    revised: ""
    status: active
  - id: TR-building-ui-076
    system: building-ui
    gdd: design/gdd/building-ui.md
    requirement: "The Esc chain resolves exactly one step per press, highest priority first, never skipped or combined: (1) release toast/anchor HUD keyboard focus; else (2) cancel the armed tool back to Build-Mode/Idle; else (3) clear the active Selection (Build Mode stays ON); else (4) exit Build Mode to World Navigation; a press with no applicable step is a no-op."
    created: 2026-07-23
    revised: ""
    status: active
  - id: TR-building-ui-077
    system: building-ui
    gdd: design/gdd/building-ui.md
    requirement: "Outside Build Mode, world clicks route to Selection with exactly one outcome: a villager on the picked cell claims the selection (villager wins ties over the project underneath); else a project cell selects that project (world-space outline around its full footprint + Projects Panel card highlight in the same frame); else the click clears any Selection; Selection is mutually exclusive — villager XOR project XOR none."
    created: 2026-07-23
    revised: ""
    status: active
  - id: TR-building-ui-078
    system: building-ui
    gdd: design/gdd/building-ui.md
    requirement: "Picking treats Planned/Released blueprint ghost cells as solid geometry (a roof tool can target a drafted wall run), with two exemptions: dig-order cells are never a solid pick target (the ray passes through to what lies behind/beneath) and water is never pickable-solid regardless of any overlaid marker/ghost state; a ray resolving nothing after the exemptions behaves as the existing no-pick case (hidden ghost, no-op)."
    created: 2026-07-23
    revised: ""
    status: active
  - id: TR-building-ui-079
    system: building-ui
    gdd: design/gdd/building-ui.md
    requirement: "Always-on hover feedback: whenever the pick ray resolves a valid target cell — in either mode, tool armed or not — the cell renders a wireframe outline plus a hit-face quad the same frame, reusing the same pick-ray data as tool previews and Selection queries (one source of truth); in Build Mode only, a build grid renders on the picked working plane around the cursor at build_grid_opacity (Valley-Ochre family) — never in World Navigation."
    created: 2026-07-23
    revised: ""
    status: active
  - id: TR-building-ui-080
    system: building-ui
    gdd: design/gdd/building-ui.md
    requirement: "Ghosts render as a translucent tint of the ACTUAL material selected (no generic blueprint hue): Draft ghosts at ghost_alpha_draft, Released ghosts at the higher ghost_alpha_released — the alpha step communicates commitment level; invalid placement in any state overrides the material tint with the State-Orange tint — one invalid channel, not two."
    created: 2026-07-23
    revised: ""
    status: active
  - id: TR-building-ui-081
    system: building-ui
    gdd: design/gdd/building-ui.md
    requirement: "Terrain-replace and dig/demolition markers both render as an inflated overlay box around the affected cell (visibly larger than a flush ghost — the shared 'content changing to something not-yet-real' tell), both in the State-Orange family (the slice's red demolition tint does not survive); within that shared language the two marker kinds differ by SHAPE, never shade or pulse-timing alone."
    created: 2026-07-23
    revised: ""
    status: active
  - id: TR-building-ui-082
    system: building-ui
    gdd: design/gdd/building-ui.md
    requirement: "Room tool: drags a ground-plane rectangle (minimum 3x3 cells); commit generates a full-height perimeter wall run at the current wall_height with one 1-cell door gap omitted from the perimeter edge facing the camera AT COMMIT TIME (recomputed on commit, not drag start); the whole result is ONE draft project, not N wall commands; a sub-minimum drag shows the invalid-commit cue and creates no project."
    created: 2026-07-23
    revised: ""
    status: active
  - id: TR-building-ui-083
    system: building-ui
    gdd: design/gdd/building-ui.md
    requirement: "Auto-roof tool: one click on any cell belonging to an existing project computes the project's footprint bounding box and generates a Flat-formation roof at the bbox's top height, joining the SAME project id; a click on a cell belonging to no project shows the invalid-commit cue and creates nothing."
    created: 2026-07-23
    revised: ""
    status: active
  - id: TR-building-ui-084
    system: building-ui
    gdd: design/gdd/building-ui.md
    requirement: "House template stamp: one click centers a fixed 7x7 footprint — flush floor + perimeter walls with one camera-facing door gap + Flat roof at wall-height — and creates ALL of it as exactly ONE draft project in a single action; precondition: uniform terrain height and clear volume up to roof height; an ineligible footprint shows the standard invalid-commit cue and commits nothing — never a partial stamp."
    created: 2026-07-23
    revised: ""
    status: active
  - id: TR-building-ui-085
    system: building-ui
    gdd: design/gdd/building-ui.md
    requirement: "Slice View: a player-controlled horizontal render cutoff hiding cells above the current level (world geometry, ghosts, characters — presentation-only, simulation unaffected); PageUp/PageDown step one cell, Home resets, mirrored by a HUD 'Ebene' indicator with +/- buttons updating the same frame; available in BOTH modes; hidden cells cannot become NEW hover or Selection targets, but anything already selected or armed is unaffected by slicing."
    created: 2026-07-23
    revised: ""
    status: active
  - id: TR-building-ui-086
    system: building-ui
    gdd: design/gdd/building-ui.md
    requirement: "Projects Panel: a new chrome zone with one card per project — name, state-dependent status text, X/Y cells-built progress readout plus bar (raw value every frame, no easing), names of villagers working it, and state-dependent action buttons; clicking a card selects the project identically to clicking a world cell (one Selection, two renders — reciprocal highlight); layout is provisional until design/ux/projects-panel.md exists."
    created: 2026-07-23
    revised: ""
    status: active
  - id: TR-building-ui-087
    system: building-ui
    gdd: design/gdd/building-ui.md
    requirement: "Door-gap discoverability: a dedicated visual affordance class must mark 'this gap is a functional doorway,' distinct from an unfinished or accidental gap, obeying shape+label-never-hue (confirmed 2026-07-23 playtest failure); exact treatment pends the Art Bible handoff; the rule is superseded, not duplicated, the moment door/window items ship."
    created: 2026-07-23
    revised: ""
    status: active
  - id: TR-building-ui-088
    system: building-ui
    gdd: design/gdd/building-ui.md
    requirement: "Undo/redo scope — plan entries only: undo/redo reach ONLY Draft commands not yet Released and Released-but-not-yet-Built blueprint cells; a Built cell is never reachable by undo (silent no-op) — reverting built work is exclusively a worker-executed demolition order; a queued or executed demolition is never an undo-tracked step and the undo button/stack never lists one."
    created: 2026-07-23
    revised: ""
    status: active

  # ── Villager Info UI ────────────────────────────────────────────────────
  - id: TR-villager-info-ui-002
    system: villager-info-ui
    gdd: design/gdd/villager-info-ui.md
    requirement: "The villager-hit query honors the SAME shared world-pick hover-suppression flag Building UI Rule 11 defines: while the cursor hovers any HUD element the query does not run — a click over the HUD can neither select a villager behind it nor deselect."
    created: 2026-07-11
    revised: "2026-07-11"
    status: active
  - id: TR-villager-info-ui-014
    system: villager-info-ui
    gdd: design/gdd/villager-info-ui.md
    requirement: "Villager-hit testing is a dedicated physics query on a dedicated villager collision layer, fully separate from block-picking; Building's placement raycast must ignore this layer."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-info-ui-015
    system: villager-info-ui
    gdd: design/gdd/villager-info-ui.md
    requirement: "Villager-vs-block pick: nearest hit wins by ray-parametric distance in world units; a tie is |t_villager - t_block| < pick_tie_epsilon and the villager (the interactive entity) wins."
    created: 2026-07-11
    revised: "2026-07-11"
    status: active
  - id: TR-villager-info-ui-016
    system: villager-info-ui
    gdd: design/gdd/villager-info-ui.md
    requirement: "Multiple-villagers-along-ray: nearest wins deterministically; equal-distance ties break via stable villager processing order."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-info-ui-023
    system: villager-info-ui
    gdd: design/gdd/villager-info-ui.md
    requirement: "Panel logic must support headless mocking of villager hits, tool-arm state, and all six activity states (BLOCKING automated-test tier)."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-info-ui-001
    system: villager-info-ui
    gdd: design/gdd/villager-info-ui.md
    requirement: "Villager selection clicks are gated on no build tool armed: while any build tool is armed, all clicks belong to the Building pipeline and selection is untouchable."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-info-ui-010
    system: villager-info-ui
    gdd: design/gdd/villager-info-ui.md
    requirement: "Selection is held as a stable villager id/handle whose identity stability across Suspended transitions is [assumption] until Villager AI's identity work lands; verify against Scene/World Management transition mechanics at implementation."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-info-ui-027
    system: villager-info-ui
    gdd: design/gdd/villager-info-ui.md
    requirement: "Distress-icon billboard mode (full-billboard vs. Y-locked, pending camera angle) is a deferred implementation detail resolved by /ux-design villager-panel in Pre-Production."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-info-ui-028
    system: villager-info-ui
    gdd: design/gdd/villager-info-ui.md
    requirement: "Selection exists only in Idle: a click whose pick hits a villager selects them; a click hitting nothing deselects; Esc deselects; clicking another villager switches."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-info-ui-029
    system: villager-info-ui
    gdd: design/gdd/villager-info-ui.md
    requirement: "Esc routing is a deterministic two-step: if a Building UI element holds keyboard focus, Esc first releases that focus; only an Esc with no HUD focus deselects the villager — no double-fire."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-info-ui-030
    system: villager-info-ui
    gdd: design/gdd/villager-info-ui.md
    requirement: "MVP ships villager selection mouse-only as a stated exemption from the no-mouse-only commitment; a keyboard selection path (select-cycle / focus-nearest-distressed) is committed to the VS revision."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-info-ui-031
    system: villager-info-ui
    gdd: design/gdd/villager-info-ui.md
    requirement: "Panel shows name, activity as player-readable labels for all SIX AI states (Deciding/Traveling/Working/Sleeping/Breather/Wandering — six-way mapping is the contract), one bar per active need, mood-band icon (3 states), why-string, and distress flag."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-info-ui-032
    system: villager-info-ui
    gdd: design/gdd/villager-info-ui.md
    requirement: "The why-slot is ONE slot: shows text whenever a need is urgent or mood is not Happy; content follows Needs Core Rule 11's precedence consumed whole (distress > need-why > structural; strongest-drain wins, schema-order tie-break); distress flag is its icon companion, never a second text."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-info-ui-033
    system: villager-info-ui
    gdd: design/gdd/villager-info-ui.md
    requirement: "While selected the panel re-reads upstream state directly each update frame (raw delta); upstream signals are wake/dirty hints and event triggers, never value sources — no cached copies; selection is the only state this system owns."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-info-ui-034
    system: villager-info-ui
    gdd: design/gdd/villager-info-ui.md
    requirement: "Villagers with an active distress flag (trapped, ground-sleeping only — no-bed is deliberately NOT a third icon state) show a subtle overhead icon, visible unselected, disappearing when the cause resolves; no permanent mood icons over heads."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-info-ui-035
    system: villager-info-ui
    gdd: design/gdd/villager-info-ui.md
    requirement: "One manager drives all N overhead icons — one Suspended signal hides all, one iteration, never N independent subscriptions; distress flags are state-derived conditions, not pulses."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-info-ui-036
    system: villager-info-ui
    gdd: design/gdd/villager-info-ui.md
    requirement: "Why-strings pass through verbatim from Needs & Mood — this UI never composes its own explanations."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-info-ui-037
    system: villager-info-ui
    gdd: design/gdd/villager-info-ui.md
    requirement: "Panel design assumes N villagers (VS ~5, ceiling 20-30) from day one — selection is per-villager; only the roster/list view is deferred."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-info-ui-038
    system: villager-info-ui
    gdd: design/gdd/villager-info-ui.md
    requirement: "Suspended: panel and overhead icons hidden while selection is retained through the transition; the same villager is selected and the panel restores on reactivation."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-info-ui-039
    system: villager-info-ui
    gdd: design/gdd/villager-info-ui.md
    requirement: "Selection introduces no new InputMap actions — reuses the existing click action in the unclaimed Idle niche."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-info-ui-040
    system: villager-info-ui
    gdd: design/gdd/villager-info-ui.md
    requirement: "Selected villager despawns -> graceful deselect, panel closes — never a stale panel."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-info-ui-041
    system: villager-info-ui
    gdd: design/gdd/villager-info-ui.md
    requirement: "Selection during pause is fully functional (raw delta): click-to-select, panel value updates, and Esc-deselect all fire on the paused frame."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-info-ui-042
    system: villager-info-ui
    gdd: design/gdd/villager-info-ui.md
    requirement: "Overhead icon and panel distress flag derive from the same signal/source state — they can never disagree."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-info-ui-043
    system: villager-info-ui
    gdd: design/gdd/villager-info-ui.md
    requirement: "Arming a build tool while a villager is selected closes the panel and clears selection — clean mode switch mirroring Rule 1's exclusivity."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-info-ui-044
    system: villager-info-ui
    gdd: design/gdd/villager-info-ui.md
    requirement: "A why-string exceeding panel width wraps, never silently truncates."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-info-ui-045
    system: villager-info-ui
    gdd: design/gdd/villager-info-ui.md
    requirement: "Mood-band icons (3) and the overhead distress icon are differentiated by icon SHAPE + label/tooltip, never by hue alone (day-one colorblind-safe pairing rule)."
