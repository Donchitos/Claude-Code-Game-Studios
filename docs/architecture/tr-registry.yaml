    revised: ""
    status: active
  - id: TR-building-ui-044
    system: building-ui
    gdd: design/gdd/building-ui.md
    requirement: "Tool buttons fire tool-select InputMap actions (keys 1-5); armed tool visibly highlighted; cancel returns to Idle and clears highlight; exactly one tool ever appears active."
