    revised: ""
    status: active
  - id: TR-building-ui-055
    system: building-ui
    gdd: design/gdd/building-ui.md
    requirement: "At most toast_max_visible toasts; the anchor is the overflow home (no hidden queue): a new Warning evicts the oldest visible Info; with all-Warning slots new arrivals go to the anchor (badge increments, nothing starves)."
