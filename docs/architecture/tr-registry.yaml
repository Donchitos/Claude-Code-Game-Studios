    revised: ""
    status: active
  - id: TR-building-ui-059
    system: building-ui
    gdd: design/gdd/building-ui.md
    requirement: "Keyboard actions (toast_focus_cycle, toast_dismiss, toggle_issues, palette_next/prev, formation_next/prev, height_step_up/down) give full parity with mouse — semantics identical to clicks."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-ui-060
    system: building-ui
    gdd: design/gdd/building-ui.md
    requirement: "Esc releases HUD keyboard focus WITHOUT dismissing; only an Esc pressed with no HUD focus falls through to world-level handlers (e.g. Villager Info UI deselect)."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-ui-061
    system: building-ui
    gdd: design/gdd/building-ui.md
    requirement: "The issues anchor (counter 'N !') is visible iff at least one active warning/info exists (shown, dismissed-within-window, or overflowed); hidden entirely at zero issues."
