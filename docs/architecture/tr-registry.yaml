    revised: ""
    status: active
  - id: TR-building-ui-056
    system: building-ui
    gdd: design/gdd/building-ui.md
    requirement: "When a visible slot frees, the longest-waiting anchor-only Warning promotes immediately (grace already served); a dismissed key respects remaining min_reshow_interval; Info promotes only when no anchor-only Warning waits."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-ui-057
    system: building-ui
    gdd: design/gdd/building-ui.md
    requirement: "Toast/anchor set reconciles against each analysis pass's emissions plus queryable state (same-frame delivery is the unit); keys whose emissions cease auto-retire within one reconcile — solved problems never need manual dismissal."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-ui-058
    system: building-ui
    gdd: design/gdd/building-ui.md
    requirement: "Tier-swap bookkeeping is per SUBJECT: swap of a Shown Warning shows the Info immediately; a swap during Grace transfers elapsed grace credit (no restart); an active dismissal-debounce window does NOT carry to the Info."
