    revised: ""
    status: active
  - id: TR-building-ui-045
    system: building-ui
    gdd: design/gdd/building-ui.md
    requirement: "The context panel shows only what the armed tool needs (palette / stepper / roof picker / furniture list) and is hidden in Idle."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-ui-046
    system: building-ui
    gdd: design/gdd/building-ui.md
    requirement: "The last palette selection per tool is remembered within the session."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-ui-047
    system: building-ui
    gdd: design/gdd/building-ui.md
    requirement: "Wall-height stepper shows 1-8 via +/- buttons, mousewheel over the stepper, and height_step_up/down actions — clamped display of Building's range."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-ui-048
    system: building-ui
    gdd: design/gdd/building-ui.md
    requirement: "Undo/redo buttons mirror stack state (disabled when empty); Ctrl+Z/Ctrl+Y bindings; held key repeats at OS key-repeat rate, exactly one intent per repeat event."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-ui-049
    system: building-ui
    gdd: design/gdd/building-ui.md
    requirement: "Invalid-commit cue: transient at-cursor marker (orange accent + gentle negative sound) auto-fading in invalid_cue_fade, optionally with one-line reason; never modal, never blocking input."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-ui-050
    system: building-ui
    gdd: design/gdd/building-ui.md
    requirement: "Toast area shows warnings and info hints only (sealed_space_warning, unsheltered_furniture_info); each toast carries the why-string verbatim."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-ui-051
    system: building-ui
    gdd: design/gdd/building-ui.md
    requirement: "Every toast is keyed by (signal type, subject); a re-emission matching a live key refreshes it in place — level-triggered re-emits are idempotent for presentation."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-ui-052
    system: building-ui
    gdd: design/gdd/building-ui.md
    requirement: "First-appearance grace is a UI-local wall-clock timer per SUBJECT started on the first qualifying emission — not a count of re-emissions."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-ui-053
    system: building-ui
    gdd: design/gdd/building-ui.md
    requirement: "Grace/debounce timers are wall-clock: frozen only during Suspended, never during ordinary game pause; expiry checks read current queryable state."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-ui-054
    system: building-ui
    gdd: design/gdd/building-ui.md
    requirement: "A visible Warning is never evicted by a lower-severity arrival; it leaves only via player dismissal, tier-swap, cause resolution, or the overflow rule."
