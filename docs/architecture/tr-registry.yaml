    revised: ""
    status: active
  - id: TR-building-ui-043
    system: building-ui
    gdd: design/gdd/building-ui.md
    requirement: "Time-controls display is written EXCLUSIVELY from the pause/warp API's returned state; a queued state signal never overwrites a newer returned state (no stale-writer race)."
