# Technical Requirement ID Registry
#
# PURPOSE: Persistent, stable IDs for every GDD technical requirement.
# Prevents TR-ID renumbering across /architecture-review runs, which would
# break story references.
#
# RULES:
#   - IDs are PERMANENT. Never renumber, never delete (use status: deprecated).
#   - Add new entries only at the END of each system's list.
#   - When a GDD requirement is reworded (same intent): update `requirement`
#     text and add a `revised` date. The ID stays the same.
#   - When a requirement is removed from the GDD: set status: deprecated.
#   - When a requirement is split or replaced: set status: superseded-by with
#     the new TR-ID(s).
#
# WRITTEN BY: /architecture-review (appends new entries, never overwrites)
# READ BY:    /create-stories (embed IDs in stories)
#             /story-done (look up current requirement text at review time)
#             /story-readiness (validate TR-ID exists and is active)
#
# ID FORMAT: TR-[system-slug]-[NNN]
#   system-slug = short slug matching the GDD system name
#   NNN = three-digit zero-padded sequence per system, starting at 001
#
# STATUS VALUES: active | deprecated | superseded-by: TR-[system]-NNN
#
# ─────────────────────────────────────────────────────────────────────────
# PROVENANCE NOTE (2026-07-11, first population by /architecture-review):
#   The MVP GDDs contain NO TR-ID labels (verified by grep — zero `TR-`
#   occurrences across design/gdd/*.md). The TR-IDs below were assigned during
#   the 2026-07-11 architecture pass and referenced only inside the ADRs and
#   architecture.md. This first population therefore records ONLY the ~54
#   "ADR-worthy" requirements that the 13 ADRs formally address (their "GDD
#   Requirements Addressed" tables), which is the authoritative source for each
#   ID's text. The ~295 GDD-specified requirements that need no ADR are NOT yet
#   registered — they are covered directly by their GDD + architecture.md
#   Module Ownership per the recorded interpretive call. `requirement` text here
#   is reconstructed from the ADRs/architecture.md and should be back-annotated
#   against the source GDD wording when the GDDs are given explicit TR-ID labels.
#
# BACK-ANNOTATION NOTE (2026-07-11, same day, later session):
#   The back-annotation pass is COMPLETE. All 11 system GDDs now carry inline
#   `[TR-<system>-NNN]` labels; every label has a registry entry and vice versa
#   (471 entries, verified 1:1). The 63 originally registered IDs kept their
#   numbers and were anchored at their source passages; 28 IDs referenced in
#   ADRs/architecture.md but previously unregistered were registered under
#   exactly those numbers; all remaining requirements got new IDs numbered
#   above each system's prior maximum, in document order. Registry `requirement`
#   texts were aligned to GDD wording where the ADR reconstruction diverged
#   (marked via `revised: 2026-07-11`). The phantom TR-camera-input-010 was NOT
#   registered (dropped per the 2026-07-11 review). The 471-entry count differs
#   from the architecture session's ~349 baseline because restatement
#   occurrences and finer-grained extraction were normalized in this pass.
# ─────────────────────────────────────────────────────────────────────────

version: 2
last_updated: "2026-07-23"

requirements:

  # ── Scene/World Management ──────────────────────────────────────────────
  - id: TR-scene-world-management-004
    system: scene-world-management
    gdd: design/gdd/scene-world-management.md
    requirement: "Boot gate: Resource & Item Database must reach Ready before the Valley scene attaches and before Building System / Villager AI initialize; DB failure halts boot on an error screen — the HALT is TERMINAL (no in-game exit, requires application restart)."
    created: 2026-07-11
    revised: "2026-07-11"
    status: active
  - id: TR-scene-world-management-013
    system: scene-world-management
    gdd: design/gdd/scene-world-management.md
    requirement: "Save/Load binds its savepoint to transition-COMPLETE only (irreversible effect class — never to begin, and abort must leave no savepoint)."
    created: 2026-07-11
    revised: "2026-07-11"
    status: active
  - id: TR-scene-world-management-023
    system: scene-world-management
    gdd: design/gdd/scene-world-management.md
    requirement: "Boot-order enforcement is owned by a dedicated boot-order mechanism/ADR."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-scene-world-management-024
    system: scene-world-management
    gdd: design/gdd/scene-world-management.md
    requirement: "Save/Load listens for the transition-COMPLETE signal as a savepoint (per Core Rule 7, irreversible effects never bind to begin; exact savepoint policy is the Save/Load GDD's decision when authored)."
    created: 2026-07-11
    revised: "2026-07-11"
    status: active
  - id: TR-scene-world-management-030
    system: scene-world-management
    gdd: design/gdd/scene-world-management.md
    requirement: "All transition tunables are read from data/config, never hardcoded literals."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-scene-world-management-033
    system: scene-world-management
    gdd: design/gdd/scene-world-management.md
    requirement: "Backgrounded-Valley two-live-scenes partitioning (RESOLVED via ADR-0013): shared World3D with Dungeon content at a large spatial offset; explicit per-scene toggling of WorldEnvironment, Camera3D.current, AudioListener3D, and DirectionalLight3D visibility; NavigationServer3D maps N/A (custom AStar3D per ADR-0007); input routing requires manual Suspended discipline — SubViewports do not isolate _input/_unhandled_input."
    created: 2026-07-11
    revised: "2026-07-11"
    status: active
  - id: TR-scene-world-management-010
    system: scene-world-management
    gdd: design/gdd/scene-world-management.md
    requirement: "Exactly one scene has control (receives player input, is rendered as the primary view) at any time; during the loading transition neither scene receives player input."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-scene-world-management-032
    system: scene-world-management
    gdd: design/gdd/scene-world-management.md
    requirement: "Loading transition overlay UI: full-screen overlay shown once per transition, visible during the Transitioning state."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-scene-world-management-034
    system: scene-world-management
    gdd: design/gdd/scene-world-management.md
    requirement: "On launch the engine instantiates World Root as the active scene; World Root attaches the Valley scene as its child during boot — no intermediate menu or loading screen at MVP."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-scene-world-management-035
    system: scene-world-management
    gdd: design/gdd/scene-world-management.md
    requirement: "A thin persistent World Root container node, alive for the entire process lifetime, anchors the scene tree; the Valley attaches under it at boot and persists all session; Dungeon scenes attach as SIBLINGS of the Valley under the same World Root."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-scene-world-management-036
    system: scene-world-management
    gdd: design/gdd/scene-world-management.md
    requirement: "Hosted Foundation/Core systems (Voxel World, Camera & Input, Time & Tick, Villager AI, Building System, Building UI, Villager Info UI) attach as children of the Valley scene and exist for the lifetime of a play session."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-scene-world-management-037
    system: scene-world-management
    gdd: design/gdd/scene-world-management.md
    requirement: "Scene handoff MUST NOT use SceneTree.change_scene_to_file(), change_scene_to_packed(), or reload_current_scene(), nor ever assign SceneTree.current_scene directly."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-scene-world-management-038
    system: scene-world-management
    gdd: design/gdd/scene-world-management.md
    requirement: "The World Root node is never freed (queue_free on dungeon-exit targets only the Dungeon child); dungeon entry/exit is add/remove of child scenes under World Root, never a current-scene swap."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-scene-world-management-039
    system: scene-world-management
    gdd: design/gdd/scene-world-management.md
    requirement: "Entering a seal dungeon triggers a scene transition: a short loading transition is shown, the Dungeon scene is loaded and instantiated, and control (camera, input) hands off to it."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-scene-world-management-040
    system: scene-world-management
    gdd: design/gdd/scene-world-management.md
    requirement: "While the player is inside a Dungeon scene the Valley is NOT unloaded — it continues simulating in the background (villager schedules, needs decay, build-over-time timers keep advancing) in real time."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-scene-world-management-041
    system: scene-world-management
    gdd: design/gdd/scene-world-management.md
    requirement: "Leaving a dungeon triggers the reverse transition: short loading transition, the Dungeon scene is unloaded/freed, and control hands back to the already-running Valley at the position/state it was left in."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-scene-world-management-042
    system: scene-world-management
    gdd: design/gdd/scene-world-management.md
    requirement: "Each leave-reason maps to its own return cue: completion -> victory amber; voluntary exit -> neutral; death/retreat -> muted 'limping home'."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-scene-world-management-043
    system: scene-world-management
    gdd: design/gdd/scene-world-management.md
    requirement: "transition-begin is reserved for REVERSIBLE presentation/suspension effects (camera Suspended, UI hiding, overlay fade-in); consumers MUST NOT bind irreversible state changes to begin."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-scene-world-management-044
    system: scene-world-management
    gdd: design/gdd/scene-world-management.md
    requirement: "transition-complete fires ONLY on success; irreversible reactions bind here, and it also ends the reversible begin-effects on the success path (camera resumes in target scene, UI reappears, overlay fades out)."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-scene-world-management-045
    system: scene-world-management
    gdd: design/gdd/scene-world-management.md
    requirement: "transition-abort fires ONLY on load failure; every reversible begin-effect unwinds, an error is shown, and the player keeps the source scene with full control; no irreversible effect fired."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-scene-world-management-046
    system: scene-world-management
    gdd: design/gdd/scene-world-management.md
    requirement: "Abort is ENTRY-only: a return-to-Valley handback cannot abort by construction — the Valley always exists and is running, so no stranding safeguard is required for return."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-scene-world-management-047
    system: scene-world-management
    gdd: design/gdd/scene-world-management.md
    requirement: "Exactly one of transition-complete/transition-abort fires per transition-begin, exactly once; the double-trigger debounce releases on EITHER of them, never on complete alone."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-scene-world-management-048
    system: scene-world-management
    gdd: design/gdd/scene-world-management.md
    requirement: "Camera & Input enters Suspended on transition-begin and exits Suspended on transition-complete OR transition-abort (whichever fires); no camera control or input dispatch during a transition."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-scene-world-management-049
    system: scene-world-management
    gdd: design/gdd/scene-world-management.md
    requirement: "All transition effects reach consumers exclusively via the transition-begin/-complete signals — no direct-call side effects (no direct call into Time & Tick), so no call-vs-signal ordering exists to race."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-scene-world-management-050
    system: scene-world-management
    gdd: design/gdd/scene-world-management.md
    requirement: "A second transition trigger during an in-progress transition is ignored (not queued) until the first ends on transition-complete OR transition-abort; at most one transition starts per abort cycle."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-scene-world-management-051
    system: scene-world-management
    gdd: design/gdd/scene-world-management.md
    requirement: "A transition during build-placement: transition-begin drives Camera & Input into Suspended, which propagates to Building and reactively aborts the in-progress placement — nothing committed, no incomplete/invalid blocks left behind."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-scene-world-management-052
    system: scene-world-management
    gdd: design/gdd/scene-world-management.md
    requirement: "Time-warp persists unchanged across the transition and the dungeon visit — this system never touches the warp value."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-scene-world-management-053
    system: scene-world-management
    gdd: design/gdd/scene-world-management.md
    requirement: "If no valid dungeon scene exists for an entry trigger, no transition begins and the player receives feedback that entry isn't currently possible."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-scene-world-management-054
    system: scene-world-management
    gdd: design/gdd/scene-world-management.md
    requirement: "Valley simulation does NOT pause during the loading transition itself — it runs continuously through the transition overlay; only camera/input hand off."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-scene-world-management-055
    system: scene-world-management
    gdd: design/gdd/scene-world-management.md
    requirement: "A transition while game-paused is allowed: the overlay animates on raw delta, the pause state persists unchanged through the transition, and an abort unwinds on the same raw delta."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-scene-world-management-056
    system: scene-world-management
    gdd: design/gdd/scene-world-management.md
    requirement: "Building System clears its undo stack on the transition-COMPLETE signal (never on begin — clearing on begin would wipe undo when a failed load aborts)."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-scene-world-management-057
    system: scene-world-management
    gdd: design/gdd/scene-world-management.md
    requirement: "Load-failure error message UI: full-screen or toast overlay shown when a target scene fails to load."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-scene-world-management-058
    system: scene-world-management
    gdd: design/gdd/scene-world-management.md
    requirement: "On min-spec target hardware, a dungeon-entry scene load completes within loading_transition_duration + 0.1s tolerance."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-scene-world-management-059
    system: scene-world-management
    gdd: design/gdd/scene-world-management.md
    requirement: "None of the first 30 frames after overlay dismissal exceeds the NEW scene's settled steady-state baseline (avg frame time over frames 60-90 post-transition-complete, same scene, min-spec hardware) by more than 50%."
    created: 2026-07-11
    revised: ""
    status: active

  # ── Voxel World / Grid Data ─────────────────────────────────────────────
  - id: TR-voxel-world-017
    system: voxel-world
    gdd: design/gdd/voxel-world.md
    requirement: "Raycast picking is a DDA-style grid walk within the read API's behavioral contract; WHICH implementation (native physics collision vs. manual DDA) is deliberately left to the rendering ADR, not decided in the GDD."
    created: 2026-07-11
    revised: "2026-07-11"
    status: active
  - id: TR-voxel-world-018
    system: voxel-world
    gdd: design/gdd/voxel-world.md
    requirement: "Collider strategy: per-cell colliders for tens of thousands of terrain cells are a known Jolt/scene-tree scalability trap — the ADR must decide picking mechanism and collider granularity together, not separately."
    created: 2026-07-11
    revised: "2026-07-11"
    status: active
  - id: TR-voxel-world-021
    system: voxel-world
    gdd: design/gdd/voxel-world.md
    requirement: "This system exposes an iteration API over occupied (non-empty) cells, so Save/Load doesn't need to know internal storage details; the iteration returns only non-empty cells."
    created: 2026-07-11
    revised: "2026-07-11"
    status: active
  - id: TR-voxel-world-023
    system: voxel-world
    gdd: design/gdd/voxel-world.md
    requirement: "No hardcoded values in implementation — world bounds, base_height, amplitude, frequency are read from config, not literals in code."
    created: 2026-07-11
    revised: "2026-07-11"
    status: active
  - id: TR-voxel-world-025
    system: voxel-world
    gdd: design/gdd/voxel-world.md
    requirement: "The voxel rendering representation is an architecture decision (resolved by ADR-0014: chunked mesher; formerly open per ADR-0003)."
    created: 2026-07-11
    revised: 2026-07-11
    status: active
  - id: TR-voxel-world-003
    system: voxel-world
    gdd: design/gdd/voxel-world.md
    requirement: "Every cell holds exactly one of: empty, or a block record containing a block-type identifier and a material identifier; no layering — one cell = one occupant."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-voxel-world-007
    system: voxel-world
    gdd: design/gdd/voxel-world.md
    requirement: "The system exposes a low-level write API (set cell contents, clear a cell); placement validity and undo are NOT this layer's concern."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-voxel-world-012
    system: voxel-world
    gdd: design/gdd/voxel-world.md
    requirement: "cell_size is a fixed constant = 1.0 (locked, Visual Direction Note): edge length of one cell; blocks are flush, no gap."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-voxel-world-016
    system: voxel-world
    gdd: design/gdd/voxel-world.md
    requirement: "The world is a bounded 3D grid of cells addressed by integer coordinates (Vector3i), with a minimum and maximum extent set at world generation — finite, not infinite/streaming."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-voxel-world-019
    system: voxel-world
    gdd: design/gdd/voxel-world.md
    requirement: "A single cell read or write must be O(1) relative to grid size (milestone-gated: verified at the pre-VS spike, not per-story)."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-voxel-world-026
    system: voxel-world
    gdd: design/gdd/voxel-world.md
    requirement: "Terrain generation must run synchronously before the first visible scene; at the 2000x2000x32 scale the initial view-window mesh build (~2.6 s) runs behind Scene/World Management's transition overlay (ADR-0014)."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-voxel-world-027
    system: voxel-world
    gdd: design/gdd/voxel-world.md
    requirement: "The grid origin is fixed at (0,0,0) and no negative cell coordinates ever exist — bounds checks are simple non-negative comparisons."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-voxel-world-028
    system: voxel-world
    gdd: design/gdd/voxel-world.md
    requirement: "Block-type/material identifiers are ids defined by the Resource & Item Database, stored as opaque values and never resolved by this system — no runtime dependency in either direction."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-voxel-world-029
    system: voxel-world
    gdd: design/gdd/voxel-world.md
    requirement: "At world generation, terrain cells are populated procedurally within the bounded extent; every other cell starts empty and available for building; the system transitions Uninitialized -> Generated."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-voxel-world-030
    system: voxel-world
    gdd: design/gdd/voxel-world.md
    requirement: "Terrain cells and player-placed cells are stored identically — no data-level flag distinguishing natural from built; identical reads are indistinguishable."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-voxel-world-031
    system: voxel-world
    gdd: design/gdd/voxel-world.md
    requirement: "The system exposes a read API: get cell contents (returning the occupant matching the last write), raycast against occupied cells, and neighbor lookup."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-voxel-world-032
    system: voxel-world
    gdd: design/gdd/voxel-world.md
    requirement: "Every write emits exactly one change signal identifying the changed cell and its before/after contents, so dependent systems react without polling."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-voxel-world-033
    system: voxel-world
    gdd: design/gdd/voxel-world.md
    requirement: "No concurrent writes — mutations are serialized one at a time (Mutating state)."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-voxel-world-034
    system: voxel-world
    gdd: design/gdd/voxel-world.md
    requirement: "This system's root attaches under the scene Scene/World Management loads (hosting relationship, not data)."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-voxel-world-035
    system: voxel-world
    gdd: design/gdd/voxel-world.md
    requirement: "Cell->World conversion: world_pos = Vector3(cell) * cell_size + Vector3(0.5,0.5,0.5) * cell_size — the result is the cell's center point."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-voxel-world-036
    system: voxel-world
    gdd: design/gdd/voxel-world.md
    requirement: "World->Cell conversion uses floor() per axis, not truncation, so near-zero world positions map cleanly to an out-of-bounds cell instead of aliasing into cell 0."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-voxel-world-037
    system: voxel-world
    gdd: design/gdd/voxel-world.md
    requirement: "A query/write for a cell outside the world bounds returns an explicit 'outside grid' result — never a silent clamp to the edge or a crash."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-voxel-world-038
    system: voxel-world
    gdd: design/gdd/voxel-world.md
    requirement: "Procedural terrain height: h(x,z) = clamp(round(base_height + amplitude * noise2D(x*frequency, z*frequency)), min_y, max_y) — output hard-clamped to [min_y, max_y]."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-voxel-world-039
    system: voxel-world
    gdd: design/gdd/voxel-world.md
    requirement: "noise2D is a deterministic, seeded 2D noise function returning [-1, 1]."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-voxel-world-040
    system: voxel-world
    gdd: design/gdd/voxel-world.md
    requirement: "Vector3i integer arithmetic is exact (no epsilon comparisons); use Godot 4.4+ typed Dictionaries (Dictionary[Vector3i, ...]) for small lookup tables."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-voxel-world-041
    system: voxel-world
    gdd: design/gdd/voxel-world.md
    requirement: "Bulk cell storage is chunked packed arrays (~1-4 B/cell) behind the UNCHANGED public accessor API (O(1) get/set by Vector3i, cell_changed, raycast_cells) per ADR-0014."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-voxel-world-042
    system: voxel-world
    gdd: design/gdd/voxel-world.md
    requirement: "A bulk write affecting N cells emits exactly ONE batched change signal, never one per cell."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-voxel-world-043
    system: voxel-world
    gdd: design/gdd/voxel-world.md
    requirement: "The batched signal payload AND the bulk-write API's return value carry the per-cell previous (before/after) contents for EVERY affected cell, keeping undo lossless."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-voxel-world-044
    system: voxel-world
    gdd: design/gdd/voxel-world.md
    requirement: "Terrain generation emits at most ONE batched change signal (or none, if listeners attach only after the Generated state) — never per-cell signals."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-voxel-world-045
    system: voxel-world
    gdd: design/gdd/voxel-world.md
    requirement: "Writing to an already-occupied cell always overwrites and returns the previous contents; whether overwriting SHOULD be allowed is the caller's (Building System's) decision."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-voxel-world-046
    system: voxel-world
    gdd: design/gdd/voxel-world.md
    requirement: "If base_height is misconfigured above max_y, terrain clamps flat at max_y with no crash and a warning is logged."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-voxel-world-047
    system: voxel-world
    gdd: design/gdd/voxel-world.md
    requirement: "Read/raycast queries never mutate grid state and remain cheap (O(1)) regardless of call frequency (e.g. per-frame hover picking)."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-voxel-world-048
    system: voxel-world
    gdd: design/gdd/voxel-world.md
    requirement: "Save/Load iteration over occupied cells observes only fully-committed cell states, never a partial/in-progress write (torn-read prevention via serialized mutations)."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-voxel-world-049
    system: voxel-world
    gdd: design/gdd/voxel-world.md
    requirement: "A raycast correctly returns the first occupied cell along the ray (or none), independent of the eventual rendering/picking mechanism."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-voxel-world-050
    system: voxel-world
    gdd: design/gdd/voxel-world.md
    requirement: "Floor terrain-replace: a floor blueprint placed starting on a terrain top-surface cell replaces that terrain cell flush with the floor block (never stacked, never left empty/AIR); the write record stores the terrain cell's original value as restore_value, so a later undo, cancel, or demolition restores the original terrain exactly."
    created: 2026-07-23
    revised: ""
    status: active
  - id: TR-voxel-world-051
    system: voxel-world
    gdd: design/gdd/voxel-world.md
    requirement: "Terrain dig orders: only terrain-band/sand values (the 1..5 value family, explicitly EXCLUDING water and trunk/leaves) may be removed via a released dig order executed by a villager; removal goes through the SAME batched write API as every other removal (no special dig-order API surface) and emits the standard change signal so downstream consumers observe the cells_removed change and re-evaluate room/shelter analysis."
    created: 2026-07-23
    revised: ""
    status: active
  - id: TR-voxel-world-052
    system: voxel-world
    gdd: design/gdd/voxel-world.md
    requirement: "Mesher winding/culling hard engine requirement: generated triangles must wind clockwise (CW — Godot 4.7's front-face convention) with backface culling ENABLED; the slice's CCW + CULL_DISABLED mitigation is a documented, temporary, accepted deviation that doubles overdraw and must be rewound before asset counts scale beyond vertical-slice levels; face-winding audits must validate against the ENGINE's actual convention, never a self-stored assumption."
    created: 2026-07-23
    revised: ""
    status: active
  - id: TR-voxel-world-053
    system: voxel-world
    gdd: design/gdd/voxel-world.md
    requirement: "The 16,000x16,000x32 production world target is gated behind a dedicated storage/streaming spike (successor to ADR-0014) that must resolve one of: paged/on-demand chunk loading, sparse storage for far/unvisited regions, or a reduced persisted footprint — a storage/residency problem (~11 GB naive projection vs the 4 GB ceiling), not a rendering problem; save files scale with the same ~64x areal factor and need the same resolution."
    created: 2026-07-23
    revised: ""
    status: active

  # ── Camera & Input ──────────────────────────────────────────────────────
  - id: TR-camera-input-019
    system: camera-input
    gdd: design/gdd/camera-input.md
    requirement: "No hardcoded values — all tuning knob values are read from config/exported vars, verified by code review."
    created: 2026-07-11
    revised: "2026-07-11"
    status: active
  - id: TR-camera-input-020
    system: camera-input
    gdd: design/gdd/camera-input.md
    requirement: "When a mouse click is consumed by a UI element (Building UI / Villager Info UI click-ownership), this system does NOT also emit the corresponding world-action signal for that same click — exactly one owner per click."
    created: 2026-07-11
    revised: "2026-07-11"
    status: active
  - id: TR-camera-input-021
    system: camera-input
    gdd: design/gdd/camera-input.md
    requirement: "Camera position is always derived as target + spherical offset (distance, yaw, pitch), never stored independently."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-camera-input-022
    system: camera-input
    gdd: design/gdd/camera-input.md
    requirement: "Middle-mouse-drag rotates: horizontal drag changes yaw, vertical drag changes pitch within the pitch clamp bounds, proportional to mouse_drag_sensitivity."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-camera-input-023
    system: camera-input
    gdd: design/gdd/camera-input.md
    requirement: "Q/E keys rotate yaw by a fixed step (q_e_rotate_step) per press."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-camera-input-024
    system: camera-input
    gdd: design/gdd/camera-input.md
    requirement: "Mouse wheel zoom scales distance multiplicatively per wheel event, clamped to [distance_min, distance_max]."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-camera-input-025
    system: camera-input
    gdd: design/gdd/camera-input.md
    requirement: "WASD pans the orbit target along the ground plane, direction relative to current camera yaw, scaled by delta-time and current distance."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-camera-input-026
    system: camera-input
    gdd: design/gdd/camera-input.md
    requirement: "The orbit target is clamped to the Voxel World's horizontal bounds (plus small margin); pan at a bound yields zero further delta with no error, input not blocked."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-camera-input-027
    system: camera-input
    gdd: design/gdd/camera-input.md
    requirement: "This system owns InputMap action definitions but never interprets them — it only reports 'this action fired' via a signal whose payload is the action name string, with no branch on that string."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-camera-input-028
    system: camera-input
    gdd: design/gdd/camera-input.md
    requirement: "Exposes a current mouse world-ray query (from camera projection + mouse screen position) so consuming systems never recompute the camera projection."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-camera-input-029
    system: camera-input
    gdd: design/gdd/camera-input.md
    requirement: "The mouse world-ray is ALWAYS computable in every state including Suspended (frozen but valid transform) — callers never need an availability branch."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-camera-input-030
    system: camera-input
    gdd: design/gdd/camera-input.md
    requirement: "Raw-delta contract: all camera motion (rotate, zoom, pan) is driven by raw engine delta-time, never Time & Tick's game_delta; camera feel identical at 1x/2x/3x warp."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-camera-input-031
    system: camera-input
    gdd: design/gdd/camera-input.md
    requirement: "Pause contract: game pause does NOT suspend this system — camera stays controllable and input dispatch continues while paused; Suspended (scene-transition state) and Pause are independent."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-camera-input-032
    system: camera-input
    gdd: design/gdd/camera-input.md
    requirement: "Owned InputMap actions are registered in project.godot at project scope (not created at runtime); the authoritative list is the union of actions named by downstream GDDs, so every downstream-referenced action exists at boot."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-camera-input-033
    system: camera-input
    gdd: design/gdd/camera-input.md
    requirement: "Suspended is released and Active re-entered on transition-complete OR transition-abort (either end-signal, never complete alone — three-signal contract with Scene/World Management)."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-camera-input-034
    system: camera-input
    gdd: design/gdd/camera-input.md
    requirement: "When a scene transition begins, the camera enters Suspended: position freezes, no rotate/zoom/pan, and input events are not dispatched to gameplay systems."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-camera-input-035
    system: camera-input
    gdd: design/gdd/camera-input.md
    requirement: "Suspension takes effect the moment the transition-begin signal is processed — a same-frame later input is already ignored; an earlier-processed input stands (accepted single-frame greyzone)."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-camera-input-036
    system: camera-input
    gdd: design/gdd/camera-input.md
    requirement: "No direct connection to Voxel World: Camera & Input only provides the mouse world-ray and never calls Voxel World itself (Building System forwards the ray)."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-camera-input-037
    system: camera-input
    gdd: design/gdd/camera-input.md
    requirement: "Pitch must never approach the poles (±90°) where the spherical derivation degenerates; the 0.15–1.5 rad clamp is this fixed safety margin."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-camera-input-038
    system: camera-input
    gdd: design/gdd/camera-input.md
    requirement: "World-ray origin and direction must be computed from the same screen point in the same frame (never cache one and recompute the other)."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-camera-input-039
    system: camera-input
    gdd: design/gdd/camera-input.md
    requirement: "Nothing in this system branches on input device identity (4.7 DEVICE_ID constants irrelevant); actions route through named InputMap actions and typed event checks only."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-camera-input-040
    system: camera-input
    gdd: design/gdd/camera-input.md
    requirement: "Rotation input pushing pitch beyond its bounds clamps silently to the boundary with no error."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-camera-input-041
    system: camera-input
    gdd: design/gdd/camera-input.md
    requirement: "If a scene transition begins while the rotate mouse button is held, the held button is ignored until released and re-pressed."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-camera-input-042
    system: camera-input
    gdd: design/gdd/camera-input.md
    requirement: "On return from Suspended to Active the camera resumes with the exact same yaw/pitch/distance/target it had when frozen — no snap, no catching up on queued input."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-camera-input-043
    system: camera-input
    gdd: design/gdd/camera-input.md
    requirement: "Delta-time is clamped to max_delta_time before entering the Pan formula, preventing a large camera jump after a hitch/stall."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-camera-input-044
    system: camera-input
    gdd: design/gdd/camera-input.md
    requirement: "Rapid mouse-wheel events each independently apply the zoom factor; the distance clamp holds regardless of event count (no compounding overshoot)."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-camera-input-045
    system: camera-input
    gdd: design/gdd/camera-input.md
    requirement: "The mouse cursor changes during an active rotate-drag (e.g., grab/orbit icon) to signal the drag is engaged."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-camera-input-046
    system: camera-input
    gdd: design/gdd/camera-input.md
    requirement: "Input-to-response latency for rotate, zoom, and pan is at most ~16ms (1 frame at 60fps) — input registers the same frame it occurs."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-camera-input-047
    system: camera-input
    gdd: design/gdd/camera-input.md
    requirement: "Camera position recomputation and input processing complete within the frame budget every frame (deferred — requires full build + profiling)."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-camera-input-048
    system: camera-input
    gdd: design/gdd/camera-input.md
    requirement: "All 'exact same value' comparisons in the acceptance criteria (e.g., restored yaw/pitch/distance/target) mean equality within 1e-4, not bitwise float equality."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-camera-input-049
    system: camera-input
    gdd: design/gdd/camera-input.md
    requirement: "Pan-bound margin 0 (the current default) is a valid configuration: hard against a world edge the clamp still yields zero further delta with no error."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-camera-input-050
    system: camera-input
    gdd: design/gdd/camera-input.md
    requirement: "Round-trip projection correctness: intersecting the world-ray with the ground plane and re-projecting to screen space yields the original mouse position within 1 pixel."
    created: 2026-07-11
    revised: ""
    status: active

  # ── Time & Tick System ──────────────────────────────────────────────────
  - id: TR-time-tick-system-020
    system: time-tick-system
    gdd: design/gdd/time-tick-system.md
    requirement: "No hardcoded values — time_warp_options, ticks_per_second, max_ticks_per_frame, and max_raw_delta are all read from config."
    created: 2026-07-11
    revised: "2026-07-11"
    status: active
  - id: TR-time-tick-system-007
    system: time-tick-system
    gdd: design/gdd/time-tick-system.md
    requirement: "When a tick fires, exactly ONE global broadcast occurs per tick — all subscribed systems share the same emission; no per-consumer timers exist anywhere in the project."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-time-tick-system-021
    system: time-tick-system
    gdd: design/gdd/time-tick-system.md
    requirement: "Every frame the system computes game delta-time via the canonical formula game_delta = clamp(raw_delta, 0, max_raw_delta) * time_warp * (paused ? 0 : 1)."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-time-tick-system-022
    system: time-tick-system
    gdd: design/gdd/time-tick-system.md
    requirement: "All simulation systems query game delta-time, never raw engine delta."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-time-tick-system-023
    system: time-tick-system
    gdd: design/gdd/time-tick-system.md
    requirement: "Time-warp has three fixed speeds — 1x, 2x, 3x — switchable via player input (Building UI owns the MVP time controls)."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-time-tick-system-024
    system: time-tick-system
    gdd: design/gdd/time-tick-system.md
    requirement: "Pause is a separate, independent toggle: enabling sets game delta to 0 WITHOUT discarding the stored time-warp speed; disabling resumes at that exact speed."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-time-tick-system-025
    system: time-tick-system
    gdd: design/gdd/time-tick-system.md
    requirement: "The system does NOT use Godot's global Engine.time_scale — it maintains its own multiplier so non-simulation systems (Camera & Input, UI animations) remain unaffected by pause/warp; Engine.time_scale stays at default 1.0."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-time-tick-system-026
    system: time-tick-system
    gdd: design/gdd/time-tick-system.md
    requirement: "Raw engine delta remains available to every system unmodified — the system does not intercept or replace it, it only additionally computes and exposes game delta as a derived value."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-time-tick-system-027
    system: time-tick-system
    gdd: design/gdd/time-tick-system.md
    requirement: "Game delta-time is NOT paused or altered by Scene/World Management's Transitioning state — simulation continues uninterrupted through scene transitions; only the player's explicit Pause toggle affects it."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-time-tick-system-028
    system: time-tick-system
    gdd: design/gdd/time-tick-system.md
    requirement: "In addition to continuous game delta, the system emits a discrete tick signal at a fixed rate (ticks_per_second, scaled by time-warp), decoupling simulation step rate from render frame rate."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-time-tick-system-029
    system: time-tick-system
    gdd: design/gdd/time-tick-system.md
    requirement: "Ticks do NOT fire while paused."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-time-tick-system-030
    system: time-tick-system
    gdd: design/gdd/time-tick-system.md
    requirement: "Time-warp and pause are global game state persisting unchanged across all scene transitions; no system calls into this one on transition events."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-time-tick-system-031
    system: time-tick-system
    gdd: design/gdd/time-tick-system.md
    requirement: "raw_delta is clamped to max_raw_delta BEFORE game_delta is computed and before all use in this system — prevents huge one-frame jumps for continuous consumers, not just the tick accumulator."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-time-tick-system-032
    system: time-tick-system
    gdd: design/gdd/time-tick-system.md
    requirement: "The tick accumulator is drift-free: fires a tick each time it crosses tick_interval via subtraction, never reset to 0; drift over 10,000 ticks at fixed raw_delta must stay under one tick_interval."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-time-tick-system-033
    system: time-tick-system
    gdd: design/gdd/time-tick-system.md
    requirement: "The tick accumulator runs in _physics_process (fixed 60Hz step), not _process, for deterministic, frame-rate-independent simulation."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-time-tick-system-034
    system: time-tick-system
    gdd: design/gdd/time-tick-system.md
    requirement: "The accumulator MUST be float64 (GDScript float) so long sessions don't lose sub-tick precision."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-time-tick-system-035
    system: time-tick-system
    gdd: design/gdd/time-tick-system.md
    requirement: "ticks_to_fire = min(raw_ticks, max_ticks_per_frame) — excess accumulated time beyond the cap is discarded, not deferred."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-time-tick-system-036
    system: time-tick-system
    gdd: design/gdd/time-tick-system.md
    requirement: "Downstream consumers must derive durations from tick COUNTS they observe, never from wall-clock or game-clock arithmetic that assumes no tick was ever lost."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-time-tick-system-037
    system: time-tick-system
    gdd: design/gdd/time-tick-system.md
    requirement: "Repeatedly hitting the tick catch-up cap across consecutive frames gets no special handling in this system — it is a performance signal to be fixed via profiling; this system only bounds overload."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-time-tick-system-038
    system: time-tick-system
    gdd: design/gdd/time-tick-system.md
    requirement: "At game boot (Booting state) the system defaults to paused = false, time_warp = 1."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-time-tick-system-039
    system: time-tick-system
    gdd: design/gdd/time-tick-system.md
    requirement: "Rapid successive Pause/time-warp toggles are each processed immediately and independently — no debounce."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-time-tick-system-040
    system: time-tick-system
    gdd: design/gdd/time-tick-system.md
    requirement: "A time-warp change while paused is accepted and stored but has no effect until resumed — pause survives the warp change and the warp change survives the pause."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-time-tick-system-041
    system: time-tick-system
    gdd: design/gdd/time-tick-system.md
    requirement: "Exposes a pause/warp API consumed by Building UI, which calls it and displays the returned state (Building UI owns the MVP time controls)."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-time-tick-system-042
    system: time-tick-system
    gdd: design/gdd/time-tick-system.md
    requirement: "Pause/time-warp toggling must register within 1 frame (~16ms)."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-time-tick-system-043
    system: time-tick-system
    gdd: design/gdd/time-tick-system.md
    requirement: "UI must provide a pause indicator (icon/overlay) and a speed indicator (1x/2x/3x), likely as a small Time HUD element (exact placement defined at /ux-design)."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-time-tick-system-044
    system: time-tick-system
    gdd: design/gdd/time-tick-system.md
    requirement: "game_delta and tick-accumulator computation stay under 0.5ms combined per physics frame."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-time-tick-system-045
    system: time-tick-system
    gdd: design/gdd/time-tick-system.md
    requirement: "Requesting pause while already paused is idempotent: state is unchanged and no duplicate pause side effects (audio dampening, signal emissions) occur."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-time-tick-system-046
    system: time-tick-system
    gdd: design/gdd/time-tick-system.md
    requirement: "Any external change to time_warp never modifies the tick accumulator's stored value — warp changes only affect future game_delta, never banked time."
    created: 2026-07-11
    revised: ""
    status: active

  # ── Resource & Item Database ────────────────────────────────────────────
  - id: TR-resource-item-database-007
    system: resource-item-database
    gdd: design/gdd/resource-item-database.md
    requirement: "Validation produces a STRUCTURED result — a list of records each carrying at least entry id, source file, violated check, and offending field — rendered/logged by the boot path AND returned by the validation call itself (dependency-injectable) so headless tests assert on the structure, not log strings."
    created: 2026-07-11
    revised: "2026-07-11"
    status: active
  - id: TR-resource-item-database-010
    system: resource-item-database
    gdd: design/gdd/resource-item-database.md
    requirement: "Returned definitions are immutable to callers via a getter-only ItemDefinition wrapper (no setters) around the shared internal ItemDefinitionResource — deliberately not a defensive copy; guarantee covers idiomatic mutation, not Object.get()/set() reflection bypass (ADR-0006 residual risk)."
    created: 2026-07-11
    revised: "2026-07-11"
    status: active
  - id: TR-resource-item-database-019
    system: resource-item-database
    gdd: design/gdd/resource-item-database.md
    requirement: "Boot sequencing: Scene/World Management's Booting state gates on this database reaching Ready before Building System / Villager AI initialize; no dependency back on Scene/World Management."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-resource-item-database-023
    system: resource-item-database
    gdd: design/gdd/resource-item-database.md
    requirement: "Every entry's visual_asset (a typed Mesh reference per ADR-0006, not a path string) must resolve at boot; two failure shapes halt boot naming the entry: the entry's backing .tres fails to load entirely, or it loads with a null visual_asset field."
    created: 2026-07-11
    revised: "2026-07-11"
    status: active

  - id: TR-resource-item-database-002
    system: resource-item-database
    gdd: design/gdd/resource-item-database.md
    requirement: "Definitions are authored as external data resources (gameplay values data-driven, never hardcoded); every definition field is authored external data, so tuning means editing entries, not code."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-resource-item-database-005
    system: resource-item-database
    gdd: design/gdd/resource-item-database.md
    requirement: "Boot-time validation pipeline over all entries: id uniqueness, id format, known category/family, required fields present, max_stack_size>=1 where stackable, tier>=0 integer, category-family pairing, tier-0 family coverage, reserved-id rejection, retired-ids ledger."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-resource-item-database-006
    system: resource-item-database
    gdd: design/gdd/resource-item-database.md
    requirement: "Failed state is TERMINAL: error screen shown, Valley scene never attached, nothing further instantiated; recovery requires fixing the data and restarting the application; DB remains permanently non-Ready for the session."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-resource-item-database-020
    system: resource-item-database
    gdd: design/gdd/resource-item-database.md
    requirement: "Definitions are exposed through a lookup API that other systems query by id — entries are referenced only by opaque string id, never a direct Resource reference (canonical statement)."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-resource-item-database-021
    system: resource-item-database
    gdd: design/gdd/resource-item-database.md
    requirement: "Save files store ids only — never definition contents; on load, stored ids are resolved against the current database (restatement of the id-only reference contract)."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-resource-item-database-024
    system: resource-item-database
    gdd: design/gdd/resource-item-database.md
    requirement: "Every resource/material/item has exactly one definition, identified by a unique, stable snake_case string id; an id shipped in a save is never renamed or reused for a different thing."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-resource-item-database-025
    system: resource-item-database
    gdd: design/gdd/resource-item-database.md
    requirement: "Database loads once at boot, validates, and is immutable for the session; nothing modifies a definition at runtime; a second load/initialize call mid-session is rejected with an error result (AC28)."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-resource-item-database-026
    system: resource-item-database
    gdd: design/gdd/resource-item-database.md
    requirement: "tier serves EXACTLY ONE gating axis — Township Progression's prosperity/availability ladder for materials; Recipe & Blueprint Unlocks does NOT key off tier (references item ids plus its own condition list)."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-resource-item-database-027
    system: resource-item-database
    gdd: design/gdd/resource-item-database.md
    requirement: "Every entry carries the ten schema fields: id, display_name, category, material_family, tier, visual_asset, stackable, max_stack_size, haulable, storage_category — queries return authored data exactly (AC2)."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-resource-item-database-028
    system: resource-item-database
    gdd: design/gdd/resource-item-database.md
    requirement: "Fields marked 'Authored, unused until Alpha' are required-present in MVP data files — boot validation enforces presence; only their consumption is deferred to Alpha."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-resource-item-database-029
    system: resource-item-database
    gdd: design/gdd/resource-item-database.md
    requirement: "Fixed category set of five authorable categories (building_material, furniture_fixture, raw_resource, consumable, equipment); adding a category is a schema change, not a data edit."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-resource-item-database-030
    system: resource-item-database
    gdd: design/gdd/resource-item-database.md
    requirement: "Reserved, non-authorable sixth category 'missing' and reserved id 'missing_item' exist solely for the built-in fallback; boot validation rejects any authored entry using either."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-resource-item-database-031
    system: resource-item-database
    gdd: design/gdd/resource-item-database.md
    requirement: "Exactly three building materials ship at tier 0 (wood_block, stone_block, thatch_block), >=1 per material family (boot-enforced coverage); Building System treats them as always available and free in MVP."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-resource-item-database-032
    system: resource-item-database
    gdd: design/gdd/resource-item-database.md
    requirement: "Read-only lookup API: get by id, list by category, by material family, by tier, list all; no write API; the database performs no gameplay logic (never computes costs, validates placement, or spawns)."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-resource-item-database-033
    system: resource-item-database
    gdd: design/gdd/resource-item-database.md
    requirement: "missing_item is EXCLUDED from all listing queries — never in a palette, category, family, tier, or recovery-source result; reachable only via direct get-by-id."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-resource-item-database-034
    system: resource-item-database
    gdd: design/gdd/resource-item-database.md
    requirement: "No query is valid outside Ready: in Unloaded, Validating, or Failed, any lookup API call returns an explicit error result per the validation-result contract — never data, never a partial read."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-resource-item-database-035
    system: resource-item-database
    gdd: design/gdd/resource-item-database.md
    requirement: "Boot-halt error names EVERY invalid entry and its source file (proven at >=3 independent violations of different classes, AC7) — never launch with a partially valid database."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-resource-item-database-036
    system: resource-item-database
    gdd: design/gdd/resource-item-database.md
    requirement: "Building System consumer contract: queries building_material/furniture_fixture for its palette, reads tier for the free tier-0 set, reads material_family + visual_asset for rendering; BS owns costs/placement, this DB owns what exists."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-resource-item-database-037
    system: resource-item-database
    gdd: design/gdd/resource-item-database.md
    requirement: "Voxel World identifier mapping: block-type identifier IS this database's id; material identifier IS the entry's material_family value; no second id namespace; Voxel World treats both as opaque and never queries this database."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-resource-item-database-038
    system: resource-item-database
    gdd: design/gdd/resource-item-database.md
    requirement: "Unknown/retired stored ids resolve to the fully inert missing_item (category missing, family none, tier 0, non-stackable/haulable, magenta placeholder, 'Missing Item'); structures preserved cell-for-cell; each distinct missing id logged once per load event."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-resource-item-database-039
    system: resource-item-database
    gdd: design/gdd/resource-item-database.md
    requirement: "Runtime query for an unknown id returns an explicit not-found result and logs the id without crashing; callers that must render resolve to missing_item."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-resource-item-database-040
    system: resource-item-database
    gdd: design/gdd/resource-item-database.md
    requirement: "Duplicate ids across data files fail boot validation (Failed state) naming both entries AND both source files."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-resource-item-database-041
    system: resource-item-database
    gdd: design/gdd/resource-item-database.md
    requirement: "Unknown category or material_family value in an entry fails boot validation naming the entry — categories and families are fixed enums, not free text."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-resource-item-database-042
    system: resource-item-database
    gdd: design/gdd/resource-item-database.md
    requirement: "A retired-ids ledger is kept in the data set; boot validation rejects any new entry whose id appears in it."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-resource-item-database-043
    system: resource-item-database
    gdd: design/gdd/resource-item-database.md
    requirement: "max_stack_size authored on a non-stackable entry is ignored SILENTLY — no warning; the field is only meaningful when stackable is true."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-resource-item-database-044
    system: resource-item-database
    gdd: design/gdd/resource-item-database.md
    requirement: "Query for a category with no entries returns an empty list — a valid result, not an error; consuming systems must handle empty palettes."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-resource-item-database-045
    system: resource-item-database
    gdd: design/gdd/resource-item-database.md
    requirement: "Consuming systems must treat any non-tier-0 entry as unavailable by default in MVP; the Building System palette shows exactly the tier-0 set plus the MVP furniture list — higher-tier entries must never leak in."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-resource-item-database-046
    system: resource-item-database
    gdd: design/gdd/resource-item-database.md
    requirement: "Foundation-layer leaf: reads its own authored data files at boot and depends on no other game system."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-resource-item-database-047
    system: resource-item-database
    gdd: design/gdd/resource-item-database.md
    requirement: "display_name must be built localization-ready even though MVP ships English-only; visual_asset is the source UI systems derive palette icons/previews from."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-resource-item-database-048
    system: resource-item-database
    gdd: design/gdd/resource-item-database.md
    requirement: "Internal cache integrity: a definition re-queried after intervening queries for other ids returns values equal to boot-time values (distinct from external-mutation resistance)."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-resource-item-database-049
    system: resource-item-database
    gdd: design/gdd/resource-item-database.md
    requirement: "A stackable entry with max_stack_size < 1 fails boot validation naming the entry."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-resource-item-database-050
    system: resource-item-database
    gdd: design/gdd/resource-item-database.md
    requirement: "An entry with a negative or non-integer tier fails boot validation naming the entry (the schema's int >= 0 declaration, enforced)."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-resource-item-database-051
    system: resource-item-database
    gdd: design/gdd/resource-item-database.md
    requirement: "Category-family pairing enforced at boot: building_material requires a family from the Visual Direction Note set; every other category requires none — violations halt boot naming the entry."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-resource-item-database-052
    system: resource-item-database
    gdd: design/gdd/resource-item-database.md
    requirement: "Multi-cell furniture footprint: furniture_fixture entries carry a footprint (width_cells x depth_cells, both >= 1) declaring the horizontal cells the placed item's single model spans, anchored at its origin cell; bed is (1, 2) (slice-validated, user-locked); the field states only the fact of the span — Building System owns placement rules; building materials are implicitly (1, 1) and never carry the field."
    created: 2026-07-23
    revised: ""
    status: active
  - id: TR-resource-item-database-053
    system: resource-item-database
    gdd: design/gdd/resource-item-database.md
    requirement: "footprint authored on a non-furniture_fixture entry fails boot validation naming the entry — the field applies only to placed multi-cell furniture; building materials are implicitly (1,1) voxel blocks and never carry it."
    created: 2026-07-23
    revised: ""
    status: active
  - id: TR-resource-item-database-054
    system: resource-item-database
    gdd: design/gdd/resource-item-database.md
    requirement: "A furniture_fixture entry that omits footprint or authors a non-positive dimension fails boot validation naming the entry and the invalid dimension — footprint is consumed immediately at MVP by placement and ghost preview, so it cannot be silently defaulted."
    created: 2026-07-23
    revised: ""
    status: active

  # ── Building System ─────────────────────────────────────────────────────
  - id: TR-building-system-002
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "Every placement tool follows one pipeline pick -> preview -> commit: the mouse world-ray is forwarded to Voxel World's raycast to pick a cell/surface, a ghost preview shows exactly what a commit would create, build_place commits; nothing is ever created without its preview having been visible."
    created: 2026-07-11
    revised: "2026-07-11"
    status: active
  - id: TR-building-system-003
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "While Dragging, the preview re-rasterizes every frame as the cursor moves — the full pending result is always current, never frozen at drag start; above preview_degradation_threshold cells it degrades to an outline."
    created: 2026-07-11
    revised: "2026-07-11"
    status: active
  - id: TR-building-system-023
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "Save/Load must serialize open blueprint cells and construction progress (built cells live in Voxel World's data)."
    created: 2026-07-11
    revised: "2026-07-11"
    status: active
  - id: TR-building-system-026
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "While ToolArmed, the ghost preview follows the pick each frame (a raycast/cell query every frame a tool is armed)."
    created: 2026-07-11
    revised: "2026-07-11"
    status: active
  - id: TR-building-system-033
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "Save/Load: the undo/redo stack is explicitly excluded from save data."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-system-035
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "preview_degradation_threshold (default 128, safe 32-512): above this cell count the live drag preview degrades from per-cell ghosts to an outline/bounding representation, protecting the frame budget while keeping the commit exact."
    created: 2026-07-11
    revised: "2026-07-11"
    status: active
  - id: TR-building-system-038
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "All tuning-knob values are data-driven per the coding standard (no hardcoding); the Building UI exposes only wall_height to the player — the rest are designer-facing config."
    created: 2026-07-11
    revised: "2026-07-11"
    status: active
  - id: TR-building-system-039
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "AC50: a drag exceeding preview_degradation_threshold renders as an outline/bounding representation rather than per-cell ghosts, while the eventual commit remains cell-exact."
    created: 2026-07-11
    revised: "2026-07-11"
    status: active
  - id: TR-building-system-040
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "This system's occupancy check always reads the discrete, tick-boundary-quantized current_cell (a villager occupies from_cell for the whole transit), never an interpolation-progress float (per ADR-0009)."
    created: 2026-07-11
    revised: "2026-07-11"
    status: active
  - id: TR-building-system-041
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "Open: no settlement-wide cap exists on simultaneous Planned/UnderConstruction ghosts, and the degraded outline preview has no stated draw-call story or re-rasterization cadence — both deferred to the building ADR + pre-VS performance spike."
    created: 2026-07-11
    revised: "2026-07-11"
    status: active

  - id: TR-building-system-007
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "Roof formation cell-set functions for Gable/Hip/Shed are specified alongside the shape algorithm at Vertical Slice detail; Flat is specified now for MVP (F5)."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-system-024
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "Writes originating from this system (cell completion, undo removal) are tagged and MUST be ignored by its own undo-invalidation listener — Godot signals fire synchronously, so unwinding a command would otherwise re-enter the listener mid-unwind."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-system-037
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "A construction target cell occupied by a character keeps a valid blueprint, but that cell's construction is deferred until the cell is clear — a cell is never solidified under/while occupied by a character."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-system-042
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "Modal toolset of exactly six MVP tools; exactly one tool active at a time; cancel (right-click/Esc) returns to no-tool (camera-only) mode."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-system-043
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "Surface-aware targeting: placement attaches to the picked block's face or replaces the picked block; drags lock their working height/plane to the surface picked at drag start, never a fixed ground plane."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-system-044
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "Wall tool: a drag defines a line segment that extrudes upright to the current wall height (default 3, adjustable 1-8) in one action — never layer-by-layer slabs."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-system-045
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "Floor tool: a drag defines a rectangle on the picked plane, filled one cell thick with the selected material."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-system-046
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "Roof tool: player picks one of four formations (Flat/Gable/Hip/Shed) and drags a footprint; commit generates the formation's cell set over it."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-system-047
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "Block tool: single-cell place (attach/replace per Rule 3) or remove."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-system-048
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "Furniture tool places furniture_fixture entries (MVP: bed only); requires occupied support cell(s) below; furniture occupies its cells like blocks (one cell = one occupant)."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-system-049
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "A commit is valid iff all cells in bounds, empty (or replace-in-place), material selected/available, cell count <= max_cells_per_command (512), and furniture support holds; invalid commits rejected with visible feedback, never silently; the cap bounds preview, undo payload, and job-queue injection."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-system-050
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "A blueprint floor cell counts as support for a furniture blueprint, but the furniture cell's construction may only start once its support cell is Built."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-system-051
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "Placement validity is geometric availability only; this system never blocks a placement for livability reasons (Build Validation's domain)."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-system-052
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "A valid commit does NOT write blocks — it creates blueprint cells (ghost-rendered, owned here, invisible to Voxel World's data layer)."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-system-053
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "Every blueprint cell is one job; the queue is ordered by commit time — ordering defines availability for display and tie-breaking, not forced servicing order."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-system-054
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "One job per villager at a time; a villager finishes or abandons its current job before claiming another."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-system-055
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "Per-cell claims allow parallelism: N villagers may simultaneously work N distinct cells, including cells of the same command."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-system-056
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "On-site = villager occupies the target cell or an orthogonally adjacent cell (incl. below/above); construction progress advances per game tick only while a claiming villager is on site."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-system-057
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "When a cell's build time elapses, this system issues the Voxel World write and retires the blueprint cell."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-system-058
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "Construction consumes game time via tick events, not raw delta: pause halts construction, time-warp accelerates it."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-system-059
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "MVP cost rule: tier-0 materials and the MVP bed are free — no resource consumed by placement or construction."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-system-060
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "Occupancy authority split: physical occupancy is Voxel World's (blueprints non-solid until Built); planned occupancy must query this system's combined view (blocks + blueprint cells), never raw Voxel World state."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-system-061
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "Terrain is not removable — only player-built cells (blueprint or constructed) and player-placed furniture can be removed."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-system-062
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "The game must be able to distinguish terrain cells from built cells (mechanism deferred to the building ADR)."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-system-063
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "Removal of built cells is instant in MVP (no deconstruction time, no villager involvement); removing a blueprint cell simply cancels it."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-system-064
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "Removing OWNED furniture emits a furniture-revocation event to the owning villager (symmetric to job revocation); removal itself remains instant and never blocked by usage."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-system-065
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "Undo/redo operates on player commands (one drag = one undo step); undo cancels blueprint cells and instantly removes already-built cells (revoking claimed jobs); redo replays the command as new blueprint cells."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-system-066
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "The undo stack is bounded (default 50) and cleared on scene-transition-COMPLETE, never on begin — an aborted/failed transition leaves the stack untouched."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-system-067
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "Entering Suspended or switching tools mid-drag aborts the drag without commit; no partial blueprint is ever created by an aborted drag."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-system-068
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "Per-cell blueprint lifecycle state machine: Planned -> UnderConstruction -> Built/Canceled, with stated entry/exit conditions and queryable state."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-system-069
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "Planned and UnderConstruction cells must be visually distinct: static translucent ghost vs visible tick-driven progress."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-system-070
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "Voxel World's write API is the only mutation path (set/clear on completion/removal); its raycast/read API is used for picking and validity checks."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-system-071
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "Listens to Voxel World's write signals to keep undo bookkeeping honest — a cell changed by anything else invalidates affected undo entries (stale entries skipped without error)."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-system-072
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "When multiple cells complete or are removed in the same frame, this system uses Voxel World's bulk-write API so ONE batched signal fires — never one signal per cell."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-system-073
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "Consumes Camera & Input's InputMap action signals (build_place, build_remove, tool selects — extending that GDD's action list) and the mouse world-ray query; enters Suspended with it."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-system-074
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "Queries the item database palette (building_material + furniture_fixture, tier-0 rule) and reads material_family/visual_asset for previews."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-system-075
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "Exposes construction-completed signals for Build Validation batched per FRAME: N cells completing in one frame, across any commands/villagers, fire ONE completion signal."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-system-076
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "All building UI state lives in this system; the Building UI renders and triggers, never owns."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-system-077
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "F1: wall_cell_count = line_length(start,end) x wall_height; deterministic Bresenham-style rasterization — equal displacements always yield equal cell counts; start==end degenerates to 1 column."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-system-078
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "F2: floor_cell_count = (|dx|+1) x (|dz|+1), one cell thick on the locked plane; zero-length drag degenerates to a single 1x1 tile."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-system-079
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "F3: a cell under active construction completes after base_build_ticks[category] tick events; tick counts are warp-invariant (warp changes wall-clock speed, never tick count)."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-system-080
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "F3 burst rule: the tick budget applies independently per active job; excess ticks never roll over to the villager's next cell; N villagers complete at most N cells per frame."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-system-081
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "F4: is_drag = cursor_travel_px >= drag_threshold_px while build_place is held; release below the threshold is a click (single commit)."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-system-082
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "F5: flat_roof_cell_count = (|dx|+1) x (|dz|+1), one plane above the footprint's highest picked surface; furniture_cell_count = 1 for all MVP furniture."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-system-083
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "Drags beyond world bounds: preview clamps to the bounded grid; commit creates exactly what the preview showed; an entirely out-of-bounds drag commits nothing."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-system-084
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "Replace-in-place targeting a terrain cell is invalid; attaching to a terrain cell's face remains valid."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-system-085
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "Blueprint cells count as occupied for placement validity even though invisible to Voxel World's data layer."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-system-086
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "When the ray misses the world, the ghost preview is hidden and build_place is a no-op — the absence of a ghost is the feedback (plus cursor state)."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-system-087
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "Unreachable jobs stay queued and retried, the ghost never auto-cancels, and the failure is never silent: pulsing orange tint plus a non-modal UI hint, cleared when the job is claimed again."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-system-088
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "Redo re-validates every cell of the command; no-longer-valid cells are dropped with invalid feedback; a zero-survivor redo is a no-op with feedback."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-system-089
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "On undo-stack overflow the oldest command is discarded silently (becomes permanent); any new command clears the redo branch."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-system-090
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "Blueprints and construction progress persist across scene transitions and construction continues while the player is away; Suspended halts tool interaction only, never construction."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-system-091
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "Lockstep invariant: Build Validation's max_room_height (8) must stay >= wall_height's maximum, and villager_clearance (3) equals wall_height's default — retune together."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-system-092
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "The block under the cursor is always visibly highlighted while a tool is armed."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-system-093
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "Ghost previews use the colorblind-safe blue-orange state axis: valid = cool blue translucent ghost, invalid = orange tint — never red-green."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-system-094
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "Materials render per the database's visual_asset and material families; blocks are FLUSH (cell_size 1.0, no gap — supersedes the prototype's 0.96)."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-system-095
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "MVP audio cues: commit confirm, gentle invalid-commit feedback, per-cell completion tick, and a command-complete flourish."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-system-096
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "The ghost preview updates on the same frame as cursor movement (raw input path — stays responsive even while the game is paused)."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-system-097
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "Building while paused is fully allowed: tools, previews, commits, and undo all work in pause — only construction progress waits for game time."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-system-098
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "Commit feedback is immediate: all ghost cells of a command appear on the SAME frame as the commit, never staggered, plus the commit-confirm sound."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-system-099
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "Per-cell completion feedback: one completion tick sound per cell, rate-limited to at most one sound per frame on parallel finishes, plus a <=0.3s non-blocking visual accent."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-system-100
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "Command completion fires once per command (when its LAST cell reaches Built): distinct flourish sound + <=1s visual accent; a 1-cell command fires only the flourish, not both."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-system-101
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "Building UI must present: tool palette (6), material palette (tier-0), wall-height stepper (1-8), roof-formation picker (4), undo/redo with Ctrl+Z/Ctrl+Y (held key repeats at OS rate, each repeat = exactly one undo step), and non-punishing invalid feedback near the cursor."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-system-102
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "Building tools arm ONLY inside an explicit Build/Editor Mode: outside Build Mode none of the six tools can be armed and no ghost preview exists — the toolset is fully inert."
    created: 2026-07-23
    revised: ""
    status: active
  - id: TR-building-system-103
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "Build Mode is entered by the explicit UI toggle OR by arming any tool from the palette while outside it (arming always auto-enters Build Mode first, one player action); it is exited only by the explicit toggle or the Esc chain — never as a side effect of a single tool deactivation."
    created: 2026-07-23
    revised: ""
    status: active
  - id: TR-building-system-104
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "Esc chain is layered with Build Mode always the LAST link: Dragging -> abort drag; ToolArmed -> Idle (still inside Build Mode); Idle -> exit Build Mode, handing world clicks back to selection; a single Esc never skips a link — closing a drag never also closes Build Mode in the same press."
    created: 2026-07-23
    revised: ""
    status: active
  - id: TR-building-system-105
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "Outside Build Mode this system does not consume world clicks at all — they belong to villager/project selection per Camera & Input's click-ownership arbitration (ADR-0010); Off is the default state after boot and after the Esc chain's final link."
    created: 2026-07-23
    revised: ""
    status: active
  - id: TR-building-system-106
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "Job eligibility is gated on project release: a blueprint cell is job-eligible only once its project (or its change-order batch) is in BUILDING state; a Draft cell generates no job and is invisible to claim_job — villagers ignore it entirely; the BUILDING-eligible queue is ordered by commit time, defining availability for display and tie-breaking, not forced servicing order."
    created: 2026-07-23
    revised: ""
    status: active
  - id: TR-building-system-107
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "Build Project grouping/merge: commits whose cells 26-adjoin (full 26-neighbor adjacency, not face- or edge-only) an existing project attach to it; a single commit touching two or more previously separate same-kind projects merges them all into one, resolved by a union-find pass over the whole batch before any cell's membership is finalized (never iteration-order dependent); the lowest-numbered (earliest-created) project id survives and absorbs the others' cells and worker-attribution records."
    created: 2026-07-23
    revised: ""
    status: active
  - id: TR-building-system-108
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "Project states are a rollup over cells, not an independent flag: DRAFT (every cell Draft; no jobs exist; villagers ignore it; free to edit or fully undo) -> BUILDING (released) -> PAUSED (player-paused) -> DONE (every cell Built/Removed among all its projects and no Draft batch pending)."
    created: 2026-07-23
    revised: ""
    status: active
  - id: TR-building-system-109
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "Release ('Bau starten') is a per-project action: it transitions every Draft cell in the project (or, for a change order, just that pending batch) into BUILDING, making them job-eligible; claim_job serves BUILDING-state work only — never DRAFT, PAUSED, or an unreleased change-order batch — and records the claiming villager against the cell (rolled up onto the project) for worker attribution: a queryable, display-only fact, never a mechanical gate."
    created: 2026-07-23
    revised: ""
    status: active
  - id: TR-building-system-110
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "Pause/Resume: pausing a BUILDING project stops offering new jobs and revokes in-flight claims gracefully (villagers abandon exactly as an undo-triggered revocation); the project's cells remain queued; resuming re-offers the same remaining cells without re-creating them; pause/resume never touches Built cells or Draft cells outside the paused batch."
    created: 2026-07-23
    revised: ""
    status: active
  - id: TR-building-system-111
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "Project persistence: a project is a long-lived entity — reaching DONE does not delete it; the project entity is removed only when its cell set becomes empty (every cell canceled, or demolished/excavated away)."
    created: 2026-07-23
    revised: ""
    status: active
  - id: TR-building-system-112
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "Change orders: a new commit 26-adjacent to an existing BUILDING/PAUSED/DONE project does not start a new project — it attaches as a pending batch ('Aenderungen geplant') on that project until the player releases that batch specifically; releasing the batch makes only its cells job-eligible, leaving already-Built cells untouched; a DONE project with a pending batch is no longer fully DONE for rollup — the overall state reflects whichever cells/batches are least-finished."
    created: 2026-07-23
    revised: ""
    status: active
  - id: TR-building-system-113
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "Clicking any cell that belongs to a project selects that project (info surface owned by Building UI) in ANY mode and with NO tool armed — the one form of building-system interaction that works even outside Build Mode."
    created: 2026-07-23
    revised: ""
    status: active
  - id: TR-building-system-114
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "Demolition orders are created already released (no staging step — tearing down needs no blueprint to reconsider) and are executed by villagers block by block, mirroring the construction job contract in reverse (one cell = one job, same on-site rules), taking base_demolition_ticks per cell — never an instant removal."
    created: 2026-07-23
    revised: ""
    status: active
  - id: TR-building-system-115
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "On a cell's demolition completion this system issues the Voxel World clear; if the cell was a floor-excavation replacement of terrain, the original terrain's restore_value is written back instead of leaving an empty cell."
    created: 2026-07-23
    revised: ""
    status: active
  - id: TR-building-system-117
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "Project cancel ('Abriss') converts an entire project at once: every remaining Draft cell (including any not-yet-released change-order batch) cancels for free, and every Built cell is converted to an already-released demolition order in the same action — no additional 'Bau starten' is needed to tear a canceled project down."
    created: 2026-07-23
    revised: ""
    status: active
  - id: TR-building-system-119
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "Undo/redo operate on plan entries exclusively and never reach a Built cell: undoing a command cancels only cells still Draft/Queued/UnderConstruction and leaves Built cells standing exactly as they are — not even queuing a demolition order; tearing those down requires the removal tool or Abriss separately; redo replays the command as new blueprint cells."
    created: 2026-07-23
    revised: ""
    status: active
  - id: TR-building-system-120
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "Floor excavation: a floor-tool drag starting on a terrain top surface replaces the terrain cell flush (Stonehearth-style, never stacking a step); the original terrain value is captured as restore_value on the blueprint entry at commit (a snapshot, never a live query) and restored on cancel, undo, or demolition — no floor replacement can ever result in unbounded/permanent terrain loss."
    created: 2026-07-23
    revised: ""
    status: active
  - id: TR-building-system-121
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "Terrain dig orders / mining zones: removal targeting terrain marks Draft dig cells inside a project of kind dig (26-adjacency/merge applies, but dig-kind projects only ever merge with other dig-kind projects, never with build-kind even if spatially adjacent); dig projects follow the same DRAFT -> BUILDING -> PAUSED/DONE lifecycle with terminal per-cell state Removed; released dig cells respect max_cells_per_command — mining is bounded, never a free-form terraform."
    created: 2026-07-23
    revised: ""
    status: active
  - id: TR-building-system-122
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "Dig-job on-site amendment: for a dig job the target cell itself is EXCLUDED from the on-site set — a villager may stand only on an orthogonal neighbor of the cell it is excavating, never on the cell itself (slice-validated fix: the unamended rule let a villager dig the block directly under its own feet and become trapped)."
    created: 2026-07-23
    revised: ""
    status: active
  - id: TR-building-system-123
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "Removal-tool micro-state branch: Draft -> instant cancel, no job; Queued/UnderConstruction (released but not yet Built) -> instant cancel with the claiming villager's job revoked; Built -> a demolition order; furniture follows the SAME job-gated path with NO instant-removal carve-out (superseded 2026-07-23 by TR-building-system-127) — Built furniture creates a demolition order on its owning project (or a standalone removal order), and the entity/occupant record clears only on job completion."
    created: 2026-07-23
    revised: "2026-07-23"
    status: active
  - id: TR-building-system-124
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "Furniture placement is footprint-based: a footprint is a fixed list of cell offsets from the picked anchor cell; a commit is valid iff every offset cell independently satisfies the support requirement and the availability check; all footprint cells are written/read as ONE furniture entity (every cell references the same occupant id, not N separate entities); furniture_cell_count is per-item, not always 1 (MVP bed is 1x2)."
    created: 2026-07-23
    revised: ""
    status: active
  - id: TR-building-system-126
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "A single higher-level tool commit (room-rect, auto-roof, house-template stamp) is always ONE batch for grouping purposes, regardless of how many primitive cell-sets it internally produces — guaranteeing one project even where sub-shapes would not otherwise be mutually 26-adjacent; these tools emit a normal batch of Draft blueprint cells into exactly one project and add no new system-level behavior beyond the grouping rules."
    created: 2026-07-23
    revised: ""
    status: active
  - id: TR-building-system-127
    system: building-system
    gdd: design/gdd/building-system.md
    requirement: "Furniture removal is job-gated like all built-cell removal (no instant carve-out): the removal tool on Built furniture creates a demolition order on its owning Build Project (or a standalone removal order if none); the furniture entity/occupant record clears only on job completion, and multi-cell footprints (e.g. the 1x2 bed) demolish atomically as ONE job, never per-cell."
    created: 2026-07-23
    revised: ""
    status: active

  # ── Villager AI & Behavior ──────────────────────────────────────────────
  - id: TR-villager-ai-behavior-009
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "Standability predicate: a cell is standable iff the cell below is solid (terrain or Built block — blueprints are non-solid/passable) and the cell plus the two cells above are empty (villager_clearance = 3, registered constant)."
    created: 2026-07-11
    revised: "2026-07-11"
    status: active
  - id: TR-villager-ai-behavior-010
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "Step-legality predicate: a step between adjacent standable cells is legal iff height difference <= 1; orthogonal steps only; a diagonal requires both flanking orthogonal cells passable (no corner-cutting); no jumping, swimming, or climbing in MVP."
    created: 2026-07-11
    revised: "2026-07-11"
    status: active
  - id: TR-villager-ai-behavior-011
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "Walkability rules exposed as the canonical ground truth queried by Build Validation."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-ai-behavior-013
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "Deciding-pass staggering: simultaneous mass-Deciding events stagger selection passes across frames in a stable, deterministic villager order."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-ai-behavior-016
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "Dependency-injected RNG source (live RNG in production, fixed-sequence double in tests) for deterministic wander/micro-behavior selection."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-ai-behavior-027
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "Save/Load: serialize per-villager position, activity, claimed job id, owned bed, need levels; re-validate stale claim/bed ids on load without crashing."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-ai-behavior-035
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "The pathfinding algorithm is an architecture decision — RESOLVED 2026-07-11 via ADR-0007: AStar3D, manually populated with standable cells and legal-step connections, incrementally patched; Core Rules 8-9 remain the canonical predicates the graph is built from."
    created: 2026-07-11
    revised: "2026-07-11"
    status: active
  - id: TR-villager-ai-behavior-036
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "Mid-travel re-path required when a Voxel World write blocks the current path."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-ai-behavior-041
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "Milestone-gated performance: 16.6 ms frame budget maintained at VS population (~5) and Full Vision ceiling (30), simulating at 1x and 3x warp — Advisory/Performance criterion enforced at those milestones, never a blocker for MVP Done."
    created: 2026-07-11
    revised: "2026-07-11"
    status: active
  - id: TR-villager-ai-behavior-046
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "RESOLVED via ADR-0009: the tick-quantized current_cell that resolves the mid-path solidification race also serves F4 nudge-aside targeting and Edge Case 2 walled-in queries identically."
    created: 2026-07-11
    revised: "2026-07-11"
    status: active
  - id: TR-villager-ai-behavior-047
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "Pre-VS performance spike: synthetic 30-villager stress case (unreachable-job-dense + construction write-storm at 3x warp) incl. synchronized mass-Deciding (Rule 10c stagger), Breather/bed-drift pathing, Rule 10b's widened filter scope, and region flood-fill on merged-structure worlds."
    created: 2026-07-11
    revised: "2026-07-11"
    status: active

  - id: TR-villager-ai-behavior-012
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "Re-path filter: a Voxel World write triggers re-path/re-validation for any moving villager ONLY if changed cells intersect the remaining movement's cells or their clearance envelope (each movement cell + 2 above + diagonal flanks); writes elsewhere are ignored by design."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-ai-behavior-029
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "Arrival/tick-boundary rule: first work-progress increment is credited at the NEXT global tick boundary — no partial-tick credit, ever; applies to EVERY Traveling->Working transition including 1-cell steps (F1)."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-ai-behavior-034
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "F4 step semantics: the vacate is a normal walking step at move_speed (F1 interpolation, never a teleport); the builder's target cell remains deferred until the step completes and the cell is clear; no timing promise tied to tick length."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-ai-behavior-042
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "Movement smoothness: continuous interpolation between cells (F1) — a villager must never visibly teleport or snap cell-to-cell."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-ai-behavior-048
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "Agent loop timing split: decisions and work progress happen on game tick events; visible movement interpolates continuously on game delta (smooth motion, stops dead while paused per Time & Tick's rules)."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-ai-behavior-049
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "Activity selection is a strict priority list (urgent need > work > idle), re-evaluated on activity completion, interruption, and periodically every decision_interval ticks so an urgent need can preempt long work."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-ai-behavior-050
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "Graceful preemption: when an urgent need preempts work, the villager finishes the current cell's in-progress tick, then releases its job claim back to the queue and pursues the need (graceful abandon)."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-ai-behavior-051
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "One job (one blueprint cell) per villager; selects the nearest reachable available job by path distance; claiming locks the job — no other villager may claim it until released."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-ai-behavior-052
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "Claims are sticky: periodic re-evaluation never re-runs job selection against a held claim; a claimed job is abandoned only via need-preemption, revocation, or pathing failure — no job-vs-job re-selection mid-travel."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-ai-behavior-053
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "'Available' for the priority list means queue-non-empty — reachability is discovered lazily at selection time (F2), never as a gate on the ranking itself."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-ai-behavior-054
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "On site = the villager occupies the job's target cell or an orthogonally adjacent cell (incl. directly above/below); work progress accrues only while on site."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-ai-behavior-055
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "Unreachable jobs: on pathing failure the villager reports to the Building System, releases the claim, tries the next-nearest job; all villagers retry unreachable jobs every unreachable_retry_ticks (cadence owned here)."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-ai-behavior-056
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "Nudge-aside: builder requests a vacate; an idle/wandering occupant steps to the nearest walkable adjacent cell within one tick; a mid-activity occupant is NOT interrupted (cell stays deferred); a villager never nudges another builder off a claimed job."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-ai-behavior-057
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "Breather beat: after jobs_before_break consecutive completed jobs the villager takes a breather_duration_ticks non-productive rest (steps away via F4 selection, target standable per Rule 8); work-claiming suppressed; urgent needs still preempt normally."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-ai-behavior-058
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "Breather integration: the check slots into Deciding between job-completed and priority tier 2 (only ever begins between jobs); duration runs on a dedicated ticks-since-entry counter independent of decision_interval; environmental interruptions behave like Wandering's."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-ai-behavior-059
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "Idle micro-behaviors: Wandering varies among walking to a target, pausing to look around, sitting briefly on a standable block, and drifting toward the owned bed's area."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-ai-behavior-060
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "Bed-drift is bounded by F3: the drift target is the flood-fill cell nearest the bed WITHIN wander_radius; if the bed lies beyond, drift to the radius edge — never pathing outside F3's bounded set."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-ai-behavior-061
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "Beds have owners: the first villager to need sleep claims an unowned, reachable bed permanently (one bed = one owner); claiming a bed IS the move-in moment."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-ai-behavior-062
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "Urgent sleep: villager goes to its owned bed (or claims one); if no reachable bed exists it sleeps on the ground where it stands at reduced recovery (values owned by Needs GDD); owned bed always preferred over closer unowned beds."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-ai-behavior-063
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "Sleeping ends when the need is restored above its wake threshold (Needs GDD's value); the villager then re-enters the decision loop."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-ai-behavior-064
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "Population ceiling is 20-30 concurrent villagers at Full Vision (MVP: 1; VS: ~5) — a design commitment the performance budget assumes."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-ai-behavior-065
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "Starting roster: at world generation this system places starting_villager_count villagers (config: MVP=1, VS=5) at valid standable cells near the world center; growth beyond it is Township Progression's."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-ai-behavior-066
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "Deciding is instantaneous (same tick) — never a visible stand-and-think pause; the next state is assigned before any further tick is processed within a single decide() invocation."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-ai-behavior-067
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "Wandering exits when any higher-priority activity appears (checked every decision_interval ticks); interruption takes effect at the end of the current 1-cell step."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-ai-behavior-068
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "No Suspended state: villagers keep simulating in the Valley during scene transitions and dungeon excursions (Scene/World Management Core Rule 4); they pause only when game time pauses; continuity verifiable numerically (tick-for-tick)."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-ai-behavior-069
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "Villager AI never mutates the Voxel World grid — construction writes go through the Building System."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-ai-behavior-070
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "Needs consumption model: reads the QUERYABLE per-need state at decision points (decision_interval); urgent/satisfied events are latency hints, never the source of truth — a missed event is harmless."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-ai-behavior-071
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "Recovery reporting: discrete start_recovery(need, source_enum)/stop_recovery(need, reason) calls; source enum is bed_sheltered/bed_unsheltered/ground_no_bed_owned/ground_bed_unreachable/ground_trapped."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-ai-behavior-072
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "F1: travel_time_game_seconds = path_length_cells / move_speed; orthogonal step = 1.0, diagonal = 1.4; 0-length path is valid (immediate arrival)."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-ai-behavior-073
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "Game-time invariance: warp accelerates wall-clock travel proportionally, never the game-time cost; pause leaves position unchanged (F1 invariance)."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-ai-behavior-074
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "Clock model: ticks are a GLOBAL fixed-cadence heartbeat, never a per-villager countdown that resets on travel; sub-tick steps are absorbed between global ticks with zero waste."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-ai-behavior-075
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "Tick-count caveat: max_ticks_per_frame stall-cap discards make 'exactly N ticks' invariants hold only in the no-discard case — consumers must count observed ticks, never derive durations from clock arithmetic."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-ai-behavior-076
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "F2 job selection: chosen_job = argmin(path_length_cells) over available reachable jobs; tie-break by queue order (older commit first), then lexicographic cell coordinates (y, x, z) for same-command ties — same result every run."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-ai-behavior-077
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "F2 approximation contract: candidates pre-filtered to nearest job_candidate_count (5) by Chebyshev distance, true-path checked in rounds up to max_selection_candidates (15) per pass — never a full-queue pathfind; on total failure, fall through the priority list."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-ai-behavior-078
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "F3 wander target: uniform pick from a bounded flood-fill of standable, reachable cells within wander_radius (inclusive boundary) of current position, re-picked every wander_interval ticks; reachability guaranteed by construction (no island targets)."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-ai-behavior-079
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "F4 vacate target: argmin(height_difference) then argMAX(Chebyshev distance to requester) over standable orthogonally adjacent cells; tie-break by fixed N/E/S/W scan order (N=-z, E=+x, S=+z, W=-x); deterministic; occupant steps AWAY; no adjacent standable cell -> request fails, cell stays deferred."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-ai-behavior-080
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "Walled-in villager: stays put — never teleports, clips, or despawns; idles in place with a visible distress cue; urgent sleep falls back to ground sleep in place; player resolves by removing blocks."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-ai-behavior-081
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "Claims are atomic: exactly one contender succeeds (job or bed); same-tick contention resolves deterministically in stable villager processing order; the loser proceeds to its next candidate/fallback."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-ai-behavior-082
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "Urgent need fires while already Traveling to satisfy that same need: no-op. VS+: a DIFFERENT more-urgent need triggers standard preemption; ties break by the Needs GDD's fixed need-priority order."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-ai-behavior-083
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "Job revoked mid-work: villager stops at the current tick boundary, plays no failure reaction, re-enters Deciding; its claim bookkeeping is cleared by the revocation itself."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-ai-behavior-084
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "Bed removed while slept in: Building System's furniture-revocation event (Core Rule 17b) notifies the owner; villager wakes immediately, ownership dissolves, calls stop_recovery, re-enters Deciding."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-ai-behavior-085
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "Bed removed while owned but unoccupied: ownership dissolves silently; a new bed is claimed the next time sleep becomes urgent."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-ai-behavior-086
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "All available jobs unreachable: every job gets reported (orange ghost each); the villager falls through the priority list to Wandering — never stuck in Deciding; retries continue every unreachable_retry_ticks."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-ai-behavior-087
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "Flood-fill returns only the current cell: the villager stays in place without error until the next wander_interval re-pick."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-ai-behavior-088
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "Tick burst (up to max_ticks_per_frame=10): at most one decision re-evaluation per processed tick, in order — decisions consider state as of each processed tick; never 10 contradictory decisions in one frame."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-ai-behavior-089
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "Zero jobs + zero urgent needs: the villager idles indefinitely without error, cycling the Rule 7c micro-behaviors."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-ai-behavior-090
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "All tuning-knob values are data-driven per the coding standard; none are player-facing."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-ai-behavior-091
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "Supplies to Villager Info UI: villager name, current state (Deciding/Traveling/Working/Sleeping/Breather/Wandering — six player-readable labels), current need levels (via Needs GDD), and distress flags (trapped, ground-sleeping); the UI renders and never owns."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-ai-behavior-092
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "A Traveling villager whose target becomes invalid before arrival with no re-path possible exits to Deciding and re-selects — never keeps traveling toward a dead target."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-ai-behavior-093
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "Movement update must be drivable directly with injected game_delta values (no real engine frames): per-step displacement never exceeds move_speed x game_delta — property-based check over >=5 delta samples incl. warp."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-ai-behavior-094
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "Integration test: full claim->build->report cycle with a real villager and one real queued blueprint cell — cell transitions to Built via the Building System's write, job removed from queue, villager re-enters Deciding (closes Building AC21)."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-ai-behavior-095
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "Integration test: occupied->deferred->resumed — after the occupant vacates via F4, the target cell becomes free and construction progress resumes on the next tick without re-claiming the job."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-ai-behavior-096
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "Evidence tiers: AC1-8, 10-36, 41-50 blocking headless unit tests; AC9, 37, 40, 40b blocking integration tests; AC38 provisional-integration; AC39 Advisory/Performance gated at VS/Full-Vision milestones."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-villager-ai-behavior-097
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "Claim attribution: a successful claim records the claiming villager's id on the claim record; the Building System's project entity aggregates these ids into its worker_ids field for per-project attribution — this GDD supplies the id only, ownership of the aggregate field stays with the Building System."
    created: 2026-07-23
    revised: ""
    status: active
  - id: TR-villager-ai-behavior-098
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "Character scale / body-column: the villager model is 2 cells tall (feet cell + one cell above); the body-column the anti-stuck rules must treat as the villager's own space is the same 3-cell span as standability clearance (2-cell body + 1 buffer cell of headroom) — checking only the feet cell would let a rescue or seal-prevention check pass while the model still clips a low ceiling."
    created: 2026-07-23
    revised: ""
    status: active
  - id: TR-villager-ai-behavior-099
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "Unstuck Watchdog: a Traveling/Working villager with zero legal steps (or on a non-standable cell) for unstuck_watchdog_threshold_ticks consecutive ticks is teleported to a standable, unoccupied cell; any held job claim releases back to the queue per the unreachable-job flow; the villager re-enters Deciding; a villager_unstuck event fires incrementing per-villager and world total counters (F3 debug now, future analytics); Idle, Wandering, Sleeping, and Breather villagers are never rescued — the watchdog is the sole exception to the never-teleport rule, scoped strictly to Traveling/Working."
    created: 2026-07-23
    revised: ""
    status: active
  - id: TR-villager-ai-behavior-100
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "Rescue target selection is a bounded search, never teleport-anywhere: the nearest standable, unoccupied cell within unstuck_rescue_search_radius via an expanding-ring search from the current cell (lexicographic cell-coordinate tie-break for determinism); if none is found the radius doubles up to unstuck_rescue_max_radius before the rescue defers to the next tick."
    created: 2026-07-23
    revised: ""
    status: active
  - id: TR-villager-ai-behavior-101
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "Seal prevention: a build-job completion (Planned->Built write) that would leave its builder with zero legal steps is refused — the write does not commit, the claim releases back to the queue, and a different villager may claim and complete the job from a non-self-trapping position; dig and demolition jobs are exempt — their completions are never refused for this reason."
    created: 2026-07-23
    revised: ""
    status: active
  - id: TR-villager-ai-behavior-102
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "Livelock escape: each refusal increments an abandon counter for that specific (job, villager) pair; after seal_prevention_abandon_limit (default 3) refusals of the SAME villager on the SAME job, the write proceeds unconditionally on the next attempt — the builder becomes sealed in and the Unstuck Watchdog rescues it on its normal schedule; a rare self-healing entrapment beats a job that can never complete."
    created: 2026-07-23
    revised: ""
    status: active
  - id: TR-villager-ai-behavior-103
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "Dig onsite exclusion (self-undermine guard): for dig and demolition jobs the onsite position directly above the target cell is excluded from eligibility — a villager may not stand on the block it is digging out and must approach from an orthogonal side; does not apply to build jobs, where standing on/adjacent to a not-yet-Built cell is safe (blueprints are non-solid)."
    created: 2026-07-23
    revised: ""
    status: active
  - id: TR-villager-ai-behavior-104
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "Edge case — watchdog rescue side effects: the teleport releases a held claim exactly as the unreachable-job flow (no double-release, no orphaned claim); with no held claim there is no claim-release side effect and bed ownership is unaffected; the villager re-enters Deciding at the new cell and the villager_unstuck event fires with incremented counters."
    created: 2026-07-23
    revised: ""
    status: active
  - id: TR-villager-ai-behavior-105
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "Edge case — rescue search exhaustion: if no standable, unoccupied cell is found even at max radius, the rescue defers to the next tick (stuck_tick_count keeps incrementing, the search retries every tick) and a villager_unstuck_search_failed event fires exactly once per stuck episode, not once per tick — visible without spamming logs."
    created: 2026-07-23
    revised: ""
    status: active
  - id: TR-villager-ai-behavior-106
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "Edge case — trap-refusal accounting: a build-job completion that would trap its builder is refused with the claim released back to the queue and abandon_count for that (job, villager) pair incremented by 1; a dig or demolition completion in the same situation proceeds unconditionally (the exemption)."
    created: 2026-07-23
    revised: ""
    status: active
  - id: TR-villager-ai-behavior-107
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "Edge case — livelock escape trigger: once the same (job, villager) pair has been refused seal_prevention_abandon_limit times, the next attempt's write proceeds unconditionally regardless of the trap check."
    created: 2026-07-23
    revised: ""
    status: active
  - id: TR-villager-ai-behavior-108
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "Edge case — dig job with only an above onsite position: when a dig/demolition job's only onsite position is directly above the target cell, that position is excluded from onsite eligibility — the villager must approach from an orthogonal side."
    created: 2026-07-23
    revised: ""
    status: active
  - id: TR-villager-ai-behavior-109
    system: villager-ai-behavior
    gdd: design/gdd/villager-ai-behavior.md
    requirement: "Historical evidence citation (Advisory, not a repeatable production-code AC): the vertical slice's automated E2E hut-build regression recorded at least one real Unstuck Watchdog rescue (prototypes/last-seal-vertical-slice/REPORT.md, Feel Assessment) — cited as existing evidence the mechanism activates under real play conditions, not only synthetic unit tests."
    created: 2026-07-23
    revised: ""
    status: active

  # ── Build Validation & Navigability ─────────────────────────────────────
  - id: TR-build-validation-navigability-008
    system: build-validation-navigability
    gdd: design/gdd/build-validation-navigability.md
    requirement: "The reach graph is the villager movement graph, consumed verbatim (Villager AI Rules 8-9: standability with villager_clearance=3, orthogonal steps with max_step_height=1, diagonal steps only when both flanking orthogonal cells are passable) — NOT a plain 4- or 8-neighbor flood-fill."
    created: 2026-07-11
    revised: "2026-07-11"
    status: active
  - id: TR-build-validation-navigability-009
    system: build-validation-navigability
    gdd: design/gdd/build-validation-navigability.md
    requirement: "The outside-connection test walks the movement graph outward from the region's interior cells until it reaches an open-sky standable cell (no solid within max_room_height straight above) or exhausts all reachable cells (then Sealed); reaching another enclosed space's interior is NOT outside."
    created: 2026-07-11
    revised: "2026-07-11"
    status: active
  - id: TR-build-validation-navigability-016
    system: build-validation-navigability
    gdd: design/gdd/build-validation-navigability.md
    requirement: "Config-load-time BLOCKING validation (AC27): max_room_height's safe-range lower bound must stay >= the Building System's maximum wall_height — retune in lockstep; violation fails the load loudly naming the invariant."
    created: 2026-07-11
    revised: "2026-07-11"
    status: active
  - id: TR-build-validation-navigability-019
    system: build-validation-navigability
    gdd: design/gdd/build-validation-navigability.md
    requirement: "Implementation approach (cell flood-fill vs event-scoped NavigationServer3D rebake) is the ADR's call; whichever wins must honor Rule 7's event contract and Rule 2's exact movement graph, with O(affected-region) cell-lookup backing store — recorded as RESOLVED 2026-07-11 by ADR-0007 (cell-rule), provisional pending the pre-VS spike."
    created: 2026-07-11
    revised: "2026-07-11"
    status: active

  - id: TR-build-validation-navigability-006
    system: build-validation-navigability
    gdd: design/gdd/build-validation-navigability.md
    requirement: "Analysis is event-driven, never per-frame: re-evaluation of the affected region runs on Building System construction-completed/removed signals; snapshot updates are incremental — only entries touched by a pass's affected region are patched, full rebuild ONLY on the load pass."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-build-validation-navigability-010
    system: build-validation-navigability
    gdd: design/gdd/build-validation-navigability.md
    requirement: "Villager AI walkability definition consumed verbatim (its Rules 8-10; registry constants), never redefined — no independent copies; ADR-0007: calls the shared is_standable/is_step_legal predicates directly."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-build-validation-navigability-020
    system: build-validation-navigability
    gdd: design/gdd/build-validation-navigability.md
    requirement: "Region detection/outside-connection test is flood-fill/BFS-class, bounded by connectivity itself, deliberately unbounded by any knob: affected region fully recomputed per event, no caching or incremental delta in MVP (accepted cost risk, Open Question 5)."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-build-validation-navigability-021
    system: build-validation-navigability
    gdd: design/gdd/build-validation-navigability.md
    requirement: "Candidate interior cell = standable per Villager AI Rule 8 consumed verbatim (solid below, cell plus two above empty, villager_clearance=3) AND roofed: nearest solid cell straight up at most max_room_height above."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-build-validation-navigability-022
    system: build-validation-navigability
    gdd: design/gdd/build-validation-navigability.md
    requirement: "Furniture occupancy is transparent to the analysis: a furniture-occupied cell evaluates as if empty (furniture never counts as floor, wall, or roof)."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-build-validation-navigability-023
    system: build-validation-navigability
    gdd: design/gdd/build-validation-navigability.md
    requirement: "'Solid' means Voxel World block occupancy only — character positions (including a villager mid-F4-vacate) never affect candidacy; analysis reads only static physical occupancy."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-build-validation-navigability-024
    system: build-validation-navigability
    gdd: design/gdd/build-validation-navigability.md
    requirement: "A candidate region is a maximal orthogonally-connected set of candidate interior cells; orthogonal adjacency defines region membership only (movement/reachability uses the villager movement graph)."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-build-validation-navigability-025
    system: build-validation-navigability
    gdd: design/gdd/build-validation-navigability.md
    requirement: "A candidate region is a valid room iff it has at least min_room_cells interior cells AND at least one villager-walkable connection to the outside world."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-build-validation-navigability-026
    system: build-validation-navigability
    gdd: design/gdd/build-validation-navigability.md
    requirement: "The outside-trace may pass through any standable cell, including another region's interior — a region whose only path to open sky runs through its corner-neighbor's interior and door IS outside-connected."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-build-validation-navigability-027
    system: build-validation-navigability
    gdd: design/gdd/build-validation-navigability.md
    requirement: "A candidate region with NO walkable outside connection is a sealed space — never a room; it raises the sealed-space warning iff it contains need-functional furniture, and is silently ignored if empty."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-build-validation-navigability-028
    system: build-validation-navigability
    gdd: design/gdd/build-validation-navigability.md
    requirement: "Room detection confers no persistent identity in MVP — rooms are re-derived facts about the world; nothing is serialized, all statuses re-derive from the world on load."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-build-validation-navigability-029
    system: build-validation-navigability
    gdd: design/gdd/build-validation-navigability.md
    requirement: "A furniture item is sheltered iff its cell lies inside a valid room, otherwise unsheltered — this flag is the system's one mechanical output, derived purely from the item's own cell."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-build-validation-navigability-030
    system: build-validation-navigability
    gdd: design/gdd/build-validation-navigability.md
    requirement: "The sleep recovery ladder consumes the sheltered flag; the rate values (1.0/0.7/0.4) remain owned by Needs & Mood's source-to-rate table — this system supplies only the sheltered/unsheltered classification."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-build-validation-navigability-031
    system: build-validation-navigability
    gdd: design/gdd/build-validation-navigability.md
    requirement: "MVP analyzes built structures only — blueprint (unbuilt) cells never count as solid; blueprint-stage unreachability is covered by the Building System's orange ghosts."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-build-validation-navigability-032
    system: build-validation-navigability
    gdd: design/gdd/build-validation-navigability.md
    requirement: "Confirmation output: a candidate region becoming a valid room produces the one-shot 'room recognized' celebration cue plus a persistent subtle status (edge-detected and paced per Rule 11)."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-build-validation-navigability-033
    system: build-validation-navigability
    gdd: design/gdd/build-validation-navigability.md
    requirement: "Warning output: need-functional furniture (MVP: the bed; decorative furniture never warns) in a sealed space produces a persistent gentle warning naming the problem."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-build-validation-navigability-034
    system: build-validation-navigability
    gdd: design/gdd/build-validation-navigability.md
    requirement: "Info output: a bed outside any valid room AND not in a sealed space (in the open) produces a low-key unsheltered hint."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-build-validation-navigability-035
    system: build-validation-navigability
    gdd: design/gdd/build-validation-navigability.md
    requirement: "Warning and Info tiers are mutually exclusive per furniture item — Warning supersedes Info; a bed in a sealed space never additionally emits the unsheltered Info hint."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-build-validation-navigability-036
    system: build-validation-navigability
    gdd: design/gdd/build-validation-navigability.md
    requirement: "shelter_status_changed (payload: item id, sheltered bool) is independent of the warning tiers and fires for ALL furniture regardless of type — exactly one emission per transition."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-build-validation-navigability-037
    system: build-validation-navigability
    gdd: design/gdd/build-validation-navigability.md
    requirement: "This system never blocks, reverts, or auto-fixes a placement (Building System Core Rule 10)."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-build-validation-navigability-038
    system: build-validation-navigability
    gdd: design/gdd/build-validation-navigability.md
    requirement: "This system never moves villagers or triggers behavior — Villager AI does its own reach checks at claim time; outputs are for the player's understanding only (zero calls into villager movement/behavior APIs)."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-build-validation-navigability-039
    system: build-validation-navigability
    gdd: design/gdd/build-validation-navigability.md
    requirement: "Signal contract: this system emits exactly four signals (shelter_status_changed, room_recognized, sealed_space_warning, unsheltered_furniture_info); no other emissions exist."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-build-validation-navigability-040
    system: build-validation-navigability
    gdd: design/gdd/build-validation-navigability.md
    requirement: "room_recognized signal: payload region cells, celebrate bool, pass_group_id; fires on non-Room-to-Room transition, edge-detected, all emissions of one analysis pass share one pass_group_id."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-build-validation-navigability-041
    system: build-validation-navigability
    gdd: design/gdd/build-validation-navigability.md
    requirement: "sealed_space_warning signal: payload region cells, affected item ids, why-string; re-emitted every qualifying analysis pass while a sealed space contains need-functional furniture, regardless of prior UI dismissal."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-build-validation-navigability-042
    system: build-validation-navigability
    gdd: design/gdd/build-validation-navigability.md
    requirement: "unsheltered_furniture_info signal: payload item id, why-string; emitted every qualifying analysis pass while a bed sits unsheltered in the open, never for sealed-space items."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-build-validation-navigability-043
    system: build-validation-navigability
    gdd: design/gdd/build-validation-navigability.md
    requirement: "Warning and Info are separate typed signals, not severity payloads of one signal; shelter_status_changed is the only signal Needs consumes — the other three are presentational."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-build-validation-navigability-044
    system: build-validation-navigability
    gdd: design/gdd/build-validation-navigability.md
    requirement: "All current statuses are additionally queryable at any time (state + events model — the same consumption contract Needs & Mood established)."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-build-validation-navigability-045
    system: build-validation-navigability
    gdd: design/gdd/build-validation-navigability.md
    requirement: "All emissions of one analysis pass are delivered synchronously within one frame; consumers may treat same-frame delivery as one pass — the reconciliation unit."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-build-validation-navigability-046
    system: build-validation-navigability
    gdd: design/gdd/build-validation-navigability.md
    requirement: "There is deliberately NO 'cleared' signal: Warning/Info are level-triggered re-emissions; clearing IS the cessation of re-emission plus the queryable current state — the UI reconciles active toasts against each pass's emissions."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-build-validation-navigability-047
    system: build-validation-navigability
    gdd: design/gdd/build-validation-navigability.md
    requirement: "A tier change appears as the Warning ceasing and the Info beginning in the same pass; the UI must retire the stale Warning surface in favor of the new Info hint as part of that reconcile."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-build-validation-navigability-048
    system: build-validation-navigability
    gdd: design/gdd/build-validation-navigability.md
    requirement: "The system keeps a transient, never-serialized snapshot of the previous analysis result (per-cell region classification + per-item shelter flags), used ONLY to edge-detect transitions — memory for eventing, never a compute cache."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-build-validation-navigability-049
    system: build-validation-navigability
    gdd: design/gdd/build-validation-navigability.md
    requirement: "Region continuity: a newly valid room fires room_recognized only if NONE of its interior cells belonged to a valid room in the previous snapshot — merges and splits of existing rooms never re-fire it."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-build-validation-navigability-050
    system: build-validation-navigability
    gdd: design/gdd/build-validation-navigability.md
    requirement: "Celebration pacing: at most one celebration per room_cue_cooldown_ticks with same-pass grouping — all rooms recognized in one pass emit celebrate=true with a shared pass_group_id (one combined celebration); later-pass recognitions inside the window emit celebrate=false."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-build-validation-navigability-051
    system: build-validation-navigability
    gdd: design/gdd/build-validation-navigability.md
    requirement: "On world load the initial full pass seeds the snapshot silently: statuses become queryable but no transition events (shelter_status_changed, room_recognized) fire; Warning/Info emissions DO fire on the load pass; load-time statuses must equal pre-save statuses."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-build-validation-navigability-052
    system: build-validation-navigability
    gdd: design/gdd/build-validation-navigability.md
    requirement: "Building System completion signals are batched per FRAME — N cells completing in one frame, across any number of commands and villagers, reach this system as ONE signal, giving at most one re-analysis pass per frame from construction."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-build-validation-navigability-053
    system: build-validation-navigability
    gdd: design/gdd/build-validation-navigability.md
    requirement: "No runtime calls in either direction between this system and Villager AI — this system runs its own region/reach analysis using the same rules; villager pathing stays the AI's own job."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-build-validation-navigability-054
    system: build-validation-navigability
    gdd: design/gdd/build-validation-navigability.md
    requirement: "Voxel World physical occupancy reads for region analysis are read-only — this system owns no world data and mutates nothing."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-build-validation-navigability-055
    system: build-validation-navigability
    gdd: design/gdd/build-validation-navigability.md
    requirement: "Sealed-space warning and Villager AI's trapped/distress handling are two independent, complementary signals — no suppression or coupling between them."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-build-validation-navigability-056
    system: build-validation-navigability
    gdd: design/gdd/build-validation-navigability.md
    requirement: "Terrain counts as floor and as wall (solid is solid) — no distinction between built and natural enclosure in MVP."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-build-validation-navigability-057
    system: build-validation-navigability
    gdd: design/gdd/build-validation-navigability.md
    requirement: "Roof-on-pillars (no walls) is a valid room by Rule 2 — the definition requires roof, floor, size, and reachability, not wall coverage (accepted MVP design gap; wall coverage is VS priority #1)."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-build-validation-navigability-058
    system: build-validation-navigability
    gdd: design/gdd/build-validation-navigability.md
    requirement: "On block removal, affected cells lose candidate status and the region shrinks or splits, each remainder independently re-evaluated against Rule 2; partial roof damage de-shelters only the affected cells' furniture."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-build-validation-navigability-059
    system: build-validation-navigability
    gdd: design/gdd/build-validation-navigability.md
    requirement: "The world boundary acts as neither wall nor opening — candidate cells simply end there; reachability uses in-bounds cells only."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-build-validation-navigability-060
    system: build-validation-navigability
    gdd: design/gdd/build-validation-navigability.md
    requirement: "A sub-clearance crawlspace (roof 1-2 above floor) has no candidate interior cells and forms no region — neither room nor sealed space; a bed inside is unsheltered (Info tier), never the sealed-space Warning (scoped to candidate regions)."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-build-validation-navigability-061
    system: build-validation-navigability
    gdd: design/gdd/build-validation-navigability.md
    requirement: "Ladder-order invariant ground_penalty < unsheltered_bed_multiplier < 1.0: blocking enforcement owned by Needs & Mood (its AC29); this system carries the advisory smoke-check courtesy duplicate."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-build-validation-navigability-062
    system: build-validation-navigability
    gdd: design/gdd/build-validation-navigability.md
    requirement: "All tuning-knob values are data-driven per the coding standard; none are player-facing."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-build-validation-navigability-063
    system: build-validation-navigability
    gdd: design/gdd/build-validation-navigability.md
    requirement: "Property-test corpus: 100 committed seeds in tests/integration/build-validation/ generating bounded 32x32x16 worlds with 50 sampled (start,target) pairs each; this system's reachability verdict and Villager AI's pathfinder must agree on all 5,000 verdicts; corpus runtime <= 60s in CI."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-build-validation-navigability-064
    system: build-validation-navigability
    gdd: design/gdd/build-validation-navigability.md
    requirement: "Pre-VS performance spike MUST include a sprawling merged-structure case (region-size cost, villager-count-independent), the load-time full-world pass, and resident snapshot memory measurement — not just pass latency."
    created: 2026-07-11
    revised: ""
    status: active

  # ── Needs & Mood System ─────────────────────────────────────────────────
  - id: TR-needs-mood-system-020
    system: needs-mood-system
    gdd: design/gdd/needs-mood-system.md
    requirement: "Config-load-time blocking validation of the ladder-ordering invariant ground_penalty < unsheltered_bed_multiplier < 1.0, owned by this system; violation fails loudly at boot."
    created: 2026-07-11
    revised: "2026-07-11"
    status: active
  - id: TR-needs-mood-system-025
    system: needs-mood-system
    gdd: design/gdd/needs-mood-system.md
    requirement: "Live-pair integration test (AC34): a REAL Needs instance and REAL Villager AI villager with an owned sheltered bed, no mocks at the seam, through the full decay -> urgent -> claim/travel/sleep -> recovery -> satisfied -> wake round trip with events observed in order."
    created: 2026-07-11
    revised: "2026-07-11"
    status: active
  - id: TR-needs-mood-system-026
    system: needs-mood-system
    gdd: design/gdd/needs-mood-system.md
    requirement: "Save/Load (Vertical Slice, provisional): per-villager need values AND the smoothed mood are serialized (Edge Case 8)."
    created: 2026-07-11
    revised: "2026-07-11"
    status: active
  - id: TR-needs-mood-system-027
    system: needs-mood-system
    gdd: design/gdd/needs-mood-system.md
    requirement: "On load, the smoothed mood is restored as-saved — never re-initialized via the F4 spawn formula, which would erase the smoothing state (Edge Case 8; AC24)."
    created: 2026-07-11
    revised: "2026-07-11"
    status: active
  - id: TR-needs-mood-system-028
    system: needs-mood-system
    gdd: design/gdd/needs-mood-system.md
    requirement: "Schema drift on load: a saved need type no longer in the schema is dropped with a log line, never a crash (Edge Case 8; AC25)."
    created: 2026-07-11
    revised: "2026-07-11"
    status: active
  - id: TR-needs-mood-system-029
    system: needs-mood-system
    gdd: design/gdd/needs-mood-system.md
    requirement: "Save/Load re-derives per-need state from the restored values with no signal replay — values are the persisted truth, the queryable state machine is reconstructed from them (Core Rule 3)."
    created: 2026-07-11
    revised: "2026-07-11"
    status: active

  - id: TR-needs-mood-system-030
    system: needs-mood-system
    gdd: design/gdd/needs-mood-system.md
    requirement: "A need is a per-villager float 0-100 decaying by decay_per_tick each game tick except while Recovering, clamped at 0 (F1: value <- max(0, value - decay_per_tick[need]))."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-needs-mood-system-031
    system: needs-mood-system
    gdd: design/gdd/needs-mood-system.md
    requirement: "Fixed need schema known from day one - sleep (MVP), food (VS), company (Alpha); MVP fills only sleep; adding a need type is a design change, not a data edit."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-needs-mood-system-032
    system: needs-mood-system
    gdd: design/gdd/needs-mood-system.md
    requirement: "Maintains a queryable per-need state (Satisfied/Urgent/Recovering + current value) that consumers read at their own decision points; state is the source of truth."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-needs-mood-system-033
    system: needs-mood-system
    gdd: design/gdd/needs-mood-system.md
    requirement: "Edge-triggered notifications layered on state: urgency_threshold downward cross emits 'need urgent' once; satisfied_threshold upward cross during recovery emits 'need satisfied' once; fire on crossing (<=/>=), never equality; latency hints only."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-needs-mood-system-034
    system: needs-mood-system
    gdd: design/gdd/needs-mood-system.md
    requirement: "Recovery happens only through activities Villager AI performs and reports; recovery rate is defined by the source->rate table owned here (bed sheltered x1.0, bed unsheltered x0.7, ground x0.4)."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-needs-mood-system-035
    system: needs-mood-system
    gdd: design/gdd/needs-mood-system.md
    requirement: "The source->rate table is keyed by the recovery-source enum Villager AI reports: bed_sheltered / bed_unsheltered / ground_no_bed_owned / ground_bed_unreachable / ground_trapped; the three ground_* values share one rate row."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-needs-mood-system-036
    system: needs-mood-system
    gdd: design/gdd/needs-mood-system.md
    requirement: "The sheltered/unsheltered classification within the source enum is supplied by Build Validation & Navigability (its Rule 5); reachability/trapped by Villager AI (its Rule 12)."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-needs-mood-system-037
    system: needs-mood-system
    gdd: design/gdd/needs-mood-system.md
    requirement: "No death spiral: a need at 0 harms nothing in MVP - no fail-states; the villager simply ground-sleeps via Villager AI's urgent priority."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-needs-mood-system-038
    system: needs-mood-system
    gdd: design/gdd/needs-mood-system.md
    requirement: "Mood is a derived, read-only 0-100 value: the mean of all active need values smoothed over mood_smoothing_ticks (F3 EMA with explicit float division)."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-needs-mood-system-039
    system: needs-mood-system
    gdd: design/gdd/needs-mood-system.md
    requirement: "Mood is displayed in three colorblind-safe bands: Happy (>=70), Content (40-69), Low (<40); bands, not raw numbers, are the player-facing signal; boundaries shared verbatim with Villager Info UI."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-needs-mood-system-040
    system: needs-mood-system
    gdd: design/gdd/needs-mood-system.md
    requirement: "MVP mood is display-only: no gameplay consequences (work speed, breaks) until Alpha."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-needs-mood-system-041
    system: needs-mood-system
    gdd: design/gdd/needs-mood-system.md
    requirement: "All values are data-driven config per the coding standard; nothing is hardcoded and none are player-facing."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-needs-mood-system-042
    system: needs-mood-system
    gdd: design/gdd/needs-mood-system.md
    requirement: "Recovery-report API: Villager AI reports via discrete start_recovery(need, source_enum) and stop_recovery(need, reason) calls - not per-tick pushes."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-needs-mood-system-043
    system: needs-mood-system
    gdd: design/gdd/needs-mood-system.md
    requirement: "Between start and stop the current source enum is re-read each tick - mid-recovery upgrade/downgrade re-rates from the next tick with no restart, no signal, no lost progress (Edge Case 11)."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-needs-mood-system-044
    system: needs-mood-system
    gdd: design/gdd/needs-mood-system.md
    requirement: "Intra-tick ordering: start/stop reports and source changes land before that tick's F1-F3 pass - an interruption tick credits zero recovery."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-needs-mood-system-045
    system: needs-mood-system
    gdd: design/gdd/needs-mood-system.md
    requirement: "Why-string selection owned here: strongest drain = active need with the lowest value, tie-broken by schema order (sleep > food > company); empty when nothing urgent and mood Happy."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-needs-mood-system-046
    system: needs-mood-system
    gdd: design/gdd/needs-mood-system.md
    requirement: "Why-string templates keyed by source enum ('tired - no bed' / 'tired - bed unreachable' / 'tired - trapped!' / 'sleeping rough - no shelter'; bed_sheltered/not sleeping -> no suffix); must never direct the player to the wrong fix."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-needs-mood-system-047
    system: needs-mood-system
    gdd: design/gdd/needs-mood-system.md
    requirement: "UI-slot precedence for the single why-slot: Villager AI distress/trapped cue > this system's need-why > Build Validation's structural string (building/bed context only)."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-needs-mood-system-048
    system: needs-mood-system
    gdd: design/gdd/needs-mood-system.md
    requirement: "Per-need state machine per the state table: Satisfied/Urgent/Recovering entries and exits; Urgent exits into Recovering only on a start_recovery report - recovery cannot self-trigger from value alone."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-needs-mood-system-049
    system: needs-mood-system
    gdd: design/gdd/needs-mood-system.md
    requirement: "Mood band transitions derive purely from the smoothed value crossing 70/40; band changes emit exactly one display event for the Villager Info UI, with no implicit dead zone at default hysteresis 0."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-needs-mood-system-050
    system: needs-mood-system
    gdd: design/gdd/needs-mood-system.md
    requirement: "The Villager AI Breather is excluded from needs: it reports nothing, recovers nothing, and does not pause decay - cosmetic pacing only."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-needs-mood-system-051
    system: needs-mood-system
    gdd: design/gdd/needs-mood-system.md
    requirement: "All decay/recovery/mood math runs on Time & Tick events; pause halts everything; warp accelerates wall-clock while game-time pacing stays tick-based."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-needs-mood-system-052
    system: needs-mood-system
    gdd: design/gdd/needs-mood-system.md
    requirement: "Building System and Resource & Item Database are never called at runtime; Villager AI reports which recovery source it is using."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-needs-mood-system-053
    system: needs-mood-system
    gdd: design/gdd/needs-mood-system.md
    requirement: "F2: value <- min(100, value + base_recovery_per_tick[need] x source_multiplier); satisfied_threshold cross is the only value-based exit; overshoot of at most one increment retained, capped by the 0-100 domain clamp."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-needs-mood-system-054
    system: needs-mood-system
    gdd: design/gdd/needs-mood-system.md
    requirement: "F3 snap rule: if abs(mean_active - mood) < 0.05 then mood = mean_active - prevents the EMA asymptote from permanently stalling just below a band boundary."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-needs-mood-system-055
    system: needs-mood-system
    gdd: design/gdd/needs-mood-system.md
    requirement: "mean_active is the unweighted arithmetic mean over active (schema-filled) needs only - inactive needs are excluded, never defaulted."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-needs-mood-system-056
    system: needs-mood-system
    gdd: design/gdd/needs-mood-system.md
    requirement: "F4 spawn initialization: every active need = 100 and mood = mean_active - never 0 (avoids a false 'Low' display while F3 catches up)."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-needs-mood-system-057
    system: needs-mood-system
    gdd: design/gdd/needs-mood-system.md
    requirement: "Burst rule: within a tick burst (up to max_ticks_per_frame = 10), F1-F3 apply per tick in order and threshold signals are emitted per-tick in-order - never coalesced or deduplicated across the burst."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-needs-mood-system-058
    system: needs-mood-system
    gdd: design/gdd/needs-mood-system.md
    requirement: "Recovery interrupted with value above urgency_threshold: the need re-enters Satisfied, decay resumes silently, and Urgent re-triggers only on the next downward 25-cross."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-needs-mood-system-059
    system: needs-mood-system
    gdd: design/gdd/needs-mood-system.md
    requirement: "Recovery interrupted with value at/below urgency_threshold: the need re-enters Urgent by value, no second urgent event fires, and the queryable state reads Urgent throughout."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-needs-mood-system-060
    system: needs-mood-system
    gdd: design/gdd/needs-mood-system.md
    requirement: "Bed removed mid-recovery: Building System emits its bed-revocation event to the owning villager; Villager AI wakes and calls stop_recovery; the stop lands before that tick's F-pass so the removal tick credits zero recovery."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-needs-mood-system-061
    system: needs-mood-system
    gdd: design/gdd/needs-mood-system.md
    requirement: "A new need activating at a tier boundary initializes at 100 for existing villagers on first load of the new version; mean_active simply gains a term."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-needs-mood-system-062
    system: needs-mood-system
    gdd: design/gdd/needs-mood-system.md
    requirement: "Pause: no decay, no recovery, no mood drift (everything tick-driven); the UI keeps displaying the frozen values."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-needs-mood-system-063
    system: needs-mood-system
    gdd: design/gdd/needs-mood-system.md
    requirement: "Time-warp invariance: all rates are tick-based; identical tick counts produce identical values regardless of warp - never wall-clock."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-needs-mood-system-064
    system: needs-mood-system
    gdd: design/gdd/needs-mood-system.md
    requirement: "Supplies the Villager Info UI: per-need values (0-100), mood band (3 states + display events on change), and the why-string with selection, templates, and precedence per Core Rule 11."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-needs-mood-system-065
    system: needs-mood-system
    gdd: design/gdd/needs-mood-system.md
    requirement: "F2 recovery applies via source->rate table lookup - no hardcoded two-source branch; a new source id with its own multiplier works without code changes."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-needs-mood-system-066
    system: needs-mood-system
    gdd: design/gdd/needs-mood-system.md
    requirement: "The full default sleep cycle is deterministic in ticks: urgent event at exactly tick 1072 and satisfied event at tick 1212 - exact tick counts, never wall-clock."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-needs-mood-system-067
    system: needs-mood-system
    gdd: design/gdd/needs-mood-system.md
    requirement: "The Game Feel acceptance criteria (legibility, no-nagging, pacing hypothesis, unprompted mood notice) are evaluated at the MVP playtest with outcomes recorded in production/qa/evidence/."
    created: 2026-07-11
    revised: ""
    status: active

  # ── Building UI ─────────────────────────────────────────────────────────
  - id: TR-building-ui-008
