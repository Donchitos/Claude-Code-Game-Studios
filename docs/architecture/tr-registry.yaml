# Technical Requirement ID Registry
#
# PURPOSE: Persistent, stable IDs for every GDD technical requirement.
# Prevents TR-ID renumbering across /architecture-review runs, which would
# break story references.
#
# RULES:
#   - IDs are PERMANENT. Never renumber, never delete (use status: deprecated).
#   - Add new entries only at the END of each system's list.
#   - When a GDD requirement is reworded (same intent): update `requirement`
#     text and add a `revised` date. The ID stays the same.
#   - When a requirement is removed from the GDD: set status: deprecated.
#   - When a requirement is split or replaced: set status: superseded-by with
#     the new TR-ID(s).
#
# WRITTEN BY: /architecture-review (appends new entries, never overwrites)
# READ BY:    /create-stories (embed IDs in stories)
#             /story-done (look up current requirement text at review time)
#             /story-readiness (validate TR-ID exists and is active)
#
# ID FORMAT: TR-[system-slug]-[NNN]
# STATUS VALUES: active | deprecated | superseded-by: TR-[system]-NNN

version: 2
last_updated: "2026-08-21"   # First real population: 399 TR-IDs from /architecture-review 2026-08-21

requirements:

  # ─── INPUT (Foundation) — design/gdd/input.md ───────────────────────────────
  - { id: TR-input-001, system: input, gdd: design/gdd/input.md, domain: Platform, anchor: "Regla Nucleo 1 / AC 1", requirement: "Every physical device maps to a fixed set of named Input Actions (StringName const in one autoload); consumers never read raw devices.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-input-002, system: input, gdd: design/gdd/input.md, domain: Engine, anchor: "Regla Nucleo 1", requirement: "Input must connect to Input.joy_connection_changed(device, connected) — the only discrete device connect/disconnect signal (explicit exception to no-raw-devices).", created: 2026-08-21, revised: "", status: active }
  - { id: TR-input-003, system: input, gdd: design/gdd/input.md, domain: Data, anchor: "Regla Nucleo 1", requirement: "Active gamepad tracked by stable identity (GUID / Input.get_joy_name), never by device index — SDL3 backend (4.5+) reassigns indices on reconnect.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-input-004, system: input, gdd: design/gdd/input.md, domain: Ownership, anchor: "Regla Nucleo 2 / AC 3", requirement: "Exactly one active input context at a time (RTS_COMMAND/MENU_NAVIGATION/BLESSING_SELECT/DEATH_HOLD) as a single enum field _current_context, not booleans, managed by an in-Input state machine.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-input-005, system: input, gdd: design/gdd/input.md, domain: Communication, anchor: "Regla Nucleo 2", requirement: "Context gating is centralized: _input handlers consult current_context and never emit an intent signal for a disabled action; gating is not delegated to consumers.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-input-006, system: input, gdd: design/gdd/input.md, domain: Ownership, anchor: "Regla Nucleo 2 / AC 4", requirement: "current_context is get-only over private _current_context; transitions only via request_context_transition(new)->bool (GDScript 4.6 has no field privacy — pattern-enforced).", created: 2026-08-21, revised: "", status: active }
  - { id: TR-input-007, system: input, gdd: design/gdd/input.md, domain: Ownership, anchor: "States and Transitions", requirement: "Only Input changes context, triggered by other systems' events (Permadeath forces DEATH_HOLD, Reliquias requests BLESSING_SELECT), never by the player directly.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-input-008, system: input, gdd: design/gdd/input.md, domain: Communication, anchor: "Regla Nucleo 3 / AC 5", requirement: "Input exposes active_input_method and emits input_method_changed same-frame; scope is prompt-icon choice only, not focus-ring visibility.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-input-009, system: input, gdd: design/gdd/input.md, domain: Ownership, anchor: "Edge Case / AC 5c", requirement: "Method switch requires a deliberate press (pressed action or sustained stick deflection >= min frame threshold, debounce/hysteresis); the threshold is an Input-owned contract consumers must not reimplement.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-input-010, system: input, gdd: design/gdd/input.md, domain: Platform, anchor: "AC 5b", requirement: "Before any physical input, active_input_method returns a platform-detected default (KEYBOARD_MOUSE on PC, GAMEPAD on console), never uninitialized.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-input-011, system: input, gdd: design/gdd/input.md, domain: Communication, anchor: "Regla Nucleo 4 / AC 6 / AC 21", requirement: "Input only emits intent signals with raw position data (select_requested, box_select_requested, move_commanded, pan_requested, zoom_requested, blessing_choice_confirmed, blessing_selection_cancelled, unit_selected_at, input_device_changed) — no unit lookup, no state mutation.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-input-012, system: input, gdd: design/gdd/input.md, domain: Timing, anchor: "AC 14/15/16", requirement: "Transition to DEATH_HOLD is immediate (same frame) and discards any queued/in-flight input; no order is buffered or replayed on release.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-input-013, system: input, gdd: design/gdd/input.md, domain: Communication, anchor: "Visual/Audio / AC 15b", requirement: "Input exposes input_lockout_active=true and hides the mouse cursor for the whole DEATH_HOLD; on release returns to false and cursor reappears per target context — mandatory feedback contract, not cosmetic.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-input-014, system: input, gdd: design/gdd/input.md, domain: Timing, anchor: "AC 17b (contract w/ permadeath Regla 4 / AC-P07c)", requirement: "On gamepad disconnect during DEATH_HOLD, Input emits reconnect prompt but does NOT trigger a real engine pause (SceneTree.paused stays false); the pause request is deferred until Permadeath releases the beat.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-input-015, system: input, gdd: design/gdd/input.md, domain: Platform, anchor: "AC 17", requirement: "On gamepad disconnect outside DEATH_HOLD, system keeps active context and emits input_device_changed(keyboard_mouse) + pause request + reconnect prompt within one frame.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-input-016, system: input, gdd: design/gdd/input.md, domain: Performance, anchor: "AC 22", requirement: "Input latency: every intent signal emitted within one frame of the OS event (<=1 frame / <=16.6ms), measured over 60s with 0 dropped or 2+-frame-delayed events on target hardware.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-input-017, system: input, gdd: design/gdd/input.md, domain: Performance, anchor: "AC 22 (measurement)", requirement: "The measurement harness records event timestamp at _input callback and signal-emission timestamp, counting delta-frame>1 and coalesced/dropped events; coalescence policy must be defined (coalesce mouse_motion OK; dropping a pressed not OK).", created: 2026-08-21, revised: "", status: active }
  - { id: TR-input-018, system: input, gdd: design/gdd/input.md, domain: Performance, anchor: "AC 22 / OQ-INPUT-4", requirement: "No 'Input' row exists in the studio frame-time budget table; requires an explicit ms allocation from the 16.6ms budget and a place where latency is tracked.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-input-019, system: input, gdd: design/gdd/input.md, domain: Data, anchor: "Formula 1", requirement: "Radial/circular dead zone with remap: stick_input_mag=(raw_mag-stick_dead_zone)/(1-stick_dead_zone), stick_input_dir=Vector2(x,y)/raw_mag; inclusive <=; mag in [0,1] guaranteed.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-input-020, system: input, gdd: design/gdd/input.md, domain: Communication, anchor: "Formula 1 (source of truth)", requirement: "stick_input_dir and stick_input_mag are mandatory exported symbols: control-y-seleccion Formula 3 consumes them directly.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-input-021, system: input, gdd: design/gdd/input.md, domain: Platform, anchor: "Formula 2 (DPI scaling)", requirement: "drag_threshold_px_effective = drag_threshold_px * (viewport_height_px/1080.0), derived at runtime; the safe-range clamp (3-8) applies to the reference value, not the effective one.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-input-022, system: input, gdd: design/gdd/input.md, domain: Engine, anchor: "Formula 3", requirement: "Double-click detection uses a manual timer comparing Time.get_ticks_msec() between InputEventMouseButton events, NOT OS-level double-click (inconsistent cross-platform).", created: 2026-08-21, revised: "", status: active }
  - { id: TR-input-023, system: input, gdd: design/gdd/input.md, domain: Data, anchor: "Formula 5 / AC 13/13a/13b", requirement: "Zoom scalar computed with two separate expressions (zoom_in: zoom*(1-f); zoom_out: zoom*(1+f)) with zoom_min=0.5=zoomed-in, zoom_max=1.5=zoomed-out; invert_zoom swaps which physical input fires each, never the scalar.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-input-024, system: input, gdd: design/gdd/input.md, domain: Ownership, anchor: "Formula 5 / OQ-INPUT-2", requirement: "Input defines the design zoom scalar; translation to Camera2D.zoom (Vector2) is owned by Control y Seleccion — explicit ownership split.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-input-025, system: input, gdd: design/gdd/input.md, domain: Data, anchor: "AC 24b", requirement: "A zoom value outside [zoom_min, zoom_max] from a config change is clamped on the next input frame; out-of-bounds zoom is never allowed.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-input-026, system: input, gdd: design/gdd/input.md, domain: Ownership, anchor: "Tuning Knobs (accessibility)", requirement: "Knobs stick_dead_zone, double_click_window_s, drag_threshold_px, invert_zoom are single source of truth feeding Accessibility by reference (no duplication); Accessibility may need larger ceilings than standard tuning ranges.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-input-027, system: input, gdd: design/gdd/input.md, domain: Platform, anchor: "UI Requirements / AC 2", requirement: "A remapping screen must read/write the InputMap; Input must expose the named actions readably for that screen.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-input-028, system: input, gdd: design/gdd/input.md, domain: Ownership, anchor: "Player Fantasy / OQ-INPUT-1", requirement: "The Pillar-1 invariant is cross-system with named owners: Input owns raw-signal fidelity; Control owns click->unit resolution; Permadeath owns lethality/sealing — requires an explicit handoff contract among the three.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-input-029, system: input, gdd: design/gdd/input.md, domain: Timing, anchor: "OQ-INPUT-1 (b)", requirement: "Frame ordering among Input (last-second rescue order), Control (apply it), Permadeath (evaluate the death) must be specified so an update-order accident is never indistinguishable from a legitimate player decision.", created: 2026-08-21, revised: "", status: active }

  # ─── DATOS DE ERA/CIVILIZACION (Foundation) — design/gdd/datos-de-era-civilizacion.md ───
  - { id: TR-era-001, system: era, gdd: design/gdd/datos-de-era-civilizacion.md, domain: Data, anchor: "Regla 1 / AC-1", requirement: "Each era is a typed Godot Resource (EraDefinition, .tres) with era_id, era_name, civilization_name, narrative_order, unit_roster, kaiju_definition, tileset_vocabulary, color_accent, legacy_props, world_unit_scale, approach_duration_s, imminent_window_s, all correctly typed.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-era-002, system: era, gdd: design/gdd/datos-de-era-civilizacion.md, domain: Data, anchor: "Regla 1 / AC-1b", requirement: "EraDefinition exposes derived accessor get_hero_roster_count()->int, recomputed from unit_roster on each call (not a cacheable-desync field, not a separate authored field).", created: 2026-08-21, revised: "", status: active }
  - { id: TR-era-003, system: era, gdd: design/gdd/datos-de-era-civilizacion.md, domain: Ownership, anchor: "Regla 3 / AC-3", requirement: "Era definitions are runtime-immutable: any write to an ACTIVE EraDefinition field is rejected or does not persist; re-read returns the original authored value.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-era-004, system: era, gdd: design/gdd/datos-de-era-civilizacion.md, domain: Data, anchor: "Regla 2 / AC-2", requirement: "100% authored, no procedural generation: no era/kaiju/unit data generated at runtime — verifiable by static grep of generation calls in consumers.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-era-005, system: era, gdd: design/gdd/datos-de-era-civilizacion.md, domain: Data, anchor: "Regla 5 / AC-6", requirement: "Data-driven, never hardcoded: no consumer may have era/kaiju/unit names in code; all resolved via EraDefinition references.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-era-006, system: era, gdd: design/gdd/datos-de-era-civilizacion.md, domain: Data, anchor: "Regla 4 / AC-5", requirement: "legacy_props stores relic IDs (string/enum), never an embedded relic structure — Forja de Legado remains the single source of truth.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-era-007, system: era, gdd: design/gdd/datos-de-era-civilizacion.md, domain: Data, anchor: "States and Transitions / AC-7..12", requirement: "Per-era lifecycle state machine UNLOADED->LOADING->LOADED->ACTIVE->ARCHIVED, with reload ARCHIVED->LOADING->LOADED; direct ARCHIVED->ACTIVE is rejected.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-era-008, system: era, gdd: design/gdd/datos-de-era-civilizacion.md, domain: Ownership, anchor: "AC-9", requirement: "Invariant: exactly one EraDefinition is ACTIVE at a time (must be proven even with a single MVP era).", created: 2026-08-21, revised: "", status: active }
  - { id: TR-era-009, system: era, gdd: design/gdd/datos-de-era-civilizacion.md, domain: Timing, anchor: "Edge Case LOADING / AC-15", requirement: "If a system requests unit_roster while the era is LOADING, the request blocks/queues until LOADED; partial data is never returned — implies async load with wait.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-era-010, system: era, gdd: design/gdd/datos-de-era-civilizacion.md, domain: Engine, anchor: "Edge Case / AC-16", requirement: "A broken/missing kaiju_definition reference must fail loudly at load/editor time (visible error/assert); never silently substitute a default kaiju.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-era-011, system: era, gdd: design/gdd/datos-de-era-civilizacion.md, domain: Timing, anchor: "Interactions/Dependencies Permadeath (2026-08-16)", requirement: "Permadeath reads get_hero_roster_count() on the era-LOADED signal, not in its own _ready() — requires an observable era lifecycle signal and an init-order contract.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-era-012, system: era, gdd: design/gdd/datos-de-era-civilizacion.md, domain: Ownership, anchor: "Formulas world_unit_scale", requirement: "This system is the registered source of truth of world_unit_scale=48 px/unit, consumed by Input and Control y Seleccion.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-era-013, system: era, gdd: design/gdd/datos-de-era-civilizacion.md, domain: Ownership, anchor: "Formulas camera_pan_speed/zoom", requirement: "This system also owns camera_pan_speed=30, zoom_min=0.5, zoom_max=1.5 as registered constants; consumers apply but never redefine them. (Ownership contested — see camera/zoom-ownership ADR gap.)", created: 2026-08-21, revised: "", status: active }
  - { id: TR-era-014, system: era, gdd: design/gdd/datos-de-era-civilizacion.md, domain: Ownership, anchor: "Regla 1 (range validation)", requirement: "approach_duration_s and imminent_window_s are guaranteed only in existence and type (float); range validation (loud-fail) is owned by the Temporizador at init.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-era-015, system: era, gdd: design/gdd/datos-de-era-civilizacion.md, domain: Performance, anchor: "Edge Case ARCHIVED / AC-19", requirement: "An ARCHIVED era may unload tileset_vocabulary for performance; if later queried it reloads to LOADED (not ACTIVE) on demand — implies explicit asset load/unload management.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-era-016, system: era, gdd: design/gdd/datos-de-era-civilizacion.md, domain: Data, anchor: "Tuning Knobs / AC-20", requirement: "max_legacy_props_visible is clamped to safe range [4,20] before use, and the real legacy_props list is never truncated by this limit (only the rendered subset).", created: 2026-08-21, revised: "", status: active }
  - { id: TR-era-017, system: era, gdd: design/gdd/datos-de-era-civilizacion.md, domain: Engine, anchor: "Edge Case color_accent / AC-18", requirement: "Undefined color_accent uses a neutral fallback in release builds but a visible placeholder color in development builds — build-type-dependent behavior.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-era-018, system: era, gdd: design/gdd/datos-de-era-civilizacion.md, domain: Persistence, anchor: "Regla 3 / AC-4", requirement: "Guardado stores only era_id (reference), and the EraDefinition .tres must remain byte-for-byte identical to its authored version after any save.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-era-019, system: era, gdd: design/gdd/datos-de-era-civilizacion.md, domain: Data, anchor: "Edge Case repeated ID / AC-17", requirement: "A single relic ID may appear in legacy_props of multiple eras and must be present in all their queries — legacy accumulates, is not consumed.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-era-020, system: era, gdd: design/gdd/datos-de-era-civilizacion.md, domain: Data, anchor: "Edge Case single era / AC-14", requirement: "With a single era (narrative_order=0), the 'next era' query finds none and does not activate, without throwing — the expected MVP state.", created: 2026-08-21, revised: "", status: active }

  # ─── GUARDADO/PERSISTENCIA (Foundation) — design/gdd/guardado-persistencia.md ───
  - { id: TR-save-001, system: save, gdd: design/gdd/guardado-persistencia.md, domain: Ownership, anchor: "Overview / AC-01", requirement: "System exposes a read/write API with no game logic; consumers trigger saves — implies a stable public interface testable via simulated triggers.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-save-002, system: save, gdd: design/gdd/guardado-persistencia.md, domain: Timing, anchor: "Regla 1 / AC-04", requirement: "Consequence-event autosaves are blocking: the write must complete before the game advances to the next screen/state; transition held until SAVE_EXISTS or a failure path is surfaced.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-save-003, system: save, gdd: design/gdd/guardado-persistencia.md, domain: Ownership, anchor: "Regla 1 / AC-01b", requirement: "Mandatory non-configurable autosave triggers: hero transition to DYING (fired by Sistema de Heroes AC-H26, not Permadeath), relic forge (Forja), end of era (Transicion de Era).", created: 2026-08-21, revised: "", status: active }
  - { id: TR-save-004, system: save, gdd: design/gdd/guardado-persistencia.md, domain: Persistence, anchor: "Interactions Heroes", requirement: "Persisted death snapshot must include the full death payload (hero_id, hero_name, relic_category, relic_quality already computed, D/T/P) marked as 'death pending sealing' — not just state=DYING.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-save-005, system: save, gdd: design/gdd/guardado-persistencia.md, domain: Persistence, anchor: "AC-01b (contract AC-H27c)", requirement: "Load flow must be able to coerce DYING->DEAD and forge the relic if the game crashed mid-beat — recovery logic on the load path.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-save-006, system: save, gdd: design/gdd/guardado-persistencia.md, domain: Persistence, anchor: "Regla 3 / AC-08", requirement: "One save slot per legacy at a single path: every save always overwrites the same file, never creates a new one elsewhere.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-save-007, system: save, gdd: design/gdd/guardado-persistencia.md, domain: Persistence, anchor: "Regla 4 / AC-10", requirement: "Persistence by reference, never by copy: payload contains only era_id, forged relic IDs, pantheon progress counters, and Temporizador elapsed_s/current_phase — no EraDefinition field anywhere.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-save-008, system: save, gdd: design/gdd/guardado-persistencia.md, domain: Persistence, anchor: "AC-11", requirement: "The era_id reference is live, not a stale copy: if EraDefinition content changes in a data update, the reloaded save reflects the updated content.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-save-009, system: save, gdd: design/gdd/guardado-persistencia.md, domain: Persistence, anchor: "Regla 5 / AC-12/13/14", requirement: "Atomic write: write first to save.tmp and only replace the final file after confirmed success, via atomic rename; the rename is the only op that modifies the final file (no partial observable state).", created: 2026-08-21, revised: "", status: active }
  - { id: TR-save-010, system: save, gdd: design/gdd/guardado-persistencia.md, domain: Persistence, anchor: "Regla 6 / AC-18", requirement: "Each save stores schema_version:int compared against CURRENT_SCHEMA_VERSION (starts at 1).", created: 2026-08-21, revised: "", status: active }
  - { id: TR-save-011, system: save, gdd: design/gdd/guardado-persistencia.md, domain: Persistence, anchor: "Regla 6 / AC-15/16", requirement: "Migrations run as a linear chain, each responsible only for v->v+1, never skipping versions; a save 3 versions old runs exactly 3 migrations in order.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-save-012, system: save, gdd: design/gdd/guardado-persistencia.md, domain: Persistence, anchor: "Regla 6 / AC-17/29", requirement: "If save.schema_version > CURRENT_SCHEMA_VERSION no downgrade is attempted: load blocks with an explicit message, no migration runs, and no 'continue anyway' option is ever presented.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-save-013, system: save, gdd: design/gdd/guardado-persistencia.md, domain: Persistence, anchor: "Regla 7 / AC-19/20/21", requirement: "A checksum over the serialized payload is computed on write and stored; on load recomputed and compared. Mismatch -> CORRUPTED state, no auto-repair, no 'ignore and continue'.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-save-014, system: save, gdd: design/gdd/guardado-persistencia.md, domain: Persistence, anchor: "AC-30", requirement: "During a load attempt with a failed checksum, NO write operation of any kind occurs against the save file.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-save-015, system: save, gdd: design/gdd/guardado-persistencia.md, domain: Persistence, anchor: "Edge Cases 1-2 / AC-24..28", requirement: "Mandatory discrimination between two failure modes: save.tmp write failure -> NOT CORRUPTED (returns to SAVE_EXISTS/NO_SAVE_EXISTS, prior file intact); rename failure -> CORRUPTED.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-save-016, system: save, gdd: design/gdd/guardado-persistencia.md, domain: Timing, anchor: "Formulas retry_delay_ms / AC-34/35/36", requirement: "Retry backoff: retry_delay_ms(attempt)=base_delay_ms*backoff_multiplier^(attempt-1); defaults (100/2.0/3) give ~700ms total stall, after which the game halts with a blocking failure state rather than continuing.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-save-017, system: save, gdd: design/gdd/guardado-persistencia.md, domain: Timing, anchor: "Edge Case 7 / AC-33", requirement: "Autosaves are serialized: if two consequence events fire in the same frame, the second queues and does not begin until the first SAVING resolves to SAVE_EXISTS or CORRUPTED; no interleaved/parallel write is observable.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-save-018, system: save, gdd: design/gdd/guardado-persistencia.md, domain: Persistence, anchor: "Edge Case 6 / AC-32", requirement: "On restart after a crash during SAVING, any orphan save.tmp is detected and discarded unused, and the prior final save loads with SAVE_EXISTS.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-save-019, system: save, gdd: design/gdd/guardado-persistencia.md, domain: Ownership, anchor: "Regla 2 / AC-05/31", requirement: "Manual save allowed only in Temporizador PREPARATION/IMMINENT or the Memorial Hall; never during CLIMAX or DEATH_HOLD. If the signal fires anyway it is silently discarded — no state transition, no error dialog, no disk write.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-save-020, system: save, gdd: design/gdd/guardado-persistencia.md, domain: Communication, anchor: "UI Requirements 1 / Interactions UI", requirement: "SAVING state must be observable by UI/HUD, which shows an indicator only if the write exceeds save_indicator_display_threshold_ms (default 200ms).", created: 2026-08-21, revised: "", status: active }
  - { id: TR-save-021, system: save, gdd: design/gdd/guardado-persistencia.md, domain: Persistence, anchor: "Interactions Temporizador / AC-05/10", requirement: "The Temporizador persists elapsed_s and current_phase captured on the save frame; on reload it resumes from elapsed_s and RECOMPUTES the phase via its F3 — does not trust the persisted phase value.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-save-022, system: save, gdd: design/gdd/guardado-persistencia.md, domain: Data, anchor: "States and Transitions / AC-22/23", requirement: "State machine NO_SAVE_EXISTS, SAVING, SAVE_EXISTS, CORRUPTED with observable sequences NO_SAVE_EXISTS->SAVING->SAVE_EXISTS and SAVE_EXISTS->SAVING->SAVE_EXISTS.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-save-023, system: save, gdd: design/gdd/guardado-persistencia.md, domain: Data, anchor: "Tuning Knobs / AC-37..44", requirement: "Any knob configured out of safe range (base_delay_ms 50-200, backoff_multiplier 1.5-3.0, max_retries 2-5, save_indicator_display_threshold_ms 150-250) is auto-clamped to the nearest limit at load; the game never fails due to invalid config.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-save-024, system: save, gdd: design/gdd/guardado-persistencia.md, domain: Performance, anchor: "Formulas (design note)", requirement: "The write budget assumes the payload is 'a handful of IDs and counters' plus the death payload, so a blocking FileAccess write is sub-ms to a few ms — no own timeout defined; this assumption bounds the schema size.", created: 2026-08-21, revised: "", status: active }

  # ─── CONTROL Y SELECCION DE UNIDADES (Core) — design/gdd/control-y-seleccion-de-unidades.md ───
  - { id: TR-control-001, system: control, gdd: design/gdd/control-y-seleccion-de-unidades.md, domain: Communication, anchor: "Interactions / Dependencies (Input)", requirement: "Consumes Input intent signals (select_requested, box_select_requested, move_commanded, pan_requested, zoom_requested, active_input_method) — a hard interface confirmed bidirectionally.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-control-002, system: control, gdd: design/gdd/control-y-seleccion-de-unidades.md, domain: Engine, anchor: "Formula 2 / AC-F3/F4", requirement: "Screen->world transform: world_pos=camera_position_world+(screen_pos_px-viewport_size_px/2)*(zoom/world_unit_scale); Camera2D zoom is INVERSE to magnification (lower=closer) and an inverted sign silently breaks all click->unit resolution.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-control-003, system: control, gdd: design/gdd/control-y-seleccion-de-unidades.md, domain: Ownership, anchor: "Regla 5 (+ input OQ-INPUT-2)", requirement: "This system OWNS the Camera2D node and owns the mapping of the design zoom scalar to the Camera2D.zoom property.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-control-004, system: control, gdd: design/gdd/control-y-seleccion-de-unidades.md, domain: Data, anchor: "Formula 1 / AC-F1/F2", requirement: "Per-unit select radius: select_radius_world=unit_visual_radius_world+(click_tolerance_px*zoom/world_unit_scale); requires Tropas and Heroes to expose unit_visual_radius_world as a per-type property.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-control-005, system: control, gdd: design/gdd/control-y-seleccion-de-unidades.md, domain: Performance, anchor: "Regla 1 / Interactions", requirement: "Resolving select_requested requires a spatial query of units under/near a world point — implies a query interface over positions/hitboxes against Tropas and Heroes.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-control-006, system: control, gdd: design/gdd/control-y-seleccion-de-unidades.md, domain: Data, anchor: "Regla 1 / AC-01..05b", requirement: "Selection tiebreak in strict deterministic order: (a) nearest hero within radius, (b) else nearest troop, (c) else deselect all. Priority applies only within-radius, never a global hero-first search.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-control-007, system: control, gdd: design/gdd/control-y-seleccion-de-unidades.md, domain: Data, anchor: "Regla 2 / AC-06/07/08", requirement: "Box-select selects every own unit whose CENTER falls inside the rect, inclusive border; includes heroes and troops together (no click hero>troop exclusivity).", created: 2026-08-21, revised: "", status: active }
  - { id: TR-control-008, system: control, gdd: design/gdd/control-y-seleccion-de-unidades.md, domain: Ownership, anchor: "Interactions / UI Requirements", requirement: "This system OWNS the current selection set and exposes it to UI/HUD (indicators) and Combate/Dano (set + attack target).", created: 2026-08-21, revised: "", status: active }
  - { id: TR-control-009, system: control, gdd: design/gdd/control-y-seleccion-de-unidades.md, domain: Data, anchor: "States and Transitions / AC-14..17", requirement: "Selection state machine NONE_SELECTED, SINGLE_SELECTED, MULTI_SELECTED; camera control is orthogonal and works in all three.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-control-010, system: control, gdd: design/gdd/control-y-seleccion-de-unidades.md, domain: Timing, anchor: "Edge Case / AC-18/19", requirement: "Selection auto-clears to NONE_SELECTED the same frame the last selected unit ceases to exist, with no stale reference to a dead unit — requires death/removal notification and freed-reference handling.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-control-011, system: control, gdd: design/gdd/control-y-seleccion-de-unidades.md, domain: Communication, anchor: "Regla 4 / AC-10/24/25", requirement: "Only own units selectable; a click on kaiju/esbirro does not add them, but with a prior selection emits an attack-target intent to Combate; with no selection the click is fully ignored (does not deselect).", created: 2026-08-21, revised: "", status: active }
  - { id: TR-control-012, system: control, gdd: design/gdd/control-y-seleccion-de-unidades.md, domain: Ownership, anchor: "Regla 3 / AC-09", requirement: "move_commanded sends ALL selected units toward the same resolved world_pos; this system does NOT validate pathfinding — each unit resolves its own (explicit ownership boundary).", created: 2026-08-21, revised: "", status: active }
  - { id: TR-control-013, system: control, gdd: design/gdd/control-y-seleccion-de-unidades.md, domain: Data, anchor: "Edge Case / AC-29", requirement: "With NONE_SELECTED a move order is silently ignored: no error, no movement, no state change.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-control-014, system: control, gdd: design/gdd/control-y-seleccion-de-unidades.md, domain: Platform, anchor: "Regla 6 / AC-13", requirement: "Virtual gamepad cursor exists only in gamepad mode (via active_input_method), hides immediately on mouse detection, reappears on return to gamepad.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-control-015, system: control, gdd: design/gdd/control-y-seleccion-de-unidades.md, domain: Timing, anchor: "Formula 3 / AC-F5", requirement: "Virtual cursor magnetic snap integrates per-frame: cursor_velocity_world=stick_input_dir*stick_input_mag*virtual_cursor_speed+to_unit_dir*snap_strength*virtual_cursor_speed*falloff*alignment, consuming Input Formula 1 symbols.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-control-016, system: control, gdd: design/gdd/control-y-seleccion-de-unidades.md, domain: Data, anchor: "AC-F6", requirement: "Property invariant: the pull component never exceeds snap_strength_max(0.55)*virtual_cursor_speed for any distance/alignment/stick_input_mag — the player always retains directional authority.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-control-017, system: control, gdd: design/gdd/control-y-seleccion-de-unidades.md, domain: Data, anchor: "Formula 3 / AC-26", requirement: "Gamepad cursor snap resolution reuses the same hero>troop tiebreak of Regla 1, so gamepad and mouse behave identically.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-control-018, system: control, gdd: design/gdd/control-y-seleccion-de-unidades.md, domain: Data, anchor: "Regla 5 / AC-27", requirement: "Camera bounded to the active era's map limits, read from Datos de Era; clamp applies at any zoom and never shows area outside the playable map.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-control-019, system: control, gdd: design/gdd/control-y-seleccion-de-unidades.md, domain: Data, anchor: "Formula 4 / AC-F7/F8/F9", requirement: "Zoom-compensated panning: effective_pan_speed_world=camera_pan_speed*zoom (full compensation ~1440 px/sec constant); at zoom=1.0 gives exactly 30, consistent with Input AC 23.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-control-020, system: control, gdd: design/gdd/control-y-seleccion-de-unidades.md, domain: Timing, anchor: "Edge Case / AC-28", requirement: "When pan_requested and zoom_requested arrive in the same frame, both effects apply independently first and the clamps (zoom [0.5,1.5] and map limits) apply after both — a specified per-frame order of operations, no op skipped.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-control-021, system: control, gdd: design/gdd/control-y-seleccion-de-unidades.md, domain: Data, anchor: "Regla 5 / AC-12", requirement: "Zoom clamped to [0.5,1.5] and never exceeds the limits.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-control-022, system: control, gdd: design/gdd/control-y-seleccion-de-unidades.md, domain: Ownership, anchor: "Tuning Knobs (consumed constants)", requirement: "Constants consumed from other systems and NOT duplicated: camera_pan_speed=30, zoom_min=0.5, zoom_max=1.5, world_unit_scale=48 (Datos de Era); stick_dead_zone=0.20, zoom_step_fraction=0.10, drag_threshold_px=5 (Input).", created: 2026-08-21, revised: "", status: active }
  - { id: TR-control-023, system: control, gdd: design/gdd/control-y-seleccion-de-unidades.md, domain: Data, anchor: "Tuning Knobs (enforcement) / AC-30..33", requirement: "Own knobs (click_tolerance_px, snap_strength, snap_radius, virtual_cursor_speed) are clamped to the nearest limit at load, consistent with the Guardado pattern.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-control-024, system: control, gdd: design/gdd/control-y-seleccion-de-unidades.md, domain: Communication, anchor: "Formula 2 (inverse note)", requirement: "The inverse of Formula 2 (px_per_world_unit=world_unit_scale/zoom) is a required symbol for UI/HUD, minimap and VFX to place markers over units.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-control-025, system: control, gdd: design/gdd/control-y-seleccion-de-unidades.md, domain: Ownership, anchor: "Overview / Regla 1 (+ input OQ-INPUT-1a)", requirement: "This system guarantees to Pillar 1 that selection is never ambiguous — a hero never receives a fatal order from a wrong click resolution; it is Control's half of the distributed invariant.", created: 2026-08-21, revised: "", status: active }

  # ─── SISTEMA DE TROPAS (Core) — design/gdd/sistema-de-tropas.md ──────────────
  - { id: TR-tropas-001, system: tropas, gdd: design/gdd/sistema-de-tropas.md, domain: Data, anchor: "Regla 1 / AC-01", requirement: "Each troop type is a typed Resource (TroopDefinition) with troop_id, troop_name, max_health, move_speed, unit_visual_radius_world, sprite_footprint, and tactical role (melee/ranged/support) — external data, never hardcoded.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-tropas-002, system: tropas, gdd: design/gdd/sistema-de-tropas.md, domain: Data, anchor: "Regla 1/2 / AC-01", requirement: "Instances troops by reading the troop portion of the ACTIVE EraDefinition unit_roster, and never instances a type outside that roster.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-tropas-003, system: tropas, gdd: design/gdd/sistema-de-tropas.md, domain: Performance, anchor: "Regla 1/2 / Formula C", requirement: "MVP supports 2-3 troop types per civilization with per-era counts starting_count_[type]; the simultaneous-entity budget derives from roster + reinforcements (max_reinforcements <=8 per type).", created: 2026-08-21, revised: "", status: active }
  - { id: TR-tropas-004, system: tropas, gdd: design/gdd/sistema-de-tropas.md, domain: Ownership, anchor: "States (note) / Interactions", requirement: "Sistema de Tropas OWNS each troop's current_health and life state (IDLE/MOVING/ENGAGED/DEAD); Combate/Dano only triggers transitions and applies damage, never writes the state directly.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-tropas-005, system: tropas, gdd: design/gdd/sistema-de-tropas.md, domain: Ownership, anchor: "Interactions / Formula A / AC-12", requirement: "Each troop exposes position/hitbox and unit_visual_radius_world to Control to resolve the registered select_radius formula owned by Control (value provided, resolution not duplicated).", created: 2026-08-21, revised: "", status: active }
  - { id: TR-tropas-006, system: tropas, gdd: design/gdd/sistema-de-tropas.md, domain: Data, anchor: "Regla 5 / AC-05/12", requirement: "Click resolution must guarantee hero>troop priority: every troop unit_visual_radius_world (max 0.4583) stays strictly below the minimum hero radius (0.5).", created: 2026-08-21, revised: "", status: active }
  - { id: TR-tropas-007, system: tropas, gdd: design/gdd/sistema-de-tropas.md, domain: Engine, anchor: "Regla 4 / AC-04", requirement: "Each troop resolves its own pathfinding toward the commanded destination via NavigationAgent2D, individually and without formation offset or grouping.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-tropas-008, system: tropas, gdd: design/gdd/sistema-de-tropas.md, domain: Communication, anchor: "Regla 4 / AC-07", requirement: "Movement triggered only by a move_commanded event emitted by Control resolved to a world destination — the system does not auto-move troops.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-tropas-009, system: tropas, gdd: design/gdd/sistema-de-tropas.md, domain: Engine, anchor: "EC-05 / AC-22", requirement: "Navigation avoidance must organically separate two troops ordered to the same tile without permanent stacking or mutual deadlock, verifiable in headless sim with a timeout assertion.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-tropas-010, system: tropas, gdd: design/gdd/sistema-de-tropas.md, domain: Engine, anchor: "EC-04 / AC-21", requirement: "An unreachable destination must resolve to the nearest navigable point and transition the troop to IDLE there, never leaving it MOVING indefinitely.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-tropas-011, system: tropas, gdd: design/gdd/sistema-de-tropas.md, domain: Communication, anchor: "Interactions / Regla 6 note", requirement: "Troop receives damage events from Combate that reduce current_health, and notifies ENGAGED/DEAD back — a bidirectional event interface, not direct field access.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-tropas-012, system: tropas, gdd: design/gdd/sistema-de-tropas.md, domain: Data, anchor: "Formula D / AC-06", requirement: "Troop death must NOT capture or store any circumstance data (killer_id, location, timestamp, cause) — no such field may exist in the troop schema.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-tropas-013, system: tropas, gdd: design/gdd/sistema-de-tropas.md, domain: Ownership, anchor: "Regla 6 / AC-06", requirement: "Troop death path (DEAD) must be separate from hero death path (permadeath/forge): a control test in the same run must prove a hero DOES trigger permadeath and a troop does NOT.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-tropas-014, system: tropas, gdd: design/gdd/sistema-de-tropas.md, domain: Data, anchor: "Formula D / AC-10/17/23", requirement: "DEAD is terminal and triggers at the 0-crossing (is_dead=current_health<=0, threshold <= not <); Combate clamps to 0 and negative health is not preserved.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-tropas-015, system: tropas, gdd: design/gdd/sistema-de-tropas.md, domain: Communication, anchor: "EC-03 / AC-20", requirement: "A troop reaching DEAD must be removed from Control's selection set the same frame; if it was the last, state goes to NONE_SELECTED.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-tropas-016, system: tropas, gdd: design/gdd/sistema-de-tropas.md, domain: Timing, anchor: "EC-07 / AC-24", requirement: "During DEATH_HOLD context, Input suppresses all input so the move_commanded event never reaches this system (upstream suppression, not local filtering).", created: 2026-08-21, revised: "", status: active }
  - { id: TR-tropas-017, system: tropas, gdd: design/gdd/sistema-de-tropas.md, domain: Persistence, anchor: "AC-31 / Dependencies", requirement: "Live troop count and state (N per type/state) is part of Guardado's serializable era state, excluding any death circumstance; save+reload restores the same N troops of the same types/states.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-tropas-018, system: tropas, gdd: design/gdd/sistema-de-tropas.md, domain: Data, anchor: "Tuning Knobs Enforcement / AC-26..30", requirement: "Out-of-range config values are clamped to the nearest limit AT LOAD (reinforcement_ratio->[0.15,0.35], speed_ratio_troop->[0.10,0.20], min_reinforcements->[1,3], max_reinforcements_hard_cap->[5,12]) — clamp-on-load policy, opposite to Heroes/Combate loud-fail.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-tropas-019, system: tropas, gdd: design/gdd/sistema-de-tropas.md, domain: Ownership, anchor: "Tuning Knobs — consumed constants", requirement: "Constants camera_pan_speed=30 and world_unit_scale=48 are owned by Datos de Era and must be consumed from a single registered source, never duplicated here.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-tropas-020, system: tropas, gdd: design/gdd/sistema-de-tropas.md, domain: Timing, anchor: "Formula C / AC-15/18", requirement: "Reinforcement cap is per-type (max_reinforcements_[type]=clamp(round(starting_count*reinforcement_ratio), min_reinforcements, max_reinforcements_hard_cap)) and resets per Preparation cycle — requires a queryable Preparation-cycle state.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-tropas-021, system: tropas, gdd: design/gdd/sistema-de-tropas.md, domain: Data, anchor: "EC-02 / AC-16/19", requirement: "A type absent from the era roster (starting_count_[type]=0) has reinforcement cap 0 — the min_reinforcements floor does not apply; enforcement is logical (rejection), independent of UI gating.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-tropas-022, system: tropas, gdd: design/gdd/sistema-de-tropas.md, domain: Communication, anchor: "Interactions — Kaiju", requirement: "Troops expose their positions as candidates for the kaiju AI threat-target selection (Encuentro con Kaiju Regla 3/F1).", created: 2026-08-21, revised: "", status: active }
  - { id: TR-tropas-023, system: tropas, gdd: design/gdd/sistema-de-tropas.md, domain: Communication, anchor: "Visual/Audio — Audio", requirement: "Troops emit signals that Audio listens to (move order, contact, death) — this system provides the trigger, not the sound.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-tropas-024, system: tropas, gdd: design/gdd/sistema-de-tropas.md, domain: Communication, anchor: "UI Requirements", requirement: "Troop exposes its life state so UI/HUD renders health bar/indicator and selection outline — this system does not render.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-tropas-025, system: tropas, gdd: design/gdd/sistema-de-tropas.md, domain: Engine, anchor: "Visual/Audio — Scale (art bible 8.4)", requirement: "LOD Level 1 only for troops — detail Level 2 rendering is reserved for hero permadeath and troops never activate it.", created: 2026-08-21, revised: "", status: active }

  # ─── SISTEMA DE HEROES (Core) — design/gdd/sistema-de-heroes.md ──────────────
  - { id: TR-heroes-001, system: heroes, gdd: design/gdd/sistema-de-heroes.md, domain: Data, anchor: "Regla 1 / AC-H01", requirement: "Each hero is a typed Resource (HeroDefinition) with hero_id, hero_name, max_health, move_speed, unit_visual_radius_world, abilities (Array[AbilityDefinition], >=1), asymmetric_element, relic_category (offensive/rally/defensive).", created: 2026-08-21, revised: "", status: active }
  - { id: TR-heroes-002, system: heroes, gdd: design/gdd/sistema-de-heroes.md, domain: Data, anchor: "Regla 1 / AC-H01b", requirement: "Formula inputs sprite_diameter_px, hero_hp_multiplier, pan_speed_fraction are authored fields from which max_health/move_speed/unit_visual_radius_world derive (H1/H2/H3); a definition whose authored stats mismatch its formulas fails loudly at load.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-heroes-003, system: heroes, gdd: design/gdd/sistema-de-heroes.md, domain: Data, anchor: "Enforcement 1 / AC-H02/H23", requirement: "Loud-fail-on-load policy (error/assert in dev builds, never silent clamp/substitution) for every out-of-range knob, missing relic_category, and sprite_diameter_px outside [48,96].", created: 2026-08-21, revised: "", status: active }
  - { id: TR-heroes-004, system: heroes, gdd: design/gdd/sistema-de-heroes.md, domain: Data, anchor: "Enforcement 2/3 / AC-H23b/c/d", requirement: "Joint config validation at load: base_deliberate+w_stakes+w_purpose must fall in [0.70,1.00] and base_deliberate>=0.35 as a separate individual floor — both loud-fail.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-heroes-005, system: heroes, gdd: design/gdd/sistema-de-heroes.md, domain: Ownership, anchor: "Enforcement 4 (test isolation)", requirement: "Knob config loads into an injectable/test-isolated instance, not a global mutable singleton, so a corrupt-config test does not contaminate canonical-formula tests.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-heroes-006, system: heroes, gdd: design/gdd/sistema-de-heroes.md, domain: Ownership, anchor: "States / Combate Regla 6", requirement: "Sistema de Heroes OWNS hero life state (ALIVE_IDLE/ALIVE_MOVING/ALIVE_ENGAGED/DYING/DEAD) and health_current; Combate only notifies transitions.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-heroes-007, system: heroes, gdd: design/gdd/sistema-de-heroes.md, domain: Timing, anchor: "Formula H5 / AC-H08/H15", requirement: "On crossing health_current<=0 the hero transitions to DYING that same frame and SNAPSHOTS and FREEZES D/T/P at that exact frame, before the sustained beat starts — never re-read in later frames.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-heroes-008, system: heroes, gdd: design/gdd/sistema-de-heroes.md, domain: Ownership, anchor: "Formula H5 / AC-H12", requirement: "This system evaluates Formula H4 (relic_quality) at the snapshot frame and adds the already-computed result to the payload; Permadeath transports but never recomputes it.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-heroes-009, system: heroes, gdd: design/gdd/sistema-de-heroes.md, domain: Communication, anchor: "Regla 5 / AC-H12", requirement: "Payload exposed to Permadeath on DYING->DEAD contains exactly hero_id, hero_name, relic_category, relic_quality and the snapshotted D/T/P, with no missing or null fields.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-heroes-010, system: heroes, gdd: design/gdd/sistema-de-heroes.md, domain: Ownership, anchor: "Formula H4 vars / OQ-3 / Dependencies", requirement: "D and P are provided by Combate as an external classifier; T=1-kaiju_timer_remaining_ratio is read from the Temporizador which OWNS that ratio — this system computes none of the three, only consumes them at the death frame.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-heroes-011, system: heroes, gdd: design/gdd/sistema-de-heroes.md, domain: Data, anchor: "Formula H4 / AC-H13/H16", requirement: "H4 is D-gated: relic_quality=clamp(base_accidental+D*(base_deliberate-base_accidental+w_stakes*T+w_purpose*P), 0.0, 1.0), effective output range [0.10,1.00], never 0.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-heroes-012, system: heroes, gdd: design/gdd/sistema-de-heroes.md, domain: Data, anchor: "Tier mapping / AC-H19/H20", requirement: "Tier mapping (Tier1 [0.10,0.35), Tier2 [0.35,0.70), Tier3 [0.70,1.00]) is a contract consumed by Forja, with inclusive-lower boundaries and precision enough to distinguish 0.3499 from 0.35 and 0.6999 from 0.70.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-heroes-013, system: heroes, gdd: design/gdd/sistema-de-heroes.md, domain: Data, anchor: "Regla 2 / AC-H06", requirement: "relic_category is fixed by definition and never varies with death circumstance; only relic_quality is emergent.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-heroes-014, system: heroes, gdd: design/gdd/sistema-de-heroes.md, domain: Data, anchor: "Regla 3 / Formula H3 / V-7 / AC-H07", requirement: "Each hero exposes position/hitbox and unit_visual_radius_world (>=0.5, always > 0.4583 troop ceiling) to Control, sustaining hero>troop priority at hitbox level; hero tiebreak is by proximity to click.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-heroes-015, system: heroes, gdd: design/gdd/sistema-de-heroes.md, domain: Communication, anchor: "States / AC-H09", requirement: "Entering DYING triggers Input's DEATH_HOLD context, suppressing all player input until Permadeath releases the beat.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-heroes-016, system: heroes, gdd: design/gdd/sistema-de-heroes.md, domain: Ownership, anchor: "States (DYING note) / AC-H11", requirement: "Permadeath — not this system — owns the beat timing and confirms DEAD; a hero stays DYING indefinitely until beat release.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-heroes-017, system: heroes, gdd: design/gdd/sistema-de-heroes.md, domain: Timing, anchor: "Edge Cases / AC-H24/H25", requirement: "Permadeath serializes death beats: two heroes entering DYING the same frame snapshot independently but never produce two simultaneous sustained DEATH_HOLDs; the order is defined by Permadeath.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-heroes-018, system: heroes, gdd: design/gdd/sistema-de-heroes.md, domain: Persistence, anchor: "Regla 4 / AC-H26", requirement: "Entering DYING triggers a mandatory immediate autosave to Guardado before the flow continues, and the persisted snapshot includes the full death payload explicitly marked 'death pending sealing'.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-heroes-019, system: heroes, gdd: design/gdd/sistema-de-heroes.md, domain: Persistence, anchor: "Edge Cases / AC-H27/H27c", requirement: "The load flow (Heroes+Guardado, no Permadeath) coerces a persisted DYING hero to DEAD and forges its relic from the persisted relic_quality, without replaying the visual beat — death is irreversible across a crash.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-heroes-020, system: heroes, gdd: design/gdd/sistema-de-heroes.md, domain: Data, anchor: "Regla 4 / AC-H27b", requirement: "DEAD is terminal and unactionable in session: every order (move, Sacrifice), heal effect, or add-to-selection is rejected as a no-op.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-heroes-021, system: heroes, gdd: design/gdd/sistema-de-heroes.md, domain: Communication, anchor: "Edge Cases / AC-H10", requirement: "A hero entering DYING is immediately removed from Control's active selection set.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-heroes-022, system: heroes, gdd: design/gdd/sistema-de-heroes.md, domain: Ownership, anchor: "Edge Cases / AC-H28 / OQ-1", requirement: "This system does NOT evaluate era victory/defeat — only notifies each individual death to its declared consumers.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-heroes-023, system: heroes, gdd: design/gdd/sistema-de-heroes.md, domain: Timing, anchor: "V-5/V-6 note (Permadeath Regla 4 / OQ-P6 #5)", requirement: "The node playing V-5->V-6 (and its particle/audio/tween children) must run exempt from the cooperative game_time_paused (Godot 4.6 PROCESS_MODE_ALWAYS); otherwise animation_done never arrives and every beat falls to safety timeout. (Mechanism reconciled with ADR-0002: real exemption is not-polling-TimeControl; ALWAYS is defensive.)", created: 2026-08-21, revised: "", status: active }
  - { id: TR-heroes-024, system: heroes, gdd: design/gdd/sistema-de-heroes.md, domain: Communication, anchor: "Interactions — Permadeath", requirement: "This system notifies end of the resolution animation (V-5->V-6) as animation_done, input to Permadeath Formula P1.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-heroes-025, system: heroes, gdd: design/gdd/sistema-de-heroes.md, domain: Timing, anchor: "U-4 / AC-H32c", requirement: "The projected-verdict readout recomputes live pre-death and FREEZES on entering DYING at the snapshotted value, not updating again until it resolves into the relic icon.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-heroes-026, system: heroes, gdd: design/gdd/sistema-de-heroes.md, domain: Communication, anchor: "U-3 / AC-H32b/H29", requirement: "Readout visibility is triggered by a projection of time_to_death/incoming_damage_rate_total provided by Encuentro con Kaiju (F2/F6), NOT by current HP — a joint contract, not a local UI knob; the readout reflects the most dangerous source.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-heroes-027, system: heroes, gdd: design/gdd/sistema-de-heroes.md, domain: Data, anchor: "U-2 / AC-H32a", requirement: "The readout exposes 3 discrete states that change exactly at tier boundaries (0.35, 0.70), with no intermediate/continuous state.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-heroes-028, system: heroes, gdd: design/gdd/sistema-de-heroes.md, domain: Platform, anchor: "U-1 / AC-H32e (art bible 4.5)", requirement: "The readout must communicate tier via three redundant channels (shape/frame, motion, tertiary color) and stay distinguishable under colorblindness or grayscale at LOD Level 1 (24-32px).", created: 2026-08-21, revised: "", status: active }
  - { id: TR-heroes-029, system: heroes, gdd: design/gdd/sistema-de-heroes.md, domain: Communication, anchor: "A-4 outcome-blind / AC-H34", requirement: "The decision-window audio cue must be outcome-blind: identical sample on rising cross, falling cross, and D-gate cross — no directional variant or special sting.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-heroes-030, system: heroes, gdd: design/gdd/sistema-de-heroes.md, domain: Engine, anchor: "V-4 (art bible 5.4)", requirement: "Two fixed LOD levels (not continuous); Level 2 activates ONLY on the DYING beat, Memorial Hall portrait, or relic reveal — requires 3 Level-2 assets per hero.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-heroes-031, system: heroes, gdd: design/gdd/sistema-de-heroes.md, domain: Ownership, anchor: "Tuning Knobs — consumed constants / H1", requirement: "Constants camera_pan_speed=30, world_unit_scale=48, melee_troop_max_health=40 are owned by other systems and consumed registered, never duplicated — changing melee troop HP re-derives hero_max_health.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-heroes-032, system: heroes, gdd: design/gdd/sistema-de-heroes.md, domain: Ownership, anchor: "Tuning Knobs / Combate Regla 8", requirement: "sacrifice_radius(3.0) and guard_radius(4.0) are knobs owned by this system but applied by Combate in D/P classification — value ownership separate from the application point.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-heroes-033, system: heroes, gdd: design/gdd/sistema-de-heroes.md, domain: Data, anchor: "Edge Cases / AC-H22", requirement: "Overkill does not affect relic_quality: two identical D/T/P scenarios produce identical results regardless of overkill amount (health clamps to 0 in Combate).", created: 2026-08-21, revised: "", status: active }

  # ─── COMBATE/DANO (Feature) — design/gdd/combate-dano.md ─────────────────────
  - { id: TR-combate-001, system: combate, gdd: design/gdd/combate-dano.md, domain: Ownership, anchor: "Regla 1 / AC-C01", requirement: "All game damage (unit<->unit and kaiju<->unit) is applied through a single apply_damage(target, amount, source) operation — no other code path mutates health_current.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-combate-002, system: combate, gdd: design/gdd/combate-dano.md, domain: Timing, anchor: "Regla 1 / F3 convention", requirement: "Combat resolves on the physics tick (_physics_process, fixed step), never _process, so F3 exact TTKs are reproducible and framerate-independent.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-combate-003, system: combate, gdd: design/gdd/combate-dano.md, domain: Timing, anchor: "Regla 1 / AC-C42", requirement: "Each tick resolves in two strict phases: (1) all pending apply_damage against life state at tick start; (2) only then all death notifications (DEAD/DYING) and D/P computation against post-damage world — no hit sees another same-tick hit's result.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-combate-004, system: combate, gdd: design/gdd/combate-dano.md, domain: Ownership, anchor: "Regla 2 / AC-C03", requirement: "CombatProfile (owned by this system) holds attack_damage(int), attack_range, attack_cooldown_s, aggro_range, leash_range per unit type (troop, hero, kaiju); Tropas/Heroes deliberately do NOT own combat stats.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-combate-005, system: combate, gdd: design/gdd/combate-dano.md, domain: Data, anchor: "Regla 2 / AC-C03", requirement: "CombatProfile is data-driven: changing the .tres changes behavior without touching code; no combat value is hardcoded.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-combate-006, system: combate, gdd: design/gdd/combate-dano.md, domain: Data, anchor: "F1 / AC-C02/C17/C18", requirement: "F1: health_after=clamp(health_before-attack_damage, 0, max_health) — health never negative and overkill discarded.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-combate-007, system: combate, gdd: design/gdd/combate-dano.md, domain: Timing, anchor: "Regla 3 / AC-C43", requirement: "Attack cooldown never resets on losing or switching target and keeps running in NO_TARGET (anti target-switch exploit).", created: 2026-08-21, revised: "", status: active }
  - { id: TR-combate-008, system: combate, gdd: design/gdd/combate-dano.md, domain: Timing, anchor: "Regla 3 / AC-C05/C43b", requirement: "On target acquisition an acquisition floor applies: the first hit never lands before a full attack_cooldown_s from the acquisition instant, even with an inherited cooldown already at 0.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-combate-009, system: combate, gdd: design/gdd/combate-dano.md, domain: Engine, anchor: "Regla 3", requirement: "No traveling projectiles in MVP: instant impact on hit resolution; the ranged role is modeled with larger attack_range, not projectile physics.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-combate-010, system: combate, gdd: design/gdd/combate-dano.md, domain: Engine, anchor: "Edge Cases / AC-C48", requirement: "attack_range is pure distance, no line-of-sight check in MVP (a ranged unit can fire through obstacles).", created: 2026-08-21, revised: "", status: active }
  - { id: TR-combate-011, system: combate, gdd: design/gdd/combate-dano.md, domain: Performance, anchor: "Regla 4 / AC-C06", requirement: "Auto-aggro selects the NEAREST valid enemy within aggro_range — not first-detected nor random; requires a deterministic proximity query.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-combate-012, system: combate, gdd: design/gdd/combate-dano.md, domain: Data, anchor: "Regla 4 / AC-C07b", requirement: "The hold position is fixed at the instant of entering TARGET_ACQUIRED, not updated during chase, and re-fixed on each new acquisition (including after chaining a kill) — requires per-combatant position state.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-combate-013, system: combate, gdd: design/gdd/combate-dano.md, domain: Data, anchor: "Regla 4 / AC-C07", requirement: "A unit exceeding leash_range from its hold position abandons the chase, returns to hold, and transitions to NO_TARGET.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-combate-014, system: combate, gdd: design/gdd/combate-dano.md, domain: Communication, anchor: "Regla 4 / AC-C08/C09/C45", requirement: "Combate reads explicit Control orders (attack-target, attack-move) that override auto-acquisition: attack-target consumes on target death (reverts to auto-aggro), attack-move continues toward destination auto-engaging.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-combate-015, system: combate, gdd: design/gdd/combate-dano.md, domain: Data, anchor: "States and Transitions", requirement: "Combate models a per-combatant engagement cycle (NO_TARGET/TARGET_ACQUIRED/ATTACKING) separate from unit life cycle, applied identically to troops, heroes, and kaiju.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-combate-016, system: combate, gdd: design/gdd/combate-dano.md, domain: Ownership, anchor: "Regla 6 / AC-C11/C12", requirement: "Combate does NOT own health or life state: on transition to TARGET_ACQUIRED/ATTACKING it only invokes the owning system's notification method (ENGAGED/ALIVE_ENGAGED) and never writes the state field directly.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-combate-017, system: combate, gdd: design/gdd/combate-dano.md, domain: Data, anchor: "Regla 7 / AC-C13/C-NEG", requirement: "Troop death: DEAD without capturing or exposing killer_id, location, timestamp or cause — no circumstance field may exist on that path.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-combate-018, system: combate, gdd: design/gdd/combate-dano.md, domain: Timing, anchor: "Regla 7/8 / AC-C14", requirement: "Hero death: DYING + Combate computes and FREEZES D and P at the same 0-crossing frame, without re-reading them in later frames.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-combate-019, system: combate, gdd: design/gdd/combate-dano.md, domain: Ownership, anchor: "Regla 8 / AC-C35", requirement: "Combate is a pure classifier: it only READS documented getters from Control (sacrifice_command_active, sacrifice_command_destination) and Kaiju (marked_targets/marked_threats) — never issues a Sacrifice command, never marks, and does not cache D/P between frames.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-combate-020, system: combate, gdd: design/gdd/combate-dano.md, domain: Data, anchor: "Regla 8 / AC-C28..C31", requirement: "D=1 iff all three hold (Sacrifice command confirmed, active/not-cancelled at death frame, death within sacrifice_radius=3.0 of ordered destination); otherwise D=0.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-combate-021, system: combate, gdd: design/gdd/combate-dano.md, domain: Data, anchor: "Regla 8 / AC-C32/C33/C34", requirement: "P=1 by either of two equivalent paths: death within guard_radius=4.0 of a marked target/ally (defensive) or neutralization of a marked critical kaiju threat (offensive).", created: 2026-08-21, revised: "", status: active }
  - { id: TR-combate-022, system: combate, gdd: design/gdd/combate-dano.md, domain: Ownership, anchor: "Regla 8 / AC-C36", requirement: "Combate does NOT compute T and its payload cannot include any T/kaiju_timer_remaining_ratio field — that input is provided by the Temporizador and read by Heroes.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-combate-023, system: combate, gdd: design/gdd/combate-dano.md, domain: Communication, anchor: "AC-C50", requirement: "The D/P hand-off to Heroes occurs at the same 0-crossing frame so Heroes can combine it with T and compute relic_quality with no inter-system latency.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-combate-024, system: combate, gdd: design/gdd/combate-dano.md, domain: Ownership, anchor: "Regla 9 / AC-C16/C47", requirement: "Combate does NOT evaluate era victory/defeat: neither the kaiju reaching 0 nor the last death emits an end-of-era evaluation signal or call.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-combate-025, system: combate, gdd: design/gdd/combate-dano.md, domain: Data, anchor: "Enforcement / F5 / AC-C26/C27/C37..39", requirement: "Loud-fail-on-load (no clamp) for attack_damage>=1, attack_cooldown_s>=0.1, no negatives, and invariant F5 attack_range<=aggro_range<=leash_range.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-combate-026, system: combate, gdd: design/gdd/combate-dano.md, domain: Data, anchor: "F5 named exception / AC-C27b", requirement: "Named loader exception: the <=leash_range leg of F5 is not evaluated for the Kaiju while its leash_range is the sentinel provisional* (Kaiju nullifies the field entirely); the attack_range<=aggro_range leg keeps normal loud-fail.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-combate-027, system: combate, gdd: design/gdd/combate-dano.md, domain: Data, anchor: "Edge Cases / AC-C40", requirement: "apply_damage on an already-DEAD unit or an already-DYING hero is a no-op — does not decrement health nor re-fire the death notification.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-combate-028, system: combate, gdd: design/gdd/combate-dano.md, domain: Data, anchor: "Edge Cases / AC-C41", requirement: "No friendly fire in MVP: apply_damage applies only between opposing factions — requires a per-unit faction concept queryable at the application point.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-combate-029, system: combate, gdd: design/gdd/combate-dano.md, domain: Timing, anchor: "Edge Cases / AC-C52", requirement: "Combat cooldowns follow game-time scale, not real time: if the DEATH_HOLD beat pauses time (game_time_paused, now owned by TimeControl per ADR-0002, read by Combate), no cooldown advances.", created: 2026-08-21, revised: "2026-08-21", status: active }
  - { id: TR-combate-030, system: combate, gdd: design/gdd/combate-dano.md, domain: Communication, anchor: "CU-1", requirement: "Combate exposes per unit current_health/max_health, engagement state (NO_TARGET/TARGET_ACQUIRED/ATTACKING), and damage events for UI/HUD and VFX consumption.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-combate-031, system: combate, gdd: design/gdd/combate-dano.md, domain: Communication, anchor: "CU-2 / CV-1", requirement: "Each hit resolution emits an impact event (who hit whom, how much) that UI/HUD and VFX hook for hit feedback; Combate provides the trigger, not the render.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-combate-032, system: combate, gdd: design/gdd/combate-dano.md, domain: Ownership, anchor: "CU-3 / AC-C51", requirement: "Combate exposes recent raw incoming-damage rate per unit as an input; it does NOT compute time_to_death — that projection is owned by Encuentro con Kaiju.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-combate-033, system: combate, gdd: design/gdd/combate-dano.md, domain: Communication, anchor: "CU-4", requirement: "Combate exposes no verdict text or outcome judgments — only numeric state and events.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-combate-034, system: combate, gdd: design/gdd/combate-dano.md, domain: Timing, anchor: "CV-3", requirement: "On notifying DYING, the hero's engagement state freezes with it that frame: no attacker/target keeps animating an exchange against an already-DYING unit.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-combate-035, system: combate, gdd: design/gdd/combate-dano.md, domain: Timing, anchor: "CV-4", requirement: "The kaiju attack (attack_cooldown_s=4.5) must telegraph before landing, giving legible reaction time — the telegraph is a data/timing requirement, not just aesthetic.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-combate-036, system: combate, gdd: design/gdd/combate-dano.md, domain: Ownership, anchor: "Tuning Knobs — consumed constants", requirement: "HP constants (melee_infantry=40, ranged_troop=20, support_troop=28, heroes 120-200) and radii sacrifice_radius=3.0/guard_radius=4.0 are owned by Tropas/Heroes and consumed without duplication; changing HP there rebalances combat here.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-combate-037, system: combate, gdd: design/gdd/combate-dano.md, domain: Engine, anchor: "CV-2", requirement: "Troop death triggers the LOD-Level-1 fall/dissolve animation with the same duration as any state transition — no camera pause, no dedicated light, no desaturation (any VFX giving it pause is rejected in review).", created: 2026-08-21, revised: "", status: active }
  - { id: TR-combate-038, system: combate, gdd: design/gdd/combate-dano.md, domain: Ownership, anchor: "CV-3 / CA-3", requirement: "Combate triggers the hero death crossing but does not stage the beat: the sustained staging is Permadeath's; Combate only ducks its own combat bed when the beat fires.", created: 2026-08-21, revised: "", status: active }

  # ─── ENCUENTRO CON KAIJU (Feature) — design/gdd/encuentro-con-kaiju.md ───────
  - { id: TR-kaiju-001, system: kaiju, gdd: design/gdd/encuentro-con-kaiju.md, domain: Communication, anchor: "Regla 1 / AC-K01a/b", requirement: "Instances the ACTIVE-era kaiju the same frame it receives entered_climax from Temporizador, never before.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-kaiju-002, system: kaiju, gdd: design/gdd/encuentro-con-kaiju.md, domain: Data, anchor: "Regla 1 / AC-K02", requirement: "The kaiju CombatProfile (attack_damage, attack_range, attack_cooldown_s, aggro_range) is populated exclusively from the kaiju_definition resource of Datos de Era — changing the .tres changes behavior without code.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-kaiju-003, system: kaiju, gdd: design/gdd/encuentro-con-kaiju.md, domain: Engine, anchor: "Regla 2 / AC-K05b/K06", requirement: "The kaiju leash_range field is never read: pursuit is unlimited during CLIMAX and only ends by target death, exit of aggro_range without valid candidate, or reselection via Regla 3.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-kaiju-004, system: kaiju, gdd: design/gdd/encuentro-con-kaiju.md, domain: Engine, anchor: "Regla 3 / F1 / AC-K07/K16", requirement: "Kaiju target selection uses F1 threat score (threat_damage_weight*recent_damage_dealt + hero_threat_bonus*is_hero + random_variation), overriding Combate's proximity aggro for the kaiju only; there is never a silent distance fallback.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-kaiju-005, system: kaiju, gdd: design/gdd/encuentro-con-kaiju.md, domain: Data, anchor: "F1 (recent_damage_dealt algorithm)", requirement: "recent_damage_dealt requires, per candidate, a list of damage events (timestamp_climax_s, amount) with lazy pruning over a fixed threat_window_s sliding window; decayed bucket sums allowed but NOT a continuous exponential average.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-kaiju-006, system: kaiju, gdd: design/gdd/encuentro-con-kaiju.md, domain: Timing, anchor: "F1 / AC-K09", requirement: "Damage-event accumulation for F1 occurs continuously in all intent-cycle states; only the EVALUATION of threat_score is restricted to entering SEEKING.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-kaiju-007, system: kaiju, gdd: design/gdd/encuentro-con-kaiju.md, domain: Engine, anchor: "Regla 8 / AC-K08/K12/K13", requirement: "Esbirros use Combate's standard engagement cycle (proximity aggro, no telegraph) and never enter SEEKING/TELEGRAPHING/STRIKING/STAGGERED — the AI-architecture asymmetry between kaiju and esbirros is deliberate.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-kaiju-008, system: kaiju, gdd: design/gdd/encuentro-con-kaiju.md, domain: Ownership, anchor: "Regla 4 / States", requirement: "The system owns its own FSM — the intent cycle SEEKING->TELEGRAPHING->STRIKING->SEEKING (+STAGGERED) — layered OVER Combate's separate engagement FSM (NO_TARGET/TARGET_ACQUIRED/ATTACKING), which it does not own or modify.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-kaiju-009, system: kaiju, gdd: design/gdd/encuentro-con-kaiju.md, domain: Engine, anchor: "Regla 4 / AC-K61", requirement: "Attack gate: while the kaiju is in SEEKING/TELEGRAPHING, base-FSM attack resolution is suppressed and its attack_cooldown_s does not run, even if the target is in range with cooldown ready.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-kaiju-010, system: kaiju, gdd: design/gdd/encuentro-con-kaiju.md, domain: Timing, anchor: "Regla 4 (override) / AC-K75", requirement: "Entering STRIKING invokes apply_damage directly and synchronously that same frame, skipping the base-FSM acquisition floor and full-cooldown wait for that single call; attack_cooldown_s begins counting after that hit.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-kaiju-011, system: kaiju, gdd: design/gdd/encuentro-con-kaiju.md, domain: Ownership, anchor: "States (hard requirement) / AC-K87", requirement: "Single-owner hard requirement: the kaiju must be fully excluded from Combate's generic auto-attack loop — the intent controller is the ONLY caller of apply_damage for the kaiju in all states; can_attack() is no longer consulted for it. No reliance on _physics_process order between siblings.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-kaiju-012, system: kaiju, gdd: design/gdd/encuentro-con-kaiju.md, domain: Timing, anchor: "States (hard req) / AC-K88", requirement: "The STRIKING handler must synchronously (same handler) check whether the kaiju crossed 0 HP before advancing to SEEKING or reselecting, and abort immediately; no reliance on death-signal fan-out order.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-kaiju-013, system: kaiju, gdd: design/gdd/encuentro-con-kaiju.md, domain: Engine, anchor: "States ('for the ADR') / Regla 9", requirement: "The apply_damage signal/notification connection from Combate must be immediate mode, never CONNECT_DEFERRED, so Regla 9 'victory in that instant' is synchronous.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-kaiju-014, system: kaiju, gdd: design/gdd/encuentro-con-kaiju.md, domain: Communication, anchor: "Regla 5 / AC-K43/K44/K45", requirement: "On entering TELEGRAPHING the system writes marked_target (defensive path) and marked_threat (offensive path) to Combate for P computation, and clears them immediately on any state exit — never persisting between telegraphs.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-kaiju-015, system: kaiju, gdd: design/gdd/encuentro-con-kaiju.md, domain: Communication, anchor: "KU-1 / AC-K46", requirement: "Exit from TELEGRAPHING exposes the reason as a three-case enum — (a) STRIKING, (b) STAGGERED, (c) cancellation by death/aggro exit — as part of the mark-clear event.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-kaiju-016, system: kaiju, gdd: design/gdd/encuentro-con-kaiju.md, domain: Communication, anchor: "Regla 6 / F2 / AC-K23", requirement: "The system exposes per hero time_to_death=telegraph_duration_s+(kill_time_hits_kaiju*attack_cooldown_s_kaiju) with hero_HP_at_telegraph_start snapshotted on entering TELEGRAPHING and never re-read during the telegraph.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-kaiju-017, system: kaiju, gdd: design/gdd/encuentro-con-kaiju.md, domain: Data, anchor: "AC-K78 / Edge Cases", requirement: "When the kaiju is not telegraphing against a hero, time_to_death is exposed as an explicit 'not applicable / no kaiju telegraph' state — never a 0 or infinity sentinel.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-kaiju-018, system: kaiju, gdd: design/gdd/encuentro-con-kaiju.md, domain: Communication, anchor: "Regla 6b / F6 / AC-K67", requirement: "The system exposes per hero incoming_damage_rate_total = kaiju_projected_dps(hero) + sum esbirro_dps(e) over each esbirro currently engaged to that hero, whenever the hero is under attack.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-kaiju-019, system: kaiju, gdd: design/gdd/encuentro-con-kaiju.md, domain: Ownership, anchor: "KU-2 / OQ-14", requirement: "The system exposes time_to_death and incoming_damage_rate_total as raw per-frame unsmoothed values; anti-flicker smoothing/hysteresis is the consumer's responsibility.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-kaiju-020, system: kaiju, gdd: design/gdd/encuentro-con-kaiju.md, domain: Data, anchor: "Regla 7 / F1 note / AC-K35/K36", requirement: "The neutralization counter (Regla 7) is a distinct accumulator with no shared state with the F1 sliding window: it resets to 0 on each SEEKING->TELEGRAPHING transition and admits no residual damage from earlier phases.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-kaiju-021, system: kaiju, gdd: design/gdd/encuentro-con-kaiju.md, domain: Data, anchor: "F3 note / AC-K31", requirement: "The esbirro spawner keeps last_spawned_wave_count and instances only the delta (wave_count(t)-last_spawned_wave_count)*esbirro_wave_size — never wave_count(t)*esbirro_wave_size.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-kaiju-022, system: kaiju, gdd: design/gdd/encuentro-con-kaiju.md, domain: Performance, anchor: "Regla 8b / F3 gate / AC-K69", requirement: "Concurrency gate: spawnable=min((wave_count(t)-last_spawned_wave_count)*esbirro_wave_size, max(0, max_concurrent_esbirros-alive_esbirro_count)); a partially-spawned wave keeps its remainder PENDING (deferred, not discarded) and last_spawned_wave_count only advances on full waves.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-kaiju-023, system: kaiju, gdd: design/gdd/encuentro-con-kaiju.md, domain: Performance, anchor: "Tuning Knobs / AC-K84", requirement: "On-screen concurrent entity budget: max_concurrent_esbirros recommended 0-16, 17-24 unvalidated technical max; simultaneous player troops/heroes count against the same screen budget.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-kaiju-024, system: kaiju, gdd: design/gdd/encuentro-con-kaiju.md, domain: Ownership, anchor: "Regla 9 / AC-K49/K51/K52/K53", requirement: "This system OWNS era victory/defeat evaluation: victory when the kaiju crosses 0 HP, defeat when no hero remains ALIVE_* (troops are not a condition), both declared the same frame with absolute priority over any intent-cycle state.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-kaiju-025, system: kaiju, gdd: design/gdd/encuentro-con-kaiju.md, domain: Communication, anchor: "KU-4 / AC-K57/K60", requirement: "The era verdict is emitted as a single discrete event (once per verdict), not a per-frame repeated signal, consumed by Transicion de Era and UI/HUD.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-kaiju-026, system: kaiju, gdd: design/gdd/encuentro-con-kaiju.md, domain: Data, anchor: "Regla 10 / F5 / AC-K64", requirement: "ENRAGED is not an FSM state but a latched monotone orthogonal flag that only alters effective values (telegraph_duration_s_effective, attack_damage_effective) via F5; it introduces no new transitions and never reverts to false within a CLIMAX.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-kaiju-027, system: kaiju, gdd: design/gdd/encuentro-con-kaiju.md, domain: Data, anchor: "Regla 10b / F5 / AC-K63b/K86", requirement: "Fury trigger (b) requires per hero a last_combat_damage_climax_s (timestamp of last damage dealt to kaiju OR esbirro) and evaluating each frame engaged_hero_count(t)<required_engaged_heroes(t)=clamp(floor(hero_engagement_fraction*living_hero_count(t))+1,1,living_hero_count(t)) over a sliding hero_disengage_window_s.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-kaiju-028, system: kaiju, gdd: design/gdd/encuentro-con-kaiju.md, domain: Timing, anchor: "Edge Cases (Fury during TELEGRAPHING) / F5", requirement: "If Fury activates mid-TELEGRAPHING, the effective telegraph_duration_s recomputes hot; if elapsed already exceeds the new shorter value the telegraph resolves to STRIKING immediately — time never reverts, no negative remainder, and Fury does not restart the cycle nor clear in-progress marking.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-kaiju-029, system: kaiju, gdd: design/gdd/encuentro-con-kaiju.md, domain: Timing, anchor: "Regla 11 / AC-K89", requirement: "Cooperative freeze: while game_time_paused=true (Permadeath DEATH_HOLD beat), NO internal clock advances (telegraph_duration_s, stagger_duration_s, F1 window, neutralization counter, climax_elapsed_s), threat_score is not recomputed, and STRIKING does not invoke apply_damage; the flag is read by polling in _process, never via SceneTree.paused; on release the cycle resumes exactly where it left off. (Flag source now TimeControl per ADR-0002.)", created: 2026-08-21, revised: "2026-08-21", status: active }
  - { id: TR-kaiju-030, system: kaiju, gdd: design/gdd/encuentro-con-kaiju.md, domain: Timing, anchor: "Formulas (Determinism) / AC-K70/K76", requirement: "All clocks in this system accumulate game-time by delta in _physics_process (never real time or frame counting), guaranteeing framerate-independent pacing for climax_elapsed_s, wave_count(t), Fury state, the F1 threat window and the neutralization counter. (Clock source now TimeControl.game_tick per ADR-0002.)", created: 2026-08-21, revised: "2026-08-21", status: active }
  - { id: TR-kaiju-031, system: kaiju, gdd: design/gdd/encuentro-con-kaiju.md, domain: Ownership, anchor: "F3 / AC-K04", requirement: "climax_elapsed_s is a clock OWNED by this system that resets to 0 on entered_climax, independent of the Temporizador clock; the system consumes entered_climax/kaiju_timer_remaining_ratio read-only and never writes back to Temporizador.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-kaiju-032, system: kaiju, gdd: design/gdd/encuentro-con-kaiju.md, domain: Timing, anchor: "Formulas (Determinism) / AC-K71", requirement: "All randomness (F1 random_variation) uses an injectable/seedable RandomNumberGenerator instance from the test harness — never global randf/randi without seed.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-kaiju-033, system: kaiju, gdd: design/gdd/encuentro-con-kaiju.md, domain: Data, anchor: "Formulas (entity_id) / AC-K48", requirement: "entity_id is a stable int assigned at spawn by a monotone encounter counter (reset to 0 on entered_climax), owned by this system or the combatant spawner — never Godot get_instance_id(); it is the deterministic tiebreak key of threat_score.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-kaiju-034, system: kaiju, gdd: design/gdd/encuentro-con-kaiju.md, domain: Platform, anchor: "Formulas (cross-platform determinism) / AC-K71", requirement: "RNG determinism is bounded to same-platform/same-build: exact-tiebreak ACs are tested against the target export platform, not assuming byte-identical output cross-architecture; only entity_id tiebreak is cross-platform deterministic by construction.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-kaiju-035, system: kaiju, gdd: design/gdd/encuentro-con-kaiju.md, domain: Engine, anchor: "Edge Cases (Godot 4.6 note) / AC-K79..K84", requirement: "Config loud-fails must be implemented as a custom property setter with push_error() + explicit halt (fires in debug and release, both on script assignment and .tres deserialization) — never assert() alone, nor @export_range hints, nor _validate_property.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-kaiju-036, system: kaiju, gdd: design/gdd/encuentro-con-kaiju.md, domain: Data, anchor: "Edge Cases (cross-GDD config) / AC-K74/K85", requirement: "Cross-resource era checks (ceil(hero_max_health/kaiju_attack_damage)*kaiju_attack_cooldown_s+telegraph_duration_s>=30; kaiju_attack_damage*neutralize_hits_equivalent>telegraph_duration_s*max_single_troop_dps unless allow_single_troop_neutralize=true) are implemented as a dedicated validate() called immediately after ResourceLoader.load() that propagates an Error; all era loading must be centralized in one function so no call-site skips the check.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-kaiju-037, system: kaiju, gdd: design/gdd/encuentro-con-kaiju.md, domain: Communication, anchor: "KU-1 / AC-K55/K58/K77", requirement: "The system exposes to UI/HUD throughout CLIMAX: intent-cycle state, ENRAGED flag, marked_target/marked_threat identity, and telegraph progress as a continuous float [0.0,1.0] (not a 1/2/3 third index — the consumer derives the third).", created: 2026-08-21, revised: "", status: active }
  - { id: TR-kaiju-038, system: kaiju, gdd: design/gdd/encuentro-con-kaiju.md, domain: Communication, anchor: "KA-1 / AC-K59", requirement: "The Audio contract requires a sub-state hook (on_telegraph_progress) firing at each third boundary, plus a state-transition hook (on_intent_transition) and a Fury-entry hook (on_enrage) — a from_state/to_state hook cannot express the three internal thirds of TELEGRAPHING.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-kaiju-039, system: kaiju, gdd: design/gdd/encuentro-con-kaiju.md, domain: Data, anchor: "KU-3 / AC-K56", requirement: "No payload exposed by this system contains editorialized text ('Watch out!'/'Danger!') — only numeric/enumerated state and discrete events.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-kaiju-040, system: kaiju, gdd: design/gdd/encuentro-con-kaiju.md, domain: Performance, anchor: "KV-1 / art bible 3.4", requirement: "Scale contrast: the kaiju must win the visual hierarchy by default and its telegraph escalation be legible from any battle camera zoom, with units at 24-32px and max on-screen clutter.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-kaiju-041, system: kaiju, gdd: design/gdd/encuentro-con-kaiju.md, domain: Engine, anchor: "KV-5", requirement: "Hitstop of 2-4 frames scaled by target type (hero/troop) accompanies ONLY the kaiju STRIKING hits — never routine troop/esbirro hits, and no camera pause.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-kaiju-042, system: kaiju, gdd: design/gdd/encuentro-con-kaiju.md, domain: Persistence, anchor: "KV-5", requirement: "Each non-neutralized STRIKING adds a permanent, cumulative crack to the screen-border motif, persistent throughout the current era.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-kaiju-043, system: kaiju, gdd: design/gdd/encuentro-con-kaiju.md, domain: Platform, anchor: "KV-1b / KV-1", requirement: "Mandatory non-auditory peripheral channel: screen-border vignette pulse + gamepad rumble, scaling on the same third rhythm as the kaiju body from third 1, perceptible with eyes anywhere on screen.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-kaiju-044, system: kaiju, gdd: design/gdd/encuentro-con-kaiju.md, domain: Platform, anchor: "KV-10", requirement: "Photosensitivity limit: the luminous pulse (kaiju body and KV-1b vignette) never exceeds 3 flashes/sec at its fastest, including the Fury-compressed form; if the rate derived from telegraph_duration_s_effective would cross it, urgency is expressed by sustained bloom intensity/extent. A reduced-flash toggle must replace the pulse with a continuous ramp preserving the three-third read.", created: 2026-08-21, revised: "", status: active }

  # ─── TEMPORIZADOR DE PREPARACION/RITUAL (Core) — design/gdd/temporizador-de-preparacion-ritual.md ───
  - { id: TR-temporizador-001, system: temporizador, gdd: design/gdd/temporizador-de-preparacion-ritual.md, domain: Data, anchor: "Regla 1 / AC-T01", requirement: "All timing config (approach_duration_s, imminent_window_s) is read from the ACTIVE EraDefinition; no timing value is hardcoded — changing the .tres changes behavior.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-temporizador-002, system: temporizador, gdd: design/gdd/temporizador-de-preparacion-ritual.md, domain: Data, anchor: "Regla 2 / F3 / AC-T02", requirement: "There is a SINGLE clock (elapsed_s) and the three phases are thresholds over it, not separate clocks; elapsed_s is continuous across any phase crossing (never resets or jumps).", created: 2026-08-21, revised: "", status: active }
  - { id: TR-temporizador-003, system: temporizador, gdd: design/gdd/temporizador-de-preparacion-ritual.md, domain: Ownership, anchor: "Regla 3 / AC-T03/T03b", requirement: "This system is the sole owner and source of truth of kaiju_timer_remaining_ratio in [0,1]; Kaiju and Heroes consume it read-only and no consumer may modify it or touch the internal elapsed_s.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-temporizador-004, system: temporizador, gdd: design/gdd/temporizador-de-preparacion-ritual.md, domain: Ownership, anchor: "Regla 4 / AC-T04", requirement: "No gameplay action (move troops, invoke resources, hero commands) can alter elapsed_s or phase — there is no write path from gameplay (no acceleration, pause, or reverse).", created: 2026-08-21, revised: "", status: active }
  - { id: TR-temporizador-005, system: temporizador, gdd: design/gdd/temporizador-de-preparacion-ritual.md, domain: Timing, anchor: "Regla 4b / AC-T04b", requirement: "elapsed_s is monotone non-decreasing during active play: each successive read across consecutive frames is always >= the previous.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-temporizador-006, system: temporizador, gdd: design/gdd/temporizador-de-preparacion-ritual.md, domain: Communication, anchor: "Regla 5 / AC-T05", requirement: "current_phase and time_remaining_to_climax_s are queryable and correct per F1/F3 on ANY frame while the era is ACTIVE — never null or stale.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-temporizador-007, system: temporizador, gdd: design/gdd/temporizador-de-preparacion-ritual.md, domain: Timing, anchor: "Edge Cases / AC-T19", requirement: "Phase-change signals entered_imminent and entered_climax are emitted in order and within the same time step even if one large delta crosses PREPARATION directly to CLIMAX — no consumer can miss entered_imminent to a framerate hitch.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-temporizador-008, system: temporizador, gdd: design/gdd/temporizador-de-preparacion-ritual.md, domain: Timing, anchor: "Regla 6 / AC-T06/T20", requirement: "On entering CLIMAX, kaiju_timer_remaining_ratio fixes exactly at 0.0 and stays there indefinitely, and internal elapsed_s FREEZES at approach_duration_s (avoids unbounded growth) regardless of F1/F2 clamp guards.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-temporizador-009, system: temporizador, gdd: design/gdd/temporizador-de-preparacion-ritual.md, domain: Ownership, anchor: "Regla 7 / AC-T07/T07b", requirement: "Public surface is strictly pacing: entered_imminent/entered_climax signals and phase/ratio/time/imminent_local_progress getters — no instancing, AI or damage methods; the system must complete a PREPARATION->IMMINENT->CLIMAX cycle instanced in isolation, with no combat system present and no missing-dependency error.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-temporizador-010, system: temporizador, gdd: design/gdd/temporizador-de-preparacion-ritual.md, domain: Timing, anchor: "Edge Cases / AC-T21", requirement: "elapsed_s accumulates game-time delta (affected by pause and time scale), never real time or frame count: two sims with the same total game time in different step sizes (60x1/60s vs 30x1/30s) produce identical elapsed_s, phase and ratio. (Game-time source now TimeControl per ADR-0002.)", created: 2026-08-21, revised: "2026-08-21", status: active }
  - { id: TR-temporizador-011, system: temporizador, gdd: design/gdd/temporizador-de-preparacion-ritual.md, domain: Timing, anchor: "Regla 4 / Edge Cases / AC-T22", requirement: "The global menu pause freezes elapsed_s while real time passes, and on unpause the clock resumes exactly from its held value — menu pause is not a gameplay path to stop the clock. (NOTE: menu pause via SceneTree.paused; its interaction with TimeControl is an open item for the TimeControl/save-persistence ADRs.)", created: 2026-08-21, revised: "", status: active }
  - { id: TR-temporizador-012, system: temporizador, gdd: design/gdd/temporizador-de-preparacion-ritual.md, domain: Persistence, anchor: "Edge Cases / AC-T23 / Dependencies", requirement: "elapsed_s and current phase are part of savable state; on reload the phase is deterministically RECOMPUTED from elapsed_s via F3 and never trusts the persisted phase value (even if desynced).", created: 2026-08-21, revised: "", status: active }
  - { id: TR-temporizador-013, system: temporizador, gdd: design/gdd/temporizador-de-preparacion-ritual.md, domain: Persistence, anchor: "Edge Cases (autosave) / AC-T23", requirement: "On autosave (e.g. hero death) or manual save during any phase, elapsed_s and phase are captured on that same frame, consistent with the Heroes snapshot reading kaiju_timer_remaining_ratio at the death frame.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-temporizador-014, system: temporizador, gdd: design/gdd/temporizador-de-preparacion-ritual.md, domain: Data, anchor: "Edge Cases / AC-T24", requirement: "Before the era is ACTIVE the clock does not run and the system returns an explicit documented 'not active' state, never a misleading 1.0/PREPARATION suggesting an encounter in progress.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-temporizador-015, system: temporizador, gdd: design/gdd/temporizador-de-preparacion-ritual.md, domain: Ownership, anchor: "Regla 6 / States / AC-T25", requirement: "CLIMAX is terminal for this system: it never transitions out of it by itself and stays with ratio=0.0 indefinitely even if no external system evaluates the era's end — victory/defeat evaluation is NOT owned by this system.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-temporizador-016, system: temporizador, gdd: design/gdd/temporizador-de-preparacion-ritual.md, domain: Data, anchor: "Tuning Knobs Enforcement / AC-T17/T18/T26/T27", requirement: "Three distinct config-validation tiers at EraDefinition load: (1) structural constraints (approach_duration_s>0, 0<imminent_window_s<approach_duration_s) -> always loud-fail, no clamp; (2) safe feel ranges ([300,1800],[30,90]) -> loud-fail in dev builds; (3) the ratio imminent_window_s<0.20*approach_duration_s is advisory and load must complete without error if violated.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-temporizador-017, system: temporizador, gdd: design/gdd/temporizador-de-preparacion-ritual.md, domain: Timing, anchor: "F3 (boundary convention) / AC-T13..T16", requirement: "Inclusive-lower boundary convention in F3: at elapsed_s==imminent_threshold_s the phase is already IMMINENT and at elapsed_s==approach_duration_s already CLIMAX, with no ambiguous frame between phases.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-temporizador-018, system: temporizador, gdd: design/gdd/temporizador-de-preparacion-ritual.md, domain: Data, anchor: "Formulas (float comparison) / AC-T11/T11b", requirement: "Non-integer float comparisons use a +-0.0001 tolerance (never strict equality) because several F4 ratios are non-terminating fractions not exactly representable in binary float.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-temporizador-019, system: temporizador, gdd: design/gdd/temporizador-de-preparacion-ritual.md, domain: Communication, anchor: "F4 / VA-1 / U-2", requirement: "The system exposes imminent_local_progress in [0.0,1.0] (derived, monotone, meaningful only during IMMINENT) as a continuous signal for Audio crescendo ramps and UI visual escalation, without exposing raw seconds.", created: 2026-08-21, revised: "", status: active }

  # ─── PERMADEATH (Feature) — design/gdd/permadeath.md ─────────────────────────
  - { id: TR-permadeath-001, system: permadeath, gdd: design/gdd/permadeath.md, domain: Data, anchor: "Regla 1 / AC-P01/P02", requirement: "Permadeath receives from Heroes a circumstance payload with exactly hero_id, hero_name, relic_category, relic_quality (already computed by H4) and the snapshotted D/T/P, and never computes, recomputes or mutates any of them — only transports.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-permadeath-002, system: permadeath, gdd: design/gdd/permadeath.md, domain: Ownership, anchor: "Regla 5 / AC-P15", requirement: "Writing the hero state field is owned by Heroes; Permadeath only invokes the DEAD-confirmation method, never writes the field directly.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-permadeath-003, system: permadeath, gdd: design/gdd/permadeath.md, domain: Ownership, anchor: "Regla 4 / AC-P12", requirement: "Permadeath owns and publishes the boolean game_time_paused, set true on a beat entering HOLDING and back to false on RESOLVED; Combate (AC-C52), Kaiju (Regla 11/AC-K89) and potentially the Temporizador read it. (Superseded by ADR-0002: TimeControl now owns the regime; Permadeath requests PAUSED.)", created: 2026-08-21, revised: "2026-08-21", status: active }
  - { id: TR-permadeath-004, system: permadeath, gdd: design/gdd/permadeath.md, domain: Timing, anchor: "Regla 4 / AC-P07b", requirement: "Global pause is cooperative by flag polling/notification — Permadeath never sets SceneTree.paused=true; each consumer decides not to advance its logic while it reads game_time_paused==true.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-permadeath-005, system: permadeath, gdd: design/gdd/permadeath.md, domain: Communication, anchor: "OQ-P5 sub-decisions", requirement: "Publication of game_time_paused must be hybrid: a game_time_paused_changed(bool) signal for edge transitions PLUS a boolean getter for late-subscribing consumers (pure per-frame polling is fragile).", created: 2026-08-21, revised: "", status: active }
  - { id: TR-permadeath-006, system: permadeath, gdd: design/gdd/permadeath.md, domain: Timing, anchor: "Edge Cases / Formula P1 / AC-P07", requirement: "The node managing the beat runs on a clock exempt from global pause (PROCESS_MODE_ALWAYS), accumulating elapsed_s by UNSCALED delta; if it ran on the paused scale the beat would deadlock. (Mechanism reconciled with ADR-0002: exemption = not-polling-TimeControl; ALWAYS is defensive.)", created: 2026-08-21, revised: "", status: active }
  - { id: TR-permadeath-007, system: permadeath, gdd: design/gdd/permadeath.md, domain: Engine, anchor: "Regla 4 corollary / cross-GDD #5", requirement: "The Heroes resolution-animation node V-5->V-6 (and its particle/audio/tween children) must run PROCESS_MODE_ALWAYS, or animation_done never arrives and every death falls to the timeout path.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-permadeath-008, system: permadeath, gdd: design/gdd/permadeath.md, domain: Timing, anchor: "Formula P1 / AC-P04/P05/P06", requirement: "Beat-release condition is release=(elapsed_s>=death_hold_min_duration_s) AND (animation_done OR elapsed_s>=death_hold_timeout_s), evaluated each tick while a beat is HOLDING.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-permadeath-009, system: permadeath, gdd: design/gdd/permadeath.md, domain: Communication, anchor: "Formula P1 / OQ-P2", requirement: "A signal/hook animation_done from Heroes is required to notify end of the V-5->V-6 resolution animation; its exact form (Godot signal with/without payload, callback) is not fixed.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-permadeath-010, system: permadeath, gdd: design/gdd/permadeath.md, domain: Communication, anchor: "Regla 2 / PV-5 / AC-P06b", requirement: "On the timeout path, Permadeath must emit to Heroes/Forja a 'force reveal to end-state' signal (force_relic_reveal_final(), provisional) before/with the hand-off — no RESOLVED can occur without the relic icon shown in its final state.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-permadeath-011, system: permadeath, gdd: design/gdd/permadeath.md, domain: Data, anchor: "Regla 3 / AC-P10", requirement: "Permadeath keeps a FIFO queue of pending deaths with deterministic order (arrival + tiebreak by smallest hero_id), reproducible every run; the order is not configurable.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-permadeath-012, system: permadeath, gdd: design/gdd/permadeath.md, domain: Data, anchor: "Regla 3 / AC-P09/P11", requirement: "Exactly one beat is HOLDING at any instant; other entries stay QUEUED with their frozen immutable payload while waiting.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-permadeath-013, system: permadeath, gdd: design/gdd/permadeath.md, domain: Ownership, anchor: "States (header note)", requirement: "The per-entry queue state (QUEUED->HOLDING->RESOLVED) is distinct from the hero state (DYING/DEAD, owned by Heroes) — two separate state machines with distinct owners.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-permadeath-014, system: permadeath, gdd: design/gdd/permadeath.md, domain: Timing, anchor: "Regla 8 / AC-P21/P21b/P21c", requirement: "Floor compression of an N-death chain is piso_efectivo=clamp(death_hold_total_lockout_cap_s/N, death_hold_min_compressed_s, death_hold_min_duration_s), uniform for all beats of the chain, with N FROZEN at chain-formation frame and never recomputed.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-permadeath-015, system: permadeath, gdd: design/gdd/permadeath.md, domain: Data, anchor: "Regla 8 (algorithm)", requirement: "The implementation must assert N>=1 before dividing, to fail loudly on an invocation bug rather than divide by zero.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-permadeath-016, system: permadeath, gdd: design/gdd/permadeath.md, domain: Data, anchor: "Regla 8 / Edge Cases / AC-P21c", requirement: "A death arriving after the first beat entered HOLDING is treated as a NEW chain with its own cap budget — never folded into the in-progress chain by raising its N.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-permadeath-017, system: permadeath, gdd: design/gdd/permadeath.md, domain: Communication, anchor: "Regla 8 / AC-P08c / Dependencies", requirement: "Permadeath reads N_max via EraDefinition.get_hero_roster_count() on the era-LOADED signal, never in its own _ready() (avoids the race against the LOADING->LOADED machine); it is its only cross-system read.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-permadeath-018, system: permadeath, gdd: design/gdd/permadeath.md, domain: Timing, anchor: "Regla 8 / AC-P08c", requirement: "Cap feasibility validation re-runs per era (each time an era reaches LOADED), not once at global startup, because the roster varies by civilization/era.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-permadeath-019, system: permadeath, gdd: design/gdd/permadeath.md, domain: Data, anchor: "Formula P1 constraint / AC-P08/P08b", requirement: "All config validation fails loudly at load, never clamped/substituted silently: death_hold_timeout_s>=death_hold_min_duration_s+death_hold_min_animation_window_s; cap>=death_hold_min_duration_s; cap>=N_max*death_hold_min_compressed_s; death_hold_min_compressed_s<=death_hold_min_duration_s.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-permadeath-020, system: permadeath, gdd: design/gdd/permadeath.md, domain: Data, anchor: "AC-P08b", requirement: "The cap-feasibility validation function must accept N_max as an injected parameter, decoupled from the actual Datos de Era read, to be unit-testable without a loaded era.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-permadeath-021, system: permadeath, gdd: design/gdd/permadeath.md, domain: Data, anchor: "Edge Cases / AC-P03", requirement: "A payload with any missing or null field (hero_id, hero_name, relic_category, D/T/P) fails loudly on receipt in a dev build; never substitutes a silent default.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-permadeath-022, system: permadeath, gdd: design/gdd/permadeath.md, domain: Persistence, anchor: "Regla 6 / cross-GDD #2", requirement: "The autosave persisted at DYING (fired by Heroes AC-H26, not Permadeath) must include the full death payload incl. relic_quality, marked 'death pending sealing' — not just state=DYING.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-permadeath-023, system: permadeath, gdd: design/gdd/permadeath.md, domain: Persistence, anchor: "Regla 8b / AC-P18-ext", requirement: "On reload, the load flow (Heroes+Guardado, not Permadeath) coerces DYING->DEAD and forges the relic from the persisted relic_quality, without resuming or replaying the visual beat.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-permadeath-024, system: permadeath, gdd: design/gdd/permadeath.md, domain: Persistence, anchor: "Regla 8b / AC-P18", requirement: "Permadeath persists no runtime queue state; on init after a crash its queue starts empty, with no restored HOLDING/QUEUED states and no resume call.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-permadeath-025, system: permadeath, gdd: design/gdd/permadeath.md, domain: Engine, anchor: "OQ-P5 sub-question / Gap 2026-08-15", requirement: "An explicit Permadeath.reset_queue() (or equivalent) must exist, invoked by every load sequence that returns control to the player — not only by Transicion de Era — because Godot 4.6 provides no clean 'scene changed' hook an Autoload can passively listen to.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-permadeath-026, system: permadeath, gdd: design/gdd/permadeath.md, domain: Timing, anchor: "Gap 2026-08-15 / PU-2", requirement: "The invariant is 'the Permadeath queue is empty at every point where the game returns control to the player from a loaded state' — otherwise Input stays permanently suppressed with no real beat behind it.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-permadeath-027, system: permadeath, gdd: design/gdd/permadeath.md, domain: Communication, anchor: "Regla 5 / AC-P16", requirement: "The hand-off to Forja delivers hero_id, hero_name, relic_category, relic_quality exactly once per hero, synchronously with beat release, via the provisional symbol receive_relic(...).", created: 2026-08-21, revised: "", status: active }
  - { id: TR-permadeath-028, system: permadeath, gdd: design/gdd/permadeath.md, domain: Data, anchor: "AC-P17/P17b", requirement: "Exactly-once idempotency is implemented by removing the queue entry BEFORE invoking DEAD confirmation and hand-off; re-evaluating an already-resolved entry (_evaluate_release() with the same entry_id) is a no-op.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-permadeath-029, system: permadeath, gdd: design/gdd/permadeath.md, domain: Platform, anchor: "Regla 4 / PU-2 / AC-P07c", requirement: "Permadeath controls release of the Input DEATH_HOLD context; suppression includes the open-global-pause-menu action, so no real engine pause can start during a beat and no RESOLVED occurs with SceneTree.paused==true.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-permadeath-030, system: permadeath, gdd: design/gdd/permadeath.md, domain: Ownership, anchor: "Reglas 6-7 / AC-P19/P20", requirement: "Permadeath does not call Guardado (does not duplicate the autosave) and emits no era victory/defeat signal (that evaluation is owned by Encuentro con Kaiju).", created: 2026-08-21, revised: "", status: active }
  - { id: TR-permadeath-031, system: permadeath, gdd: design/gdd/permadeath.md, domain: Ownership, anchor: "PU-1 / PU-2", requirement: "Permadeath has no own HUD; during HOLDING it does not update or redraw the Heroes relic_quality readout (already frozen by AC-H32c/U-4) and exposes no skip/cancel control.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-permadeath-032, system: permadeath, gdd: design/gdd/permadeath.md, domain: Engine, anchor: "Regla 3 (QUEUED presentation) / AC-P22", requirement: "A QUEUED hero does not play its collapse animation (V-5); it holds the last living/frozen pose and its full V-5->V-6 beat starts only on entering HOLDING.", created: 2026-08-21, revised: "", status: active }

  # ─── FORJA DE LEGADO (Feature) — design/gdd/forja-de-legado.md ───────────────
  - { id: TR-forja-001, system: forja, gdd: design/gdd/forja-de-legado.md, domain: Communication, anchor: "Regla 1 / AC-FL02", requirement: "receive_relic(hero_id, hero_name, relic_category, relic_quality) is the ONLY creation entry point of Forja; it exposes no other method and listens to no signal that would accept a troop death as input.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-forja-002, system: forja, gdd: design/gdd/forja-de-legado.md, domain: Data, anchor: "Regla 3 / AC-FL08", requirement: "RelicRecord contains exactly these fields: relic_id, source_hero_id, source_hero_name, relic_category, relic_quality, tier, origin_era_id, forge_index, epitaph.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-forja-003, system: forja, gdd: design/gdd/forja-de-legado.md, domain: Data, anchor: "Regla 2 / AC-FL07", requirement: "Forja stores BOTH relic_quality (exact float, byte-identical to received, never recomputed) and tier (derived discrete band) in the same record.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-forja-004, system: forja, gdd: design/gdd/forja-de-legado.md, domain: Data, anchor: "Formula FL1 / AC-FL04/05/06", requirement: "FL1 maps relic_quality->tier with inclusive lower bounds: Delgada [0.10,0.35), Solida [0.35,0.70), Legendaria [0.70,1.00]; the cuts are owned by Heroes and Forja does not duplicate them as a knob.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-forja-005, system: forja, gdd: design/gdd/forja-de-legado.md, domain: Data, anchor: "Formula FL1 (epsilon boundary)", requirement: "FL1 must compare boundaries with a tolerance EPSILON_TIER=1e-6; a value within +-EPSILON_TIER of a cut classifies to the UPPER tier (because relic_quality is float-computed in H4, not authored).", created: 2026-08-21, revised: "", status: active }
  - { id: TR-forja-006, system: forja, gdd: design/gdd/forja-de-legado.md, domain: Data, anchor: "Regla 4 / OQ-FL5 / AC-FL12", requirement: "relic_id is of type String, unique across the WHOLE legacy (global to the save, not per-era), and stable across saves/loads; the concrete encoding from forge_index is implementation.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-forja-007, system: forja, gdd: design/gdd/forja-de-legado.md, domain: Data, anchor: "Regla 4 / AC-FL12", requirement: "relic_id is derived deterministically and uniquely from forge_index, NEVER from Godot get_instance_id() (instance IDs recycle and do not survive save/load) — enforced by a static CI grep.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-forja-008, system: forja, gdd: design/gdd/forja-de-legado.md, domain: Persistence, anchor: "Formula FL2 / AC-FL10/FL11", requirement: "forge_counter is a monotone counter PERSISTED in the save, starting at 0 in a new legacy, continuing from the persisted value after reload, and never resetting between eras nor reusing an index.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-forja-009, system: forja, gdd: design/gdd/forja-de-legado.md, domain: Persistence, anchor: "Edge Cases / OQ-FL4 point 3", requirement: "If int64 fidelity is required for forge_counter, serialization must use FileAccess.store_var/get_var — JSON decodes every number as float/double (53 bits) and does not guarantee 64 bits; the Guardado save format is not yet specified.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-forja-010, system: forja, gdd: design/gdd/forja-de-legado.md, domain: Ownership, anchor: "Source-of-truth note / Regla 6", requirement: "Forja is the SINGLE canonical source of truth of a relic's data; Guardado persists by reference (IDs + fields), Datos de Era references via legacy_props, and Pantheon/Reliquias only read — none duplicates or redefines the RelicRecord.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-forja-011, system: forja, gdd: design/gdd/forja-de-legado.md, domain: Timing, anchor: "Regla 6 / AC-FL15", requirement: "Strict order on the deposit path: the relic is added to the in-memory registry BEFORE the autosave is triggered, verifiable with ordered spies.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-forja-012, system: forja, gdd: design/gdd/forja-de-legado.md, domain: Timing, anchor: "OQ-FL4 point 1 (mandatory ADR scope)", requirement: "The registry mutation and the autosave trigger must occur in the SAME call frame, with no call_deferred() or CONNECT_DEFERRED on that path — otherwise the order becomes non-deterministic between frames.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-forja-013, system: forja, gdd: design/gdd/forja-de-legado.md, domain: Threading, anchor: "OQ-FL4 point 4 / Regla 6 / AC-FL16", requirement: "'The game does not continue until SAVE_EXISTS' must be implemented as an await on the Guardado completion signal (yields to the main loop, keeps the 'saving...' indicator rendering), NEVER as a synchronous thread block nor OS.delay_msec().", created: 2026-08-21, revised: "", status: active }
  - { id: TR-forja-014, system: forja, gdd: design/gdd/forja-de-legado.md, domain: Engine, anchor: "OQ-FL4 point 2", requirement: "Loud-fails validating trust-boundary-crossing data (incomplete payload, relic_quality out of range, unknown relic_category, incomplete epitaph_templates) cannot rely on assert() alone (compiled out in exported builds): they require assert() PAIRED with an if-guard + push_error() + a safe-failure path that stays active in release.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-forja-015, system: forja, gdd: design/gdd/forja-de-legado.md, domain: Data, anchor: "Regla 5 / AC-FL14", requirement: "A relic_quality outside [0.10,1.00] fails loudly — never clamped to produce an out-of-band tier or a 'zero' relic.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-forja-016, system: forja, gdd: design/gdd/forja-de-legado.md, domain: Data, anchor: "Edge Cases / AC-FL23", requirement: "A relic_category outside {offensive, defensive, rally} fails loudly; Forja never invents or substitutes a default category.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-forja-017, system: forja, gdd: design/gdd/forja-de-legado.md, domain: Data, anchor: "Regla 8 / AC-FL21", requirement: "Defensive deduplication uses the key (source_hero_id, origin_era_id); a second delivery is a no-op logged with a dev-build warning, never a silent duplicate with two relic_id.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-forja-018, system: forja, gdd: design/gdd/forja-de-legado.md, domain: Data, anchor: "Regla 8 / AC-FL26", requirement: "On era activation (LOADED), Forja (or the load validator) validates that the hero roster's hero_id are unique; a duplicate makes the era activation fail loudly, naming the colliding hero_id.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-forja-019, system: forja, gdd: design/gdd/forja-de-legado.md, domain: Communication, anchor: "Regla 6 / Edge Cases / AC-FL24", requirement: "Forja reads from Datos de Era which era_id is ACTIVE to tag origin_era_id; with no ACTIVE era it fails loudly, never assigning a default or null origin_era_id.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-forja-020, system: forja, gdd: design/gdd/forja-de-legado.md, domain: Data, anchor: "AC-FL24 / AC-FL26", requirement: "The ACTIVE-era read must be injectable (ActiveEraProvider seam stubbed, same pattern as Permadeath AC-P08b) to force the 'no era' case without a real era loaded.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-forja-021, system: forja, gdd: design/gdd/forja-de-legado.md, domain: Persistence, anchor: "OQ-FL4", requirement: "The RelicRecord is mutable persisted state (not immutable authored data like EraDefinition), so it probably lives serialized inside the Guardado save, not as an authored .tres — an architecture decision pending.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-forja-022, system: forja, gdd: design/gdd/forja-de-legado.md, domain: Data, anchor: "Tuning Knobs / AC-FL09", requirement: "epitaph derives from the epitaph_templates table (dict category x tier -> string, exactly 9 entries); a missing key or empty string fails loudly at table load, naming the missing key(s).", created: 2026-08-21, revised: "", status: active }
  - { id: TR-forja-023, system: forja, gdd: design/gdd/forja-de-legado.md, domain: Communication, anchor: "AC-FL19 / AC-FL20", requirement: "The relic registry must expose a full-list read hook (list_relics()->[RelicRecord], provisional) and a combat-inputs hook (get_relic_combat_inputs()->{relic_category, tier}, provisional) without requiring consumers to read relic_quality or internal fields.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-forja-024, system: forja, gdd: design/gdd/forja-de-legado.md, domain: Communication, anchor: "Regla 7 / AC-FL18", requirement: "Forja reaches PERSISTED with no consumer of Reliquias (#12) or Pantheon (#14) connected — structural decoupling, verifiable.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-forja-025, system: forja, gdd: design/gdd/forja-de-legado.md, domain: Data, anchor: "States / AC-FL17", requirement: "Per-relic state machine RECEIVED->FORGED->DEPOSITED->PERSISTED, with commit points marked for failure handling; a blocking autosave failure leaves the relic at DEPOSITED with no Forja-own retry.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-forja-026, system: forja, gdd: design/gdd/forja-de-legado.md, domain: Persistence, anchor: "Edge Cases / AC-FL25", requirement: "After a crash between RESOLVED and end of autosave, the load flow re-forges the relic from the persisted DYING payload; dedup guarantees exactly one relic per hero — never zero, never two.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-forja-027, system: forja, gdd: design/gdd/forja-de-legado.md, domain: Persistence, anchor: "Interactions (Transicion de Era) / AC-FL11", requirement: "The relic registry is part of the legacy that persists BETWEEN eras (Transicion de Era carries it across civilizations); forge_counter never resets at that crossing.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-forja-028, system: forja, gdd: design/gdd/forja-de-legado.md, domain: Ownership, anchor: "FU-1 / FU-2", requirement: "Forja exposes no screen, prompt, or readout during play; the epitaph is provenance data consumers render in their own context.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-forja-029, system: forja, gdd: design/gdd/forja-de-legado.md, domain: Engine, anchor: "FV-1 / FV-2", requirement: "Forja guarantees each RelicRecord references a resolvable icon determined by relic_category (base silhouette) + tier (gilded finish grade); it does not animate the reveal nor compose the scene.", created: 2026-08-21, revised: "", status: active }

  # ─── RELIQUIAS/BENDICIONES (Feature) — design/gdd/reliquias-bendiciones.md ───
  - { id: TR-reliquias-001, system: reliquias, gdd: design/gdd/reliquias-bendiciones.md, domain: Ownership, anchor: "Regla 1 / AC-RB01/RB02", requirement: "The pool is built by reading Forja's RelicRecord registry read-only (relic_id, relic_category, tier, source_hero_name, epitaph, forge_index); this system never forges, modifies, or deletes a relic.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-reliquias-002, system: reliquias, gdd: design/gdd/reliquias-bendiciones.md, domain: Ownership, anchor: "Source-of-truth note", requirement: "This system keeps only ephemeral invocation state (remaining charges, active effects, current offering, 'in draw pool' flag); it duplicates no legacy data.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-reliquias-003, system: reliquias, gdd: design/gdd/reliquias-bendiciones.md, domain: Data, anchor: "F-RB1 / AC-RB30", requirement: "effective_stat(u,s,t)=base_stat(u_type,s)+sum magnitude(m) over active modifiers; base_stat is read read-only from the type's CombatProfile/HeroDefinition, never mutated.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-reliquias-004, system: reliquias, gdd: design/gdd/reliquias-bendiciones.md, domain: Communication, anchor: "F-RB1 / OQ-RB1 / AC-RB32", requirement: "Combate must expose a new read-hook effective_attack_damage(instance)->int layering the instance modifier stack over the type CombatProfile at hit-resolution time; it does not exist in combate-dano.md today. (Landed by ADR-0001.)", created: 2026-08-21, revised: "2026-08-21", status: active }
  - { id: TR-reliquias-005, system: reliquias, gdd: design/gdd/reliquias-bendiciones.md, domain: Data, anchor: "Regla 8 / AC-RB27", requirement: "Every bonus is applied as a temporary instance modifier keyed by (relic_id, unit_instance_id) — bound to the concrete instance, never the type/definition. (Landed by ADR-0001.)", created: 2026-08-21, revised: "2026-08-21", status: active }
  - { id: TR-reliquias-006, system: reliquias, gdd: design/gdd/reliquias-bendiciones.md, domain: Ownership, anchor: "Regla 8 / AC-RB26", requirement: "Never writes CombatProfile/HeroDefinition/TroopDefinition persistent; all modification lives in the ephemeral modifier layer — enforced by static CI grep plus the surface AC. (Landed by ADR-0001.)", created: 2026-08-21, revised: "2026-08-21", status: active }
  - { id: TR-reliquias-007, system: reliquias, gdd: design/gdd/reliquias-bendiciones.md, domain: Data, anchor: "F-RB1 / AC-RB31/RB31b", requirement: "Stacking: additive across distinct relics; one active instance per relic_id per unit — re-picking an already-active relic REFRESHES its expiry_tick to a full new window without changing magnitude or creating a second instance. (Landed by ADR-0001.)", created: 2026-08-21, revised: "2026-08-21", status: active }
  - { id: TR-reliquias-008, system: reliquias, gdd: design/gdd/reliquias-bendiciones.md, domain: Data, anchor: "F-RB1 / AC-RB31b", requirement: "Max simultaneous bonus is computable and bounded: max_stat_bonus(s)=sum of up to D distinct highest-magnitude relics of the stat, D=min(invocation_charges, distinct relics of stat in pool, number fitting in effect_duration_s); not runtime-clamped.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-reliquias-009, system: reliquias, gdd: design/gdd/reliquias-bendiciones.md, domain: Data, anchor: "Regla 4 / AC-RB13", requirement: "No damage bonus is a percentage multiplier; all are flat additive +N applied as a temporary instance modifier (Combate Regla 5). (Landed by ADR-0001.)", created: 2026-08-21, revised: "2026-08-21", status: active }
  - { id: TR-reliquias-010, system: reliquias, gdd: design/gdd/reliquias-bendiciones.md, domain: Communication, anchor: "Regla 4/8 / AC-RB14", requirement: "Damaging effects use Combate's EXISTING single-target apply_damage path; an area hit is implemented as multiple single-target apply_damage calls over enemies in radius — never a new damage formula or a cleave hook.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-reliquias-011, system: reliquias, gdd: design/gdd/reliquias-bendiciones.md, domain: Data, anchor: "F-RB2 / AC-RB07..RB10 / Regla 3", requirement: "magnitude(base_value, tier)=round_half_up(base_value*tier_factor(tier)) with tier_factor(Delgada)=1.0, Solida=solid_factor, Legendaria=legendary_factor; tier scales only magnitude, never effect type.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-reliquias-012, system: reliquias, gdd: design/gdd/reliquias-bendiciones.md, domain: Data, anchor: "F-RB2 (loud-fail invariant) / AC-RB11", requirement: "Loud-fail invariant at load: magnitude strictly increasing across the 3 tiers for each base_value in use (catches rounding collapse, e.g. base_value=1, solid_factor=1.3).", created: 2026-08-21, revised: "", status: active }
  - { id: TR-reliquias-013, system: reliquias, gdd: design/gdd/reliquias-bendiciones.md, domain: Data, anchor: "Loud-fail invariants (load) / AC-RB42..RB45", requirement: "Loud-fail invariants at load (never silent clamp): draw_size>=1; invocation_charges>=1; duration_s>0; solid_factor>1.0; legendary_factor>solid_factor; base_value>=1; pool_cap>=1; 0<=max_legendary_per_draw<=draw_size.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-reliquias-014, system: reliquias, gdd: design/gdd/reliquias-bendiciones.md, domain: Data, anchor: "Regla 6 / F-RB3 / AC-RB18/RB23", requirement: "The draw uses an injectable/seed-controllable RNG (same discipline as Kaiju AC-K71); same seed + same pool -> bit-identical offer in relic_id and order.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-reliquias-015, system: reliquias, gdd: design/gdd/reliquias-bendiciones.md, domain: Data, anchor: "F-RB3 / AC-RB19", requirement: "The pool is an ordered list of relic_id by ascending forge_index (deterministic order) and the draw is fisher_yates_partial(pool, k_effective, rng_seeded) without replacement, k_effective=min(draw_size, P).", created: 2026-08-21, revised: "", status: active }
  - { id: TR-reliquias-016, system: reliquias, gdd: design/gdd/reliquias-bendiciones.md, domain: Data, anchor: "F-RB3 / AC-RB20", requirement: "P=0 invoked forcibly (bypassing the READY state gate) fails loudly — a signal of an upstream state-machine bug.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-reliquias-017, system: reliquias, gdd: design/gdd/reliquias-bendiciones.md, domain: Data, anchor: "F-RB3 Rule B / AC-RB22 / OQ-RB6", requirement: "No offer contains more than max_legendary_per_draw Legendaries; the exact algorithm (weighted sub-pool vs excess reroll) is implementation, and the AC requires zero violations over 1000 draws with fixed seeds [1..1000].", created: 2026-08-21, revised: "", status: active }
  - { id: TR-reliquias-018, system: reliquias, gdd: design/gdd/reliquias-bendiciones.md, domain: Data, anchor: "F-RB5 / AC-RB37/RB38", requirement: "active_pool_size=min(total_relics_forged, pool_cap); on exceeding the cap, the lowest-forge_index relic changes its ephemeral 'in draw pool' flag to false — the RelicRecord is never deleted or touched.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-reliquias-019, system: reliquias, gdd: design/gdd/reliquias-bendiciones.md, domain: Data, anchor: "Edge Cases (pool_cap crossing intra-era)", requirement: "If a relic is retired from the pool while being offered in an open OFFERING, the in-progress offer is honored to resolution; the retirement applies to the next draw.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-reliquias-020, system: reliquias, gdd: design/gdd/reliquias-bendiciones.md, domain: Timing, anchor: "F-RB4 / AC-RB33", requirement: "Expiry is computed by physics tick: duration_ticks=ceil(duration_s*physics_ticks_per_second), expiry_tick=applied_tick+duration_ticks, is_active(t)=applied_tick<=t<expiry_tick (half-open) — never _process(delta) or wall-clock. (Tick source now TimeControl.game_tick per ADR-0002; layer landed by ADR-0001.)", created: 2026-08-21, revised: "2026-08-21", status: active }
  - { id: TR-reliquias-021, system: reliquias, gdd: design/gdd/reliquias-bendiciones.md, domain: Timing, anchor: "F-RB4 / AC-RB34", requirement: "Expiry is checked at the start of each tick, BEFORE Combate's phase-1 damage; a modifier with expiry_tick==t no longer exists for any apply_damage of tick t. (Landed by ADR-0001.)", created: 2026-08-21, revised: "2026-08-21", status: active }
  - { id: TR-reliquias-022, system: reliquias, gdd: design/gdd/reliquias-bendiciones.md, domain: Data, anchor: "F-RB4 / AC-RB36", requirement: "On expiry of a defensive bonus, max_health drops -N and current_health=min(current_health, new_max_health) by direct clamp — never via apply_damage, never triggers DYING, expiry never kills a hero. (Landed by ADR-0001.)", created: 2026-08-21, revised: "2026-08-21", status: active }
  - { id: TR-reliquias-023, system: reliquias, gdd: design/gdd/reliquias-bendiciones.md, domain: Timing, anchor: "F-RB4 / AC-RB35", requirement: "Instant effects (rally) skip all tick bookkeeping (applied_tick/expiry_tick) and transition RESOLVING->SPENT directly without passing through ACTIVE.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-reliquias-024, system: reliquias, gdd: design/gdd/reliquias-bendiciones.md, domain: Timing, anchor: "Regla 7b / OQ-RB9", requirement: "During OFFERING, the full simulation (kaiju, telegraph, units) slows uniformly to offering_time_scale (MVP 0.2x) rather than stopping; this system REQUESTS the scale but does NOT own the sim clock. (Landed by ADR-0002: requests SLOWED.)", created: 2026-08-21, revised: "2026-08-21", status: active }
  - { id: TR-reliquias-025, system: reliquias, gdd: design/gdd/reliquias-bendiciones.md, domain: Timing, anchor: "OQ-RB9", requirement: "Who applies the Engine.time_scale-equivalent, how it interacts with F-RB4's fixed physics step (tick expiry must stay correct under time scale), and which systems are EXEMPT (e.g. the offering's own UI) must be fixed. (Landed by ADR-0002: TimeControl owns it.)", created: 2026-08-21, revised: "2026-08-21", status: active }
  - { id: TR-reliquias-026, system: reliquias, gdd: design/gdd/reliquias-bendiciones.md, domain: Timing, anchor: "OQ-RB9 (death-pause interaction)", requirement: "Time-regime precedence: Permadeath's total pause (game_time_paused) WINS over offering_time_scale; during the death pause the offer is PRESERVED (not cancelled, soft-timeout not running) and resumes its slow-mo on pause end — requires adding Reliquias to Permadeath Regla 4 game_time_paused consumers. (Ratified by ADR-0002.)", created: 2026-08-21, revised: "2026-08-21", status: active }
  - { id: TR-reliquias-027, system: reliquias, gdd: design/gdd/reliquias-bendiciones.md, domain: Timing, anchor: "Regla 7b / AC-RB15b", requirement: "Anti-stall brakes run in REAL time (not scaled): offering_soft_timeout_s (MVP 8.0s) auto-cancels the offer without spending a charge, and offering_cooldown_s (MVP 3.0s at normal speed) keeps can_invoke=false after any cancellation.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-reliquias-028, system: reliquias, gdd: design/gdd/reliquias-bendiciones.md, domain: Data, anchor: "Regla 7b / AC-RB15/RB15b", requirement: "Commit-on-choice: the charge decrements on the OFFERING->RESOLVING transition (on choosing), not on opening the offer; cancelling (manual or timeout) spends no charge.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-reliquias-029, system: reliquias, gdd: design/gdd/reliquias-bendiciones.md, domain: Data, anchor: "Regla 5 / AC-RB40", requirement: "The charge is spent on choosing even if the effect results in a no-op/whiff (e.g. rally with the band at its cap).", created: 2026-08-21, revised: "", status: active }
  - { id: TR-reliquias-030, system: reliquias, gdd: design/gdd/reliquias-bendiciones.md, domain: Data, anchor: "Regla 5 / AC-RB17", requirement: "invocation_charges (and possibly draw_size, pool_cap) are authorable per era via EraDefinition; on era activation, invocation_charges_remaining is set to the new era's value without carrying over leftovers.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-reliquias-031, system: reliquias, gdd: design/gdd/reliquias-bendiciones.md, domain: Communication, anchor: "Regla 7 / AC-RB24/RB25", requirement: "The invocation window is gated by reading the Temporizador phase (CLIMAX); this system consumes the phase, never owns or re-derives it.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-reliquias-032, system: reliquias, gdd: design/gdd/reliquias-bendiciones.md, domain: Data, anchor: "Regla 10 / OQ-RB5", requirement: "The pool is populated exclusively with relics from PREVIOUS eras; an intra-era death forges its relic (Permadeath->Forja) but does not make it draftable in the same combat. For the single-era MVP, the pool must be PRE-SEEDED from a test pantheon of a fictional 'era 0'.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-reliquias-033, system: reliquias, gdd: design/gdd/reliquias-bendiciones.md, domain: Data, anchor: "Regla 9 / AC-RB28/RB29", requirement: "With an empty pool the READY state is never reached and there is no separate 'system blocked by progress' flag — the onboarding gate is structural, not a lock.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-reliquias-034, system: reliquias, gdd: design/gdd/reliquias-bendiciones.md, domain: Persistence, anchor: "OQ-RB2 / AC-RB46 / Edge Cases", requirement: "Ephemeral invocation state (spent charges + active modifiers with their remaining expiry tick) must restore on a mid-era reload without refunding spent charges; provisional round-trip contract with Guardado (save_ephemeral_invocation_state / load_ephemeral_invocation_state).", created: 2026-08-21, revised: "", status: active }
  - { id: TR-reliquias-035, system: reliquias, gdd: design/gdd/reliquias-bendiciones.md, domain: Persistence, anchor: "OQ-RB2", requirement: "How a modifier's remaining time is recomputed across a reload must be defined (expiry_tick is relative to a session tick counter).", created: 2026-08-21, revised: "", status: active }
  - { id: TR-reliquias-036, system: reliquias, gdd: design/gdd/reliquias-bendiciones.md, domain: Platform, anchor: "Dependencies (Input) / RU-2", requirement: "Bidirectional interface with Input: this system requests the BLESSING_SELECT context; Input emits blessing_choice_confirmed(index) / blessing_selection_cancelled that this system consumes.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-reliquias-037, system: reliquias, gdd: design/gdd/reliquias-bendiciones.md, domain: Communication, anchor: "RU-1..RU-6 / AC-U30", requirement: "Data surface exposed to UI/HUD (read-only): invocation_charges_remaining + era cap (RU-1), can_invoke (RU-2), single event first_invocation_available (at most once per save, RU-2b), blessing_offer (RU-3), band_headroom per rally option (RU-3b), active_blessings list with expiry ticks (RU-4), rejection event (RU-6).", created: 2026-08-21, revised: "", status: active }
  - { id: TR-reliquias-038, system: reliquias, gdd: design/gdd/reliquias-bendiciones.md, domain: Data, anchor: "RU-3 / RV-2", requirement: "blessing_offer includes per option: relic_id, icon (from Forja, relic_category x tier), glanceable identity (source_hero_name + hero portrait/silhouette), relic_category, tier, and epitaph as a secondary channel.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-reliquias-039, system: reliquias, gdd: design/gdd/reliquias-bendiciones.md, domain: Data, anchor: "RU-2 / Regla 7b", requirement: "can_invoke is the conjunction: phase=CLIMAX AND charges>0 AND pool not empty AND not in post-cancellation cooldown.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-reliquias-040, system: reliquias, gdd: design/gdd/reliquias-bendiciones.md, domain: Data, anchor: "Edge Cases / AC-RB41", requirement: "An active modifier is discarded with the hero instance on entering DYING (does not survive its bearer or transfer) and does not alter Combate's D/T/P classification of the death.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-reliquias-041, system: reliquias, gdd: design/gdd/reliquias-bendiciones.md, domain: Platform, anchor: "RV-3", requirement: "Magnitude (tier) must read by enhancement intensity/duration, redundant with the icon — never by color alone (>=3 channels, consistent with UI/HUD HU-10).", created: 2026-08-21, revised: "", status: active }

  # ─── UI/HUD (Presentation) — design/gdd/ui-hud.md ───────────────────────────
  - { id: TR-ui-001, system: ui, gdd: design/gdd/ui-hud.md, domain: Ownership, anchor: "Core Rule 1 / AC-U01", requirement: "UI/HUD is purely read: it writes no state back to any consumed system, with the single exception of the Sacrifice visual feedback (provisional feedback-only contract, no command authority).", created: 2026-08-21, revised: "", status: active }
  - { id: TR-ui-002, system: ui, gdd: design/gdd/ui-hud.md, domain: Ownership, anchor: "Overview / Interactions", requirement: "UI/HUD owns no game data of its own — it only reads events and state exposed by Combate, Heroes, Control, Temporizador, Kaiju, Reliquias, Input and Datos de Era.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-ui-003, system: ui, gdd: design/gdd/ui-hud.md, domain: Engine, anchor: "Core Rule 11 / AC-U02", requirement: "World-anchored overlays are implemented as Control nodes inside a CanvasLayer, positioned per-frame via F2.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-ui-004, system: ui, gdd: design/gdd/ui-hud.md, domain: Engine, anchor: "Core Rule 11 / AC-U02/U28", requirement: "Each overlay Control must set mouse_filter=MOUSE_FILTER_IGNORE; otherwise it would silently consume unit-selection clicks meant for the units below.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-ui-005, system: ui, gdd: design/gdd/ui-hud.md, domain: Platform, anchor: "Core Rule 11 / HU-9 / AC-U28", requirement: "No HUD element accepts direct input except the virtual gamepad cursor, whose behavior (magnetic snap) belongs to Control and of which UI/HUD only draws the appearance.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-ui-006, system: ui, gdd: design/gdd/ui-hud.md, domain: Engine, anchor: "F2 (MANDATORY impl note) / AC-U26", requirement: "F2 (world_to_screen_transform) is the mathematical projection definition, NOT the implementation path: the implementation must read the native canvas transform via CanvasItem.get_global_transform_with_canvas() (or the viewport's get_canvas_transform()) and Camera2D.get_screen_center_position() — NOT the node's raw .position.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-ui-007, system: ui, gdd: design/gdd/ui-hud.md, domain: Engine, anchor: "F2 (impl note) / camera_pan_speed=30", requirement: "Rationale for TR-ui-006: with position_smoothing_enabled or drag margins active, the rendered center lags the node position and a manual formula would make overlays SLIDE off their entities during panning; the native transform also absorbs content_scale_mode and DPI/resize scaling.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-ui-008, system: ui, gdd: design/gdd/ui-hud.md, domain: Engine, anchor: "F2 (impl note)", requirement: "The world uses Camera2D (pure 2D); F2 carries no rotation term because the camera does not rotate in MVP — adding rotation would break the manual F2.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-ui-009, system: ui, gdd: design/gdd/ui-hud.md, domain: Data, anchor: "F2 Output Range / Core Rule 6b(a) / AC-U26", requirement: "F2 output is unbounded — it may fall outside [0, viewport_size_px]; elements that must stay visible off-screen (attention-director directional marker) apply their own clamp/reprojection to the edge.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-ui-010, system: ui, gdd: design/gdd/ui-hud.md, domain: Data, anchor: "F1 / AC-U10/U12/U12b", requirement: "hero_risk_state=(danger_time_s<T_instant) OR hysteresis(danger_time_s, T_show, T_hide, min_visible_s, debounce_on_s), with danger_time_s=min(time_to_death, hero_current_health/max(incoming_damage_rate_total, epsilon)).", created: 2026-08-21, revised: "", status: active }
  - { id: TR-ui-011, system: ui, gdd: design/gdd/ui-hud.md, domain: Data, anchor: "F1 / AC-U11", requirement: "The guard epsilon=0.001 prevents division by zero when incoming_damage_rate_total=0; the result is never NaN or an exception.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-ui-012, system: ui, gdd: design/gdd/ui-hud.md, domain: Timing, anchor: "Core Rule 6 / F1 / AC-U12b", requirement: "The instant-trigger path turns the readout on the same frame without waiting debounce_on_s, closing the 'burst death' window and covering discontinuous drops of time_to_death (ENRAGED recompute).", created: 2026-08-21, revised: "", status: active }
  - { id: TR-ui-013, system: ui, gdd: design/gdd/ui-hud.md, domain: Timing, anchor: "F1 / AC-U13/U13b", requirement: "Once ON by either path, min_visible_s applies before it can turn off; a pending off is cancelled if danger_time_s drops below T_hide again before min_visible_s elapses.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-ui-014, system: ui, gdd: design/gdd/ui-hud.md, domain: Data, anchor: "Tuning Knobs (joint tuning)", requirement: "F1 knobs are not independent: moving T_show requires recomputing and re-validating T_hide (range T_show+4 to T_show+15) and confirming T_instant<T_show.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-ui-015, system: ui, gdd: design/gdd/ui-hud.md, domain: Data, anchor: "States (HIDDEN->FROZEN) / Edge Cases / AC-U16", requirement: "The readout freezes on the D/T/P snapshot on entering DYING EVEN IF nothing renders (hero off-screen / not selected); if the player brings it into view before DEAD, the frozen state renders immediately without re-triggering the freeze.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-ui-016, system: ui, gdd: design/gdd/ui-hud.md, domain: Communication, anchor: "States and Transitions", requirement: "FROZEN->HIDDEN triggers when Permadeath confirms DEAD — UI/HUD consumes that event, does not derive it.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-ui-017, system: ui, gdd: design/gdd/ui-hud.md, domain: Engine, anchor: "Core Rule 6b / HU-11 / AC-U32", requirement: "The attention director fires three simultaneous redundant channels when a hero crosses to AT_RISK/DYING off-screen or unselected: (a) edge-clamped directional marker via F2, (b) audio sting + haptic pulse once on the transition, (c) camera nudge event; all three cease when the hero enters the viewport or DEAD is confirmed.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-ui-018, system: ui, gdd: design/gdd/ui-hud.md, domain: Data, anchor: "F3 / AC-U22", requirement: "telegraph_vignette_intensity=clamp(base(third)+amplitude*abs(sin(pi*freq(third)*elapsed_in_third_s)), 0.0, 1.0); the clamp() is mandatory, not cosmetic — without it the output exceeds 1.0 at the top of the safe amplitude range (0.75+0.35=1.10).", created: 2026-08-21, revised: "", status: active }
  - { id: TR-ui-019, system: ui, gdd: design/gdd/ui-hud.md, domain: Platform, anchor: "F3 / Core Rule 8 / AC-U19", requirement: "freq(third)=min(1.0+third, 3.0) Hz — a hard 3 flashes/sec photosensitivity cap, never exceeded.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-ui-020, system: ui, gdd: design/gdd/ui-hud.md, domain: Platform, anchor: "Core Rule 8 / Edge Cases / AC-U20/U23", requirement: "The reduced-flash toggle applies GLOBALLY to every flashing HUD element (F3 vignette AND the IMMINENT escalation), replacing the oscillating term with a monotone linear ramp; a per-element toggle would leave a photosensitivity gap.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-ui-021, system: ui, gdd: design/gdd/ui-hud.md, domain: Platform, anchor: "F3 Output Range / Example", requirement: "Both modes (flash and reduced-flash) share the same base() floor — that is what preserves accessibility parity.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-ui-022, system: ui, gdd: design/gdd/ui-hud.md, domain: Platform, anchor: "HU-10 / AC-U29", requirement: "Every escalation signal must be distinguishable with >=3 redundant channels (shape/frame + motion primary, color tertiary), verifiable under protanopia + deuteranopia + tritanopia simulation with 100% correct identification.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-ui-023, system: ui, gdd: design/gdd/ui-hud.md, domain: Data, anchor: "Interactions / Dependencies / F2", requirement: "UI/HUD consumes registered constants from Datos de Era (world_unit_scale=48, camera_pan_speed=30, zoom_min=0.5, zoom_max=1.5) along with the inverse screen_to_world_transform; it does not duplicate them.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-ui-024, system: ui, gdd: design/gdd/ui-hud.md, domain: Platform, anchor: "Dependencies (Input) / input Regla Nucleo 3", requirement: "UI/HUD consumes from Input: ui_* actions in menu/BLESSING_SELECT contexts, active_input_method (only for prompt icons, NOT focus-ring visibility), and input_lockout_active (HUD freeze during DEATH_HOLD).", created: 2026-08-21, revised: "", status: active }
  - { id: TR-ui-025, system: ui, gdd: design/gdd/ui-hud.md, domain: Platform, anchor: "Dependencies (Input)", requirement: "The controls remapping screen is owned by UI/HUD and reads/writes the InputMap Input exposes — the only UI/HUD write surface beyond the Sacrifice feedback.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-ui-026, system: ui, gdd: design/gdd/ui-hud.md, domain: Timing, anchor: "Edge Cases / AC-U31 / OQ-U5", requirement: "When game_time_paused==true, all data-driven HUD animations freeze in place — per-channel verification: (a) health-bar drain, (b) ritual-timer countdown, (c) F3 telegraph vignette pulse. (Flag source now TimeControl per ADR-0002.)", created: 2026-08-21, revised: "2026-08-21", status: active }
  - { id: TR-ui-027, system: ui, gdd: design/gdd/ui-hud.md, domain: Communication, anchor: "States (Timer ritual)", requirement: "UI/HUD consumes the entered_imminent / entered_climax signals from the Temporizador — it does not re-derive the phases.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-ui-028, system: ui, gdd: design/gdd/ui-hud.md, domain: Data, anchor: "F3 / Tuning Knobs", requirement: "UI/HUD consumes telegraph_progress [0.0,1.0] from Kaiju and derives third=floor(telegraph_progress*3) (clamped); telegraph_duration_s and guard_radius are consumed, not duplicated as own knobs.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-ui-029, system: ui, gdd: design/gdd/ui-hud.md, domain: Ownership, anchor: "Interactions (Kaiju) / Overview", requirement: "UI/HUD consumes a single discrete victory/defeat event from Kaiju; it does not own or render the result screen (only a brief acknowledgement before the hand-off).", created: 2026-08-21, revised: "", status: active }
  - { id: TR-ui-030, system: ui, gdd: design/gdd/ui-hud.md, domain: Communication, anchor: "Interactions / RU-1..RU-4 / AC-U30", requirement: "UI/HUD consumes from Reliquias (read-only, no mutation): invocation_charges_remaining, can_invoke, first_invocation_available, blessing_offer 3-choose-1 with glanceable identity + band_headroom, and active_blessings list with expiry ticks.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-ui-031, system: ui, gdd: design/gdd/ui-hud.md, domain: Timing, anchor: "Interactions (cognitive load) / OQ-U8", requirement: "The invocation draft runs during CLIMAX in slow-mo (offering_time_scale), not paused — it must be counted as an additional active stream in the CLIMAX HUD cognitive-load analysis.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-ui-032, system: ui, gdd: design/gdd/ui-hud.md, domain: Performance, anchor: "Edge Cases (N simultaneous) / OQ-U8 / AC-U33", requirement: "Stacking of N simultaneous AT_RISK readouts lacks a prioritization/aggregation rule and a soft cap; N independent overlays have draw-call cost against the <1000 budget — an unresolved numeric performance risk.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-ui-033, system: ui, gdd: design/gdd/ui-hud.md, domain: Data, anchor: "Core Rule 10 / HU-8 / AC-U27", requirement: "The 'no editorializing text' verification is a deterministic sweep of all text elements against a constant list of forbidden phrases (exact comparison, no tester judgment) — a BLOCKING gate.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-ui-034, system: ui, gdd: design/gdd/ui-hud.md, domain: Engine, anchor: "Edge Cases (F2 outside viewport)", requirement: "A world-anchored element that F2 projects outside the viewport simply is not drawn that frame; no off-screen indicator is specified except the Core Rule 6b attention director.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-ui-035, system: ui, gdd: design/gdd/ui-hud.md, domain: Timing, anchor: "Tuning Knobs / Core Rule 7", requirement: "The Sacrifice feedback pulse duration is a real knob (sacrifice_feedback_pulse_s=0.15s), not 'one frame' — the framerate-dependent version is explicitly rejected.", created: 2026-08-21, revised: "", status: active }
  - { id: TR-ui-036, system: ui, gdd: design/gdd/ui-hud.md, domain: Communication, anchor: "Core Rule 7 / AC-U17/U18 / OQ-U3", requirement: "The Sacrifice-order feedback requires an order_state in {IDLE, PENDING, CONFIRMED, REJECTED} state-machine contract from Combate/Control — currently only mocked, and the risk is one of SHAPE (if upstream lands an instant sacrifice with no confirmation, the mock is wrong, not just incomplete).", created: 2026-08-21, revised: "", status: active }
  - { id: TR-ui-037, system: ui, gdd: design/gdd/ui-hud.md, domain: Data, anchor: "AC-U04", requirement: "Health-bar color is deterministically verifiable: sample the fill at 0%/50%/100% against the Bone->Old Blood gradient stops with tolerance deltaE<=2 (CIE76).", created: 2026-08-21, revised: "", status: active }
  - { id: TR-ui-038, system: ui, gdd: design/gdd/ui-hud.md, domain: Platform, anchor: "Core Rule 4 / HU-2 / AC-U05", requirement: "Hero/troop distinction is by a shape notch in the outline, never by size or color alone, and must stay legible at the smallest sprite footprint (zoom_max=1.5 -> 32 px/unit).", created: 2026-08-21, revised: "", status: active }
  - { id: TR-ui-039, system: ui, gdd: design/gdd/ui-hud.md, domain: Data, anchor: "F2 Example / Edge Cases", requirement: "Zoom convention identical to Datos de Era: zoom<1 zooms in (at zoom_min=0.5 -> 96 px/unit, sprites doubled); zoom_max=1.5 zooms out (32 px/unit, max unit density).", created: 2026-08-21, revised: "", status: active }
  - { id: TR-ui-040, system: ui, gdd: design/gdd/ui-hud.md, domain: Ownership, anchor: "Overview / Core Rule 2 / AC-U02", requirement: "This GDD's scope is the active-session HUD overlay; menus (pause, settings, result, pantheon, era transition) are out of scope and there is no minimap in MVP.", created: 2026-08-21, revised: "", status: active }
