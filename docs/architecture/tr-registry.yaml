    revised: ""
    status: active
  - id: TR-building-ui-042
    system: building-ui
    gdd: design/gdd/building-ui.md
    requirement: "UI is a pure mirror of simulation state; UI-local presentation memory is exhaustively scoped (per-tool last material, toast/anchor presentation state), never serialized, never consumed by any other system."
