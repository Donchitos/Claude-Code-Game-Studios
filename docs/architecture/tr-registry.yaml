    revised: "2026-07-11"
    status: active
  - id: TR-building-ui-029
    system: building-ui
    gdd: design/gdd/building-ui.md
    requirement: "Hover suppression must not swallow the pointer-release event of an in-progress world-space drag."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-ui-037
    system: building-ui
    gdd: design/gdd/building-ui.md
    requirement: "All numeric UI-behavior values must be externally data-driven config, not hardcoded."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-ui-038
    system: building-ui
    gdd: design/gdd/building-ui.md
    requirement: "Mirror/event logic must be exercisable headless via mocked upstream signals and mocked queryable state (BLOCKING automated-test tier)."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-ui-040
    system: building-ui
    gdd: design/gdd/building-ui.md
    requirement: "Timer architecture RESOLVED via ADR-0011: a single centralized expiry-timestamp manager (Dictionary[key, TimerRecord] + one shared _process loop), not N per-issue Godot Timer nodes."
    created: 2026-07-11
    revised: "2026-07-11"
    status: active
  - id: TR-building-ui-005
    system: building-ui
    gdd: design/gdd/building-ui.md
    requirement: "The HUD runs on raw (unscaled) delta — fully responsive during pause; every UI reaction lands the same frame as its input."
    created: 2026-07-11
    revised: ""
    status: active
  - id: TR-building-ui-041
    system: building-ui
    gdd: design/gdd/building-ui.md
    requirement: "The HUD has exactly three zones in MVP (bottom toolbar, top-right time controls, notification area below them); no permanent panels beyond these."
