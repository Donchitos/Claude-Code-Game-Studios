    revised: ""
    status: active
  - id: TR-building-ui-062
    system: building-ui
    gdd: design/gdd/building-ui.md
    requirement: "The anchor's expanded list is built live from Build Validation's queryable state — never a UI-cached copy; the anchor stores nothing but its expanded/collapsed flag."
