# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: combat_stat_modifiers
    status: active
    pattern: direct_call     # sources call Combate's API directly; Combate reads effective_* internally
    producer: combate-dano   # owns CombatState, the modifier list, application, and expiry
    consumers:
      - reliquias-bendiciones   # writes flat additive modifiers; never reads/writes CombatProfile
    adr: docs/architecture/adr-0001-combat-stat-modifier-layer.md
    signal_signature: "add_modifier(mod: StatModifier) / remove_by_source(source_relic_id: String) / sweep_expired(current_tick: int); read: effective_attack_damage() -> int. StatModifier = {stat, magnitude:int>=1, expiry_tick:int, source_relic_id:String} (RefCounted). Dedup: one active modifier per (source_relic_id, stat) per unit — refresh-on-repick."
    referenced_by:
      - docs/architecture/adr-0001-combat-stat-modifier-layer.md
    added: 2026-08-18
    revised: ""

  - contract: time_regime
    status: active
    pattern: shared_service   # readers poll TimeControl; regime sources use a request/release API
    producer: time-control    # owns the game-time regime and the game_tick counter
    consumers:
      - permadeath            # request_regime(PAUSED) on DEATH_HOLD; beat clock is exempt (real-time)
      - reliquias-bendiciones # request_regime(SLOWED) with offering_time_scale while OFFERING open
      - combate-dano          # reads game_time_paused (AC-C52); reads game_tick for blessing expiry sweep
      - encuentro-con-kaiju   # reads game_time_paused (Regla 11 / AC-K89)
      - input                 # reads game_time_paused to suppress input
      - temporizador-de-preparacion-ritual   # reads game_tick/time_scale (closes OQ-P4/F2-W4)
    adr: docs/architecture/adr-0002-time-control-service.md
    signal_signature: "request_regime(source_id: StringName, regime: TimeControl.Regime) / release_regime(source_id: StringName); reads: time_scale: float, game_time_paused: bool, game_tick: int. Precedence PAUSED>SLOWED>NORMAL; a superseded request is preserved, not dropped."
    referenced_by:
      - docs/architecture/adr-0002-time-control-service.md
    added: 2026-08-18
    revised: ""

  - contract: persistence_contract
    status: active
    pattern: direct_call     # SaveService calls each system's serialize_state()/deserialize_state() via injected references (composition root), never node/autoload lookup by name
    producer: save-persistence   # owns the file, envelope, checksum, migration chain
    consumers:
      - forja-de-legado         # forge_counter (int64) + relic_records
      - reliquias-bendiciones   # invocation_charges_remaining + active_modifiers as remaining_ticks (NOT absolute expiry_tick); replaces the AC-RB46 mock on ADR acceptance
      - temporizador-de-preparacion-ritual   # elapsed_s / current_phase
      - datos-de-era-civilizacion   # active era_id (reference only, never copies EraDefinition)
      - sistema-de-heroes       # pending-death payload with sealed:bool for crash recovery (AC-H27c)
      - transicion-de-era       # era_id ACTIVE/ARCHIVED
    adr: docs/architecture/adr-0003-save-persistence-serialization.md
    signal_signature: "serialize_state() -> Dictionary (plain Variants only — no RefCounted/Resource/Object) / deserialize_state(data: Dictionary) -> void; SaveService.register_persistable(system_key: StringName, node: Node); request_save() -> bool; request_load() -> LoadResult{NO_SAVE_EXISTS,SAVE_EXISTS,CORRUPTED,VERSION_TOO_NEW}. Migrations run on raw Dictionary (pre-typed) before deserialize_state; schema_version>CURRENT -> VERSION_TOO_NEW (loud-fail, no migration)."
    referenced_by:
      - docs/architecture/adr-0003-save-persistence-serialization.md
    added: 2026-08-21
    revised: ""

  - contract: era_lifecycle
    status: active
    pattern: shared_service   # EraManager Autoload injected by reference; consumers read on the era_loaded signal or via get_active_era()
    producer: era-lifecycle   # owns the state machine, the sync load, and the centralized validation gate
    consumers:
      - sistema-de-tropas      # reads unit_roster + max_band_size on era_loaded
      - sistema-de-heroes      # reads hero roster on era_loaded
      - encuentro-con-kaiju    # reads kaiju_definition on era_loaded
      - temporizador-de-preparacion-ritual   # reads approach_duration_s/imminent_window_s on era_loaded
      - permadeath             # reads get_hero_roster_count() on era_loaded (not _ready()) — TR-permadeath-017
      - reliquias-bendiciones  # reads invocation_charges per era on era_loaded
      - forja-de-legado        # origin_era_id = era_id of the ACTIVE era (get_active_era())
      - save-persistence       # boot: supplies era_id via request_load(); applies per-era state on era_loaded
    adr: docs/architecture/adr-0004-era-lifecycle-init-ordering.md
    signal_signature: "load_era(era_id: StringName) / activate_era() / archive_active_era() / get_active_era() -> EraDefinition; signals era_loaded(era: EraDefinition), era_activated(era), era_archived(era), era_load_failed(era_id: StringName, reasons: PackedStringArray). Sync ResourceLoader.load(); null return -> FAILED('era_resource_not_found'). Centralized validation gate runs before era_loaded; any violation -> FAILED, era_loaded NOT emitted, never ACTIVE. Boot: composition root must be ancestor of all era_loaded consumers and call load_era() from its own _ready() (avoids missed-signal race under sync load)."
    referenced_by:
      - docs/architecture/adr-0004-era-lifecycle-init-ordering.md
    added: 2026-08-21
    revised: ""

