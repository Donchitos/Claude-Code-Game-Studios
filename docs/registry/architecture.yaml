# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: runtime_mutation_of_shared_combatprofile
    status: active
    description: "No system may mutate a CombatProfile Resource at runtime. It is
      per-type shared content, read-only. Per-instance stat changes go through
      CombatState modifiers instead. Keep CombatProfile.resource_local_to_scene = false."
    why: "CombatProfile is shared across every instance of a unit type; mutating it
      changes all instances and corrupts the source-of-truth balance data. Silent and
      hard to trace."
    adr: docs/architecture/adr-0001-combat-stat-modifier-layer.md
    added: 2026-08-18

  - pattern: effective_combat_stat_computed_outside_combate
    status: active
    description: "Only Combate/Daño computes a unit's effective combat stat and owns
      the modifier lifecycle (apply + expiry). Other systems (e.g. Reliquias) supply
      modifiers via add_modifier/remove_by_source but must not compute effective damage
      themselves or hold the authoritative modifier stack."
    why: "Combate Regla 1 = single damage path. Computing effective stats elsewhere
      forks the damage math, and having a higher layer own the stack inverts the
      Reliquias->Combate dependency into a cycle."
    adr: docs/architecture/adr-0001-combat-stat-modifier-layer.md
    added: 2026-08-18

  - pattern: engine_native_pause_or_timescale_for_game_time
    status: active
    description: "Do not use SceneTree.paused or Engine.time_scale to implement the
      game-time regime (pause / offering slow-mo). Sources request a regime from
      TimeControl (request_regime/release_regime); consumers poll TimeControl.time_scale /
      game_time_paused / game_tick."
    why: "SceneTree.paused halts ALL process callbacks, making it impossible to
      selectively exempt the death-beat clock and UI without per-node process_mode
      gymnastics; Engine.time_scale scales physics globally (incl. systems that must run
      real-time) and Engine.get_physics_frames() is not pause-aware. The cooperative
      flag+scale model was chosen deliberately to allow selective exemption."
    adr: docs/architecture/adr-0002-time-control-service.md
    added: 2026-08-18

  - pattern: wallclock_delta_for_game_time_simulation
    status: active
    description: "Game-time simulation logic must not advance on _process(delta) / wall-clock.
      Read TimeControl (time_scale, game_tick, game_time_paused) instead. Exempt systems
      (death-beat clock, UI/HUD) run real-time by design and explicitly do not read game_time."
    why: "A system on wall-clock delta desyncs from pause and slow-mo — it keeps moving while
      the world is paused/slowed. Enforced by CI grep for _process(delta) in game-time sim scripts."
    adr: docs/architecture/adr-0002-time-control-service.md
    added: 2026-08-18

  - pattern: json_for_int64_persistence
    status: active
    description: "Do not serialize save data (or any int64 field) via JSON.stringify/parse.
      Use FileAccess.store_var/get_var. JSON represents numbers as 53-bit doubles and
      silently truncates 64-bit ints (e.g. forge_counter)."
    why: "forge_counter (Forja OQ-FL4) guarantees relic_id uniqueness across a long legacy;
      a silent truncation past 2^53 corrupts that uniqueness with no error. store_var
      preserves GDScript's 64-bit int uniformly, with no per-field encoding rule to forget."
    adr: docs/architecture/adr-0003-save-persistence-serialization.md
    added: 2026-08-21

  - pattern: persisting_absolute_game_tick
    status: active
    description: "No system's serialize_state() may persist TimeControl.game_tick or an
      absolute StatModifier.expiry_tick. Persist remaining_ticks (relative: expiry_tick −
      game_tick, computed at save time); on load, rebase as expiry_tick = game_tick (fresh 0)
      + remaining_ticks."
    why: "game_tick is a per-session counter by design (ADR-0002) — it freezes on pause,
      scales with time_scale, and resets to 0 each session. An absolute tick persisted from a
      prior session is meaningless against a reset counter. Enforced by CI grep for game_tick/
      expiry_tick outside time_control.gd and the dedicated save-rebasing code."
    adr: docs/architecture/adr-0003-save-persistence-serialization.md
    added: 2026-08-21

  - pattern: deserializing_objects_from_save
    status: active
    description: "serialize_state() must return only plain Dictionary/Array/primitive Variants —
      never RefCounted/Resource/Object instances (e.g. a live StatModifier). store_var/get_var
      keep full_objects/allow_objects at their default false. Systems convert state to plain
      dicts before handing it to SaveService."
    why: "Deserializing Objects from a file is an attack surface — a crafted save could
      instantiate arbitrary objects, not just a style preference. Enforced by CI grep for
      store_var(..., true) / get_var(..., true) in save code."
    adr: docs/architecture/adr-0003-save-persistence-serialization.md
    added: 2026-08-21

  - pattern: reading_eradefinition_in_ready
    status: active
    description: "No system may read EraDefinition fields (unit_roster, max_band_size,
      kaiju_definition, get_hero_roster_count, invocation_charges, approach_duration_s, etc.)
      in its _ready()/Autoload init ASSUMING an era is already loaded at boot. Boot consumers
      read in the era_loaded(era) handler. Legit exception: a node instantiated post-boot may
      read via EraManager.get_active_era() in its _ready() once an era is ACTIVE."
    why: "Autoload _ready() runs at engine boot, before any era is LOADED — a read there returns
      null/garbage. Generalizes Permadeath's era-LOADED contract to all consumers. Enforced by
      CI grep for EraDefinition field reads in _ready() (carving out get_active_era())."
    adr: docs/architecture/adr-0004-era-lifecycle-init-ordering.md
    added: 2026-08-21

  - pattern: era_lifecycle_driven_outside_eramanager
    status: active
    description: "Only EraManager drives the era state machine and loads EraDefinition resources.
      No system loads an EraDefinition directly, transitions era state, or emits era lifecycle
      signals. Consumers read via era_loaded / get_active_era() and never instantiate/mutate eras."
    why: "A single owner guarantees exactly-one-ACTIVE, the centralized validation gate (a broken
      era never partially activates), and a canonical era_loaded emitter. Distributed loading is
      the broken pre-ADR state (N loads, scattered loud-fail, no ownership of transitions)."
    adr: docs/architecture/adr-0004-era-lifecycle-init-ordering.md
    added: 2026-08-21

