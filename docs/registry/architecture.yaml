# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: rendering_cost_measurement_for_flame_canvas_screens
    status: active
    api: "Manual, design-time component tally (Flame side) + Flutter DevTools frame
      build/raster time (Flutter side) — two separate metrics, checked independently"
    not: "A single unified draw-call count spanning both Flame canvas and Flutter
      widget compositing — Flame 1.37 has no runtime draw-call counter to produce
      such a number, and Flutter's retained-mode layer tree doesn't expose one either"
    adr: docs/architecture/adr-0001-draw-call-budget-scope.md
    reason: "Flame components paint via ordinary Canvas calls, same as Flutter
      widgets — there is no built-in instrumentation to count them at runtime.
      The only checkable metric at GDD-authoring time is a manual tally of
      renderable components in the tree, per screen. Flutter-side cost is
      measured via DevTools instead, since that's what's actually available."
    referenced_by:
      - docs/architecture/adr-0001-draw-call-budget-scope.md
    added: 2026-07-07
    revised: ""

  - purpose: child_pin_verification
    status: active
    api: "Client-side PBKDF2-HMAC-SHA256 (pointycastle ^3.9.0), 100k iterations,
      16-byte per-child salt, keyLength 32, run off the main isolate (Isolate.run/
      compute). Verification reads pinHash+pinSalt to the device and compares locally
      — offline-capable, no server round-trip."
    not: "Server-side PIN verification via Cloud Function (breaks offline-first for
      zero security gain — Firestore rules already grant any shared-device session
      full child-data access); and bare SHA-256 (rainbow-table / cross-child compare)."
    adr: docs/architecture/adr-0002-auth-pin-security-architecture.md
    reason: "Offline-first daily-ritual pillar + COPPA no-child-identity constraint.
      PBKDF2+salt is retained for correct reasons (beats SHA-256, blocks rainbow/
      cross-child) but the real anti-guessing defense is the online lockout, not the
      KDF — a 4-digit PIN's 10,000 keyspace is not protected by iteration count."
    referenced_by:
      - docs/architecture/adr-0002-auth-pin-security-architecture.md
      - design/gdd/auth-account.md
    added: 2026-07-07
    revised: ""

  - purpose: firestore_offline_persistence
    status: active
    api: "Settings(cacheSettings: PersistentCacheSettings(sizeBytes: Settings.CACHE_SIZE_UNLIMITED)),
      set once in main() before any Firestore call. 50MB fallback = PersistentCacheSettings(sizeBytes: 50*1024*1024)."
    not: "Settings(persistenceEnabled: true, cacheSizeBytes: ...) — @Deprecated in cloud_firestore ^5.x
      (confirmed by flame-specialist 2026-07-07). Do not pass both cacheSizeBytes and cacheSettings."
    adr: docs/architecture/adr-0003-firestore-schema-persistence-strategy.md
    reason: "Offline-first is Pillar 1 (no effort lost). The ^5.x unified cache-settings API
      replaced the older persistenceEnabled/cacheSizeBytes pair across all Firestore SDKs."
    referenced_by:
      - docs/architecture/adr-0003-firestore-schema-persistence-strategy.md
      - design/gdd/data-persistence-layer.md
      - docs/engine-reference/flutter-flame/current-best-practices.md
    added: 2026-07-07
    revised: ""

  - purpose: atomic_write_mechanism
    status: active
    api: "runTransaction for read-dependent writes (approve/reject task — idempotency read
      first, level-up calc; buy-item/buy-Paid-Chest — idempotency read first, ADR-0011);
      WriteBatch for independent multi-field atomic writes with no idempotency read needed.
      FieldValue.increment() for all balance/counter mutation."
    not: "WriteBatch for read-dependent writes (can't read-before-write safely);
      absolute set() on counters (see forbidden_patterns absolute_set_on_balance_or_counters)."
    adr: docs/architecture/adr-0003-firestore-schema-persistence-strategy.md
    reason: "Read-before-write invariants (idempotency, level-up) require a transaction;
      independent field writes only need atomicity (batch); increment() is server-side
      atomic and avoids last-write-wins races on multi-device offline sync."
    referenced_by:
      - docs/architecture/adr-0003-firestore-schema-persistence-strategy.md
      - docs/architecture/adr-0011-shop-purchase-pipeline-idempotency-fix.md
      - docs/architecture/adr-0013-parent-approval-transaction-architecture.md
      - design/gdd/data-persistence-layer.md
    added: 2026-07-07
    revised: "2026-07-11"
    # revision note: buy-item moved OUT of the WriteBatch example and into the runTransaction
    # example (ADR-0011) — the original entry listed "WriteBatch for independent multi-field
    # atomic writes (buy-item)"; buy-item needed a read-before-write idempotency check
    # (TR-shop-003/QQ-01) that WriteBatch cannot provide, so it now uses runTransaction like
    # approve/reject. Paid Chest purchase (no natural document key) also moved to
    # runTransaction, gated on a client-generated idempotency token instead of a natural key.

  - purpose: shop_purchase_idempotency_mechanism
    status: active
    api: "Regular item purchase: runTransaction reading inventory/{itemId} first — if it
      exists, no-op (PurchaseResult.alreadyOwned), no re-decrement. The item ID is the
      natural idempotency key, correct under any retry count/device count with zero new
      state. Paid Chest purchase (no natural per-purchase document): runTransaction reading
      a client-generated purchaseId (UUID v4) against purchaseLog/{purchaseId} first — same
      no-op-if-exists pattern, using a token instead of a natural key. Both re-check
      xuBalance server-side inside the same transaction before applying the decrement."
    not: "WriteBatch for either purchase path (no read-before-write, cannot self-detect a
      duplicate commit — this was the TR-shop-003/QQ-01 gap). A single uniform
      idempotency-token mechanism for BOTH items and Paid Chest (items already have a free,
      unconditionally-correct natural key and don't need the extra purchaseLog machinery)."
    adr: docs/architecture/adr-0011-shop-purchase-pipeline-idempotency-fix.md
    reason: "No-Refund Rule (shop-system.md) means a duplicate charge cannot be corrected
      after the fact — it must be prevented at write time. Firestore transactions'
      optimistic-concurrency + auto-retry-on-contention make a read-before-write existence
      check race-safe even for genuinely simultaneous commits, not just sequential retries."
    referenced_by:
      - docs/architecture/adr-0011-shop-purchase-pipeline-idempotency-fix.md
      - design/gdd/shop-system.md
    added: 2026-07-11
    revised: ""

  - purpose: item_catalog_access
    status: active
    api: "One-time get() (.collection(items).orderBy(sortOrder).get(), default Source.serverAndCache)
      cached in a NON-autoDispose FutureProvider<List<ItemModel>>. Session-lifetime cache; lookupById O(1)."
    not: "snapshots() realtime listener (wasteful for static data); .autoDispose FutureProvider
      (would re-fetch on remount, breaking one-read-per-session); routing through the family-tree
      mutation repository."
    adr: docs/architecture/adr-0006-item-catalog-data-access-pattern.md
    reason: "Catalog is global, read-only, static within a session. SCOPED CARVE-OUT from
      systems_building_own_firestore_paths (ADR-0003): that rule governs family-tree MUTATIONS
      through the atomic repository; the items/ path constant stays centralized but this
      read-only global catalog reads via its own provider, not the mutation repository."
    referenced_by:
      - docs/architecture/adr-0006-item-catalog-data-access-pattern.md
      - docs/architecture/adr-0003-firestore-schema-persistence-strategy.md
      - design/gdd/item-database.md
    added: 2026-07-07
    revised: ""

  - purpose: realtime_read_stream_path_access
    status: active
    api: "Realtime read StreamProviders (xuBalanceProvider, and future child-doc/inventory/task
      streams) build .doc(...)/.collection(...).snapshots() from centralized FirestorePaths
      constants. Use .doc() for a single document (returns DocumentSnapshot with .data()),
      NOT .collection() (returns QuerySnapshot, no .data())."
    not: "Inline path strings; routing realtime reads through the mutation repository."
    adr: docs/architecture/adr-0008-currency-balance-mutation-rules.md
    reason: "Generalizes the item-catalog carve-out: ADR-0003's systems_building_own_firestore_paths
      governs atomic WRITES through the repository; realtime reads are the read layer. They honor
      the no-inline-strings intent via path constants but are not repository mutations."
    referenced_by:
      - docs/architecture/adr-0008-currency-balance-mutation-rules.md
      - docs/architecture/adr-0003-firestore-schema-persistence-strategy.md
      - docs/architecture/adr-0006-item-catalog-data-access-pattern.md
      - design/gdd/currency-system.md
    added: 2026-07-07
    revised: ""

  - purpose: reward_integrity_enforcement
    status: active
    api: "Synchronous Firestore Security Rule on tasks create — reject unless xuReward/energyReward ==
      rewardTable[categoryId] (quoted-CEL-key map literal), reward/categoryId immutable on update.
      PLUS onTaskApproved Cloud Function reconciliation (defense-in-depth). Reward table mirrored in
      app + rules + registry."
    not: "Cloud-Function-only validation (async — a parent can approve, granting the client-written
      reward via the offline transaction, before the function runs). Trusting client reward without a gate."
    adr: docs/architecture/adr-0009-task-lifecycle-reward-integrity.md
    reason: "Approve is a client-side offline runTransaction that reads task.xuReward and grants it, so
      the stored reward must be made trustworthy AT WRITE TIME (synchronous rule) — a post-write CF is
      too late. The rule is the gate; the CF is the backstop."
    referenced_by:
      - docs/architecture/adr-0009-task-lifecycle-reward-integrity.md
      - docs/architecture/adr-0003-firestore-schema-persistence-strategy.md
      - design/gdd/task-library.md
    added: 2026-07-08
    revised: ""

  - purpose: push_notification_delivery
    status: active
    api: "Server-side 2nd-gen onDocumentCreated Cloud Function (firebase-functions/v2/firestore) on the
      tasks path + Admin SDK messaging().send(). MVP ships with retry DISABLED."
    not: "Client-side FCM send (server-key exposure); polling; 1st-gen onWrite+manual-condition;
      enabling retry:true without an event.time staleness guard (2nd-gen retry is TIME-window-bounded,
      not attempt-count-bounded — no 'max 3' knob exists)."
    adr: docs/architecture/adr-0010-push-notification-delivery-architecture.md
    reason: "Sends must be server-trusted and work when the submitting device is the child's / offline.
      onDocumentCreated is create-only by definition (no manual before==null guard). Retry off for MVP
      because unbounded-window retry could produce many duplicate pushes on a systematic failure."
    referenced_by:
      - docs/architecture/adr-0010-push-notification-delivery-architecture.md
      - design/gdd/push-notification.md
    added: 2026-07-08
    revised: ""

  - purpose: seedcount_drift_correction
    status: active
    api: "runTransaction, executed ONLY server-side inside the existing onTaskApproved
      Cloud Function (ADR-0003 §6 — onDocumentUpdated trigger on the child document;
      never client-triggered): read actual pending-task count (tasks where status ==
      'pending') and current seedCount in the same transaction; if they differ, write
      the corrected value within that transaction."
    not: "Client-triggered absolute set() on seedCount in any form; a non-transactional
      read-then-set (races under concurrent CF invocations)."
    adr: docs/architecture/adr-0012-seed-buffer-derivation-strategy.md
    reason: "Scoped exception to absolute_set_on_balance_or_counters (ADR-0003) — that
      rule's rationale is multi-device CLIENT races (last-write-wins clobbering offline
      sync), which do not apply to a server-only, transactional, idempotent correction.
      Same shape as the item_catalog_access carve-out from systems_building_own_firestore_paths."
    referenced_by:
      - docs/architecture/adr-0012-seed-buffer-derivation-strategy.md
      - design/gdd/seed-buffer.md
    added: 2026-07-17
    revised: "2026-07-17"

