# ─── PERFORMANCE BUDGETS ──────────────────────────────────────────────────────
# Frame time allocations per system, against a defined total frame budget.
# Conflicts: allocations that sum to more than the total budget = unshippable.
#
# Register a budget when an ADR explicitly claims a frame time allocation.
# The registry lets /architecture-review verify the total doesn't exceed the target.

performance_budgets: []

# Example:
#
# performance_budgets:
#   - target_fps: 60
#     total_frame_budget_ms: 16.6
#     platform: PC             # PC | Console | Mobile | All
#     adr: docs/architecture/adr-0000-performance-targets.md
#     added: 2026-03-26
#     revised: ""
#
#   - system: combat
#     status: active
#     budget_ms: 2.0
#     adr: docs/architecture/adr-0003-combat-system.md
#     notes: "Includes physics queries, hitbox evaluation, and damage calculation"
#     referenced_by:
#       - docs/architecture/adr-0003-combat-system.md
#     added: 2026-03-26
#     revised: ""


# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: inter_system_reference_resolution
    status: active
    api: "Autoload singleton (TimeTickSystem, ResourceItemDatabase ONLY) + typed @export node-reference injection (all other MVP modules), wired via GameWorld.tscn scene file at deserialization time"
    not: "Autoload for all modules; code-assigned wiring inside GameWorld._ready(); service-locator/reflection-based DI"
    adr: docs/architecture/adr-0001-inter-system-reference-dependency-injection-pattern.md
    reason: "Matches the project's dependency-injection-over-singletons coding standard while keeping the 2 genuinely-global, no-mock-requirement Foundation services low-boilerplate"
    referenced_by:
      - docs/architecture/adr-0001-inter-system-reference-dependency-injection-pattern.md
    added: 2026-07-11
    revised: ""

  - purpose: tuning_config_data_format
    status: active
    api: "Custom Resource-derived config classes, one per module, stored as .tres (text, never binary .res) under res://data/config/"
    not: "ConfigFile (untyped, stringly-typed key lookups); plain JSON/custom-parsed files"
    adr: docs/architecture/adr-0002-tuning-config-data-strategy.md
    reason: "Typed @export fields (static-typing-enforced), native Inspector editing, git-diff-friendly text format, consistent with Resource & Item Database's own 'external data resources' idiom"
    referenced_by:
      - docs/architecture/adr-0002-tuning-config-data-strategy.md
    added: 2026-07-11
    revised: ""

  - purpose: voxel_rendering
    status: active
    api: "GridMap (use_collision = false), populated from Voxel World's own Dictionary[Vector3i, CellData] data layer"
    not: "Manual MultiMeshInstance3D; chunked/greedy mesher"
    adr: docs/architecture/adr-0003-voxel-world-rendering-approach.md
    reason: "PROVISIONAL pending pre-VS performance spike. GridMap's data model (fixed cell_size, one item per cell) matches Voxel World's own contract almost exactly; chunked mesher's remesh-per-edit cost fights the already-validated live-editing interaction feel."
    referenced_by:
      - docs/architecture/adr-0003-voxel-world-rendering-approach.md
    added: 2026-07-11
    revised: ""

  - purpose: block_picking
    status: active
    api: "Manual DDA (digital differential analyzer) grid-walk against Voxel World's own Dictionary[Vector3i, CellData], via Voxel World's raycast_cells() API"
    not: "PhysicsServer3D / RayCast3D against GridMap-generated or hand-spawned colliders"
    adr: docs/architecture/adr-0003-voxel-world-rendering-approach.md
    reason: "GridMap collision is disabled (nothing needs it); DDA against the authoritative data layer is cheaper and preserves the concept prototype's already-validated picking feel unmodified"
    referenced_by:
      - docs/architecture/adr-0003-voxel-world-rendering-approach.md
    added: 2026-07-11
    revised: ""

  - purpose: physics_backend
    status: active
    api: "Jolt Physics 3D (Godot 4.6+ default, no override)"
    not: "GodotPhysics3D (legacy) — no GDD needs a GodotPhysics3D-specific feature (no joints used anywhere)"
    adr: docs/architecture/adr-0004-physics-backend-picking-strategy.md
    reason: "Zero-configuration engine default; better determinism/stability generally; the only physics usage in the project (villager hit-testing) has no backend-specific requirement either way"
    referenced_by:
      - docs/architecture/adr-0004-physics-backend-picking-strategy.md
    added: 2026-07-11
    revised: ""

  - purpose: villager_hit_testing
    status: active
    api: "Area3D + CollisionShape3D (capsule) per villager, collision_layer=1, collision_mask=0; queried via PhysicsDirectSpaceState3D.intersect_ray() with collision_mask=1, collide_with_areas=true, collide_with_bodies=false"
    not: "StaticBody3D/CharacterBody3D (implies unwanted physical collision response); querying without collide_with_areas=true (silently returns no hit — a real bug found during ADR-0004's validation)"
    adr: docs/architecture/adr-0004-physics-backend-picking-strategy.md
    reason: "Villagers need ray-detectability for click-to-select only, never physical collision response (movement is cell-interpolated, not physics-simulated)"
    referenced_by:
      - docs/architecture/adr-0004-physics-backend-picking-strategy.md
    added: 2026-07-11
    revised: ""

  - purpose: collision_layer_numbering
    status: active
    api: "Layer 1 = villagers (ADR-0004). Layers 2-8 reserved for future gameplay physics (e.g. Squad & Combat hitboxes, VS+) — future ADRs claim a layer here, not redefine Layer 1. Layers 9-20 reserved for editor/engine internal conventions, left untouched."
    not: "Ad-hoc layer assignment per system without checking this convention first"
    adr: docs/architecture/adr-0004-physics-backend-picking-strategy.md
    reason: "No collision-layer convention existed before this ADR; establishing one now prevents future layer conflicts as more physics-using systems are added post-MVP"
    referenced_by:
      - docs/architecture/adr-0004-physics-backend-picking-strategy.md
    added: 2026-07-11
    revised: ""

  - purpose: boot_gate_mechanism
    status: active
    api: "Unified check-then-connect gate in GameWorld._ready(): check ResourceItemDatabase.is_ready() synchronously first, fall back to .connect(validation_complete, CONNECT_ONE_SHOT) if not yet ready. ALL injected-tier modules' setup() calls wait for this gate, not just Building System/Villager AI."
    not: "Per-module allowlist gating (narrow scope matching only the GDDs' literally-named modules); polling is_ready() every frame/Timer"
    adr: docs/architecture/adr-0005-boot-sequencing-initialization-gate.md
    reason: "Eliminates 'forgot to gate the new module' as a bug class; RID validation cost expected negligible at MVP scale; matches the project's event-driven-not-polled architecture principle"
    referenced_by:
      - docs/architecture/adr-0005-boot-sequencing-initialization-gate.md
    added: 2026-07-11
    revised: ""

  - purpose: item_definition_data_format
    status: active
    api: "One .tres ItemDefinitionResource file per entry (matches ADR-0002's config-data idiom); visual_asset typed as @export var visual_asset: Mesh, not a path string"
    not: "Consolidated data tables (one file, many entries); path-string asset references"
    adr: docs/architecture/adr-0006-data-definition-immutability-reference-format.md
    reason: "Matches ADR-0002's established authoring idiom; typed Mesh reference feeds directly into ADR-0003's MeshLibrary-population boot step with no translation layer"
    referenced_by:
      - docs/architecture/adr-0006-data-definition-immutability-reference-format.md
    added: 2026-07-11
    revised: ""

  - purpose: item_definition_query_type
    status: active
    api: "get_by_id() returns a getter-only ItemDefinition (RefCounted) wrapper around the shared internal ItemDefinitionResource — no duplication"
    not: "Returning the internal ItemDefinitionResource directly; a defensive-copy via duplicate()"
    adr: docs/architecture/adr-0006-data-definition-immutability-reference-format.md
    reason: "Closes off idiomatic mutation paths (no setters exist) at lower per-query cost than duplication; deliberate Object.get()/set() reflection bypass remains a documented residual risk, not fully closed"
    referenced_by:
      - docs/architecture/adr-0006-data-definition-immutability-reference-format.md
    added: 2026-07-11
    revised: ""

  - purpose: pathfinding_algorithm
    status: active
    api: "AStar3D — manually-built graph (one point per standable cell, connections only between legal-step pairs), incrementally patched on Voxel World writes via a deterministic Vector3i->int64 ID packing scheme"
    not: "NavigationServer3D/navmesh baking (doesn't map cleanly onto the custom clearance/step/no-corner-cut rules, and rebake cost is the flagged risk this avoids); AStarGrid3D (does not exist in Godot 4.7 — verified)"
    adr: docs/architecture/adr-0007-ai-pathfinding-navigation-room-analysis.md
    reason: "PROVISIONAL pending pre-VS performance spike. Custom movement rules are a tile/grid model, not a navmesh-agent problem; AStar3D gives exact control with no lossy geometric approximation."
    referenced_by:
      - docs/architecture/adr-0007-ai-pathfinding-navigation-room-analysis.md
    added: 2026-07-11
    revised: ""

  - purpose: room_analysis_algorithm
    status: active
    api: "Build Validation's own independent BFS/flood-fill, calling Villager AI's shared is_standable/is_step_legal predicates directly"
    not: "Sharing Villager AI's internal AStar3D graph object; NavigationServer3D navmesh-region-membership queries"
    adr: docs/architecture/adr-0007-ai-pathfinding-navigation-room-analysis.md
    reason: "Reachability tracing is a different traversal shape than shortest-path; sharing predicates (not the graph object) satisfies 'exact same rules' while keeping the two systems' internals decoupled"
    referenced_by:
      - docs/architecture/adr-0007-ai-pathfinding-navigation-room-analysis.md
    added: 2026-07-11
    revised: ""

  - purpose: villager_ai_architecture
    status: active
    api: "Plain explicit FSM (enum state + one function per state via match)"
    not: "Behavior tree (framework overhead for a fixed 6-state/strict-priority design); utility AI / scored candidates (this project's priorities are discrete and strict, never blended)"
    adr: docs/architecture/adr-0008-villager-ai-execution-threading-strategy.md
    reason: "villager-ai-behavior.md already fixes the state set and priority order; a framework built for open-ended/blended decision spaces adds no value here"
    referenced_by:
      - docs/architecture/adr-0008-villager-ai-execution-threading-strategy.md
    added: 2026-07-11
    revised: ""

  - purpose: deciding_pass_scheduling
    status: active
    api: "Tick-staggered budget (max_deciding_per_tick config knob) + stable-order FIFO queue; villagers beyond budget wait for subsequent ticks"
    not: "Unstaggered same-tick processing of all eligible villagers; WorkerThreadPool-based parallelism"
    adr: docs/architecture/adr-0008-villager-ai-execution-threading-strategy.md
    reason: "PROVISIONAL pending pre-VS spike. Bounds worst-case per-tick cost at mass-Deciding events (e.g. after scene load); single-threaded staggering is expected sufficient at the 20-30 villager ceiling"
    referenced_by:
      - docs/architecture/adr-0008-villager-ai-execution-threading-strategy.md
    added: 2026-07-11
    revised: ""

  - purpose: villager_occupancy_model
    status: active
    api: "Discrete current_cell (tick-boundary-quantized) — a villager occupies from_cell for the entire transit, becomes to_cell only at tick-boundary arrival. Separate continuous _visual_position, interpolated every frame, cosmetic only."
    not: "Deriving occupancy from interpolation progress; occupying both cells weighted by progress; flipping occupancy at the interpolation midpoint"
    adr: docs/architecture/adr-0009-deterministic-movement-occupancy-ordering.md
    reason: "Gives every consumer (Building System's occupancy check, F4 targeting, walled-in detection) one unambiguous cell, always; matches F1's existing tick-boundary-only crediting principle"
    referenced_by:
      - docs/architecture/adr-0009-deterministic-movement-occupancy-ordering.md
    added: 2026-07-11
    revised: ""

  - purpose: click_ownership_arbitration
    status: active
    api: "Native Godot GUI-before-unhandled-input propagation (_input -> Control._gui_input -> _unhandled_input) — Camera & Input needs zero special code, an HUD-consumed click simply never reaches its _unhandled_input handler. Explicit hover flag is a redundant safety net checked only when STARTING a new pick/selection."
    not: "Camera & Input checking any flag or interpreting click targets itself (would violate its existing opaque-passthrough contract)"
    adr: docs/architecture/adr-0010-cross-system-ui-world-input-arbitration.md
    reason: "Preserves Camera & Input's already-accepted 'never interpret the action name' contract unchanged while still guaranteeing exactly-one-owner-per-click"
    referenced_by:
      - docs/architecture/adr-0010-cross-system-ui-world-input-arbitration.md
    added: 2026-07-11
    revised: ""

  - purpose: drag_release_capture
    status: active
    api: "Building System listens via _input() (not _unhandled_input()) for the release of an already-in-progress world-space drag, claimed via get_viewport().set_input_as_handled(); reverts to _unhandled_input() once the drag completes"
    not: "Restructuring HUD mouse_filter zones to try to avoid releases landing on them; Input capture (MOUSE_MODE_CAPTURED)"
    adr: docs/architecture/adr-0010-cross-system-ui-world-input-arbitration.md
    reason: "_input() fires before Control consumption regardless of cursor position, guaranteeing the release is never swallowed by the HUD — scoped narrowly to the Dragging state only"
    referenced_by:
      - docs/architecture/adr-0010-cross-system-ui-world-input-arbitration.md
    added: 2026-07-11
    revised: ""

