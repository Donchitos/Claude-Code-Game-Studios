# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: save_serialization
    status: active
    api: FileAccess.store_var / FileAccess.get_var   # binary Variant serialization of a nested Dictionary
    not: JSON.stringify / JSON.parse                 # explicitly rejected for save payloads
    adr: docs/architecture/adr-0003-save-persistence-serialization.md
    reason: "store_var/get_var preserves GDScript int (64-bit) with full fidelity; JSON represents all numbers as 53-bit doubles, which silently truncates forge_counter (Forja OQ-FL4 pt.3) in long legacies. Uniform across all fields — no per-field int64 encoding rule to forget. get_var(allow_objects=false) always; systems hand SaveService plain-Variant dicts, never RefCounted/Resource instances."
    referenced_by:
      - docs/architecture/adr-0003-save-persistence-serialization.md
    added: 2026-08-21
    revised: ""

  - purpose: save_corruption_checksum
    status: active
    api: hash()   # @GlobalScope Variant hash over the payload Dictionary
    not: manual CRC32
    adr: docs/architecture/adr-0003-save-persistence-serialization.md
    reason: "GDD requires corruption/partial-write detection only, not tamper resistance or cross-engine-version stability. hash() is built-in (no manual CRC32 code) and adequate. Note: 32-bit hash (~1-in-4e9 collision) — acceptable for the stated requirement; algorithm is an interchangeable detail if more margin is ever wanted. Checksum stored as a sibling key {payload, checksum}, never inside the hashed dict."
    referenced_by:
      - docs/architecture/adr-0003-save-persistence-serialization.md
    added: 2026-08-21
    revised: ""

# Example:
#
# api_decisions:
#   - purpose: physics_raycast
#     status: active
#     api: PhysicsServer3D.space_get_direct_state()
#     not: RayCast3D node     # explicitly banned for this purpose
#     adr: docs/architecture/adr-0002-physics-architecture.md
