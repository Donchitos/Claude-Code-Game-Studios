    owner_system: data-persistence-layer
    adr: docs/architecture/adr-0003-firestore-schema-persistence-strategy.md
    interface: "PersistenceRepository (buyItem/approveTask/rejectTask/submitTask/
      equipItem) + centralized Firestore path constants. Defines the complete schema:
      families/{parentId}/children/{childId}[/private/credentials | /tasks | /inventory],
      families/{parentId}/customTasks. No system builds Firestore paths by hand."
    write_access: all-mutations-via-repository   # individual FIELDS are owned by their
      # systems (xuBalance→Currency, petLevel→Pet Leveling, etc.); the SCHEMA/paths are
      # owned here and every read/write goes through the repository contract.
    referenced_by:
      - docs/architecture/adr-0003-firestore-schema-persistence-strategy.md
      - design/gdd/data-persistence-layer.md
    added: 2026-07-07
    revised: ""

  - state: current_energy
    status: active
    owner_system: time-decay
    adr: docs/architecture/adr-0005-time-decay-calculation-strategy.md
    interface: "energyProvider (read-only double, range 10–100). Pure on-foreground calc via
      computeEnergy(storedEnergy, lastApprovedAt, createdAt, now) scoped to activeChild.
      Recomputes on app resume (resumeTickProvider) + on the child-doc stream changing."
    write_access: none   # Time & Decay computes but persists NOTHING. The backing fields
      # storedEnergy (increment) + lastApprovedAt (serverTimestamp) are written by Parent
      # Approval's transaction per ADR-0003; the energy→mood lookup is owned by Pet State Machine (#6).
    referenced_by:
      - docs/architecture/adr-0005-time-decay-calculation-strategy.md
      - design/gdd/time-decay.md
      - design/gdd/pet-state-machine.md
    added: 2026-07-07
    revised: ""

  - state: item_catalog
