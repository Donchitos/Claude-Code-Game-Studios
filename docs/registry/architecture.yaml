  - state: chest_count
    status: active
    owner_system: parent-approval   # INTERIM, write path only — formally owned by gacha-loot's GDD (which
      # also owns the -1 chest-open decrement, not implemented by ADR-0013 or any epic yet)
    adr: docs/architecture/adr-0013-parent-approval-transaction-architecture.md
    interface: "children/{childId}.chestCount. The +chestDelta write (0-2, per Contract 1:
      chestDelta = [leveledUp] + [hitChestMilestone], both stack rather than suppress) is written only
      inside ParentApprovalRepository.approveTask()'s runTransaction, via
      FieldValue.increment(chestDelta), skipped entirely when chestDelta == 0. The chest-OPEN -1
      decrement is Gacha/Loot's own future write, not implemented here — composes safely with this
      write since both are independent FieldValue.increment() operations on the same field."
    write_access: increment-only   # +delta: Parent Approval's transaction (this ADR); -1 on open: Gacha/Loot,
      # not yet implemented — both increment-only, no absolute set from either side
    referenced_by:
