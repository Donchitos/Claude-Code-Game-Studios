# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: folding_flutter_widget_cost_into_flame_draw_call_count
    status: active
    description: "A GDD or ADR must not add Flutter widget compositing cost (overlays,
      bottom sheets, app bars, etc.) into the same number used to track the
      ≤200 Flame-canvas draw-call budget. The two are measured by different
      tools (manual tally vs. DevTools frame time) and must stay reported separately."
    why: "Flame-canvas draw calls and Flutter widget compositing are fundamentally
      different rendering models (immediate-mode component tree vs. retained-mode
      layer tree) with no shared countable unit. Merging them into one number
      would produce a figure nobody could act on, and would make it impossible
      to tell which layer needs optimization when a screen regresses."
    adr: docs/architecture/adr-0001-draw-call-budget-scope.md
    referenced_by:
      - docs/architecture/adr-0001-draw-call-budget-scope.md
    added: 2026-07-07

  - pattern: re_deriving_session_state
    status: active
    description: "No system may re-implement the 4-state session derivation. The
      only source of truth is auth-account's sessionStateProvider. Route guards and
      any state-dependent logic must READ that provider, not recompute it from
      authStateProvider/activeChildProvider themselves."
    why: "Two derivations of the same routing state will drift and produce
      contradictory navigation. Main Navigation Shell #17 already assumed a
      sessionStateProvider that didn't exist; centralizing it prevents recurrence."
    adr: docs/architecture/adr-0002-auth-pin-security-architecture.md
    referenced_by:
      - docs/architecture/adr-0002-auth-pin-security-architecture.md
      - design/gdd/auth-account.md
      - design/gdd/main-navigation-shell.md
    added: 2026-07-07

  - pattern: per_child_firebase_auth_identity
    status: active
    description: "Children must NOT have their own Firebase Auth account (anonymous,
      custom-token, or otherwise). A child is a Firestore document under the parent's
      account; only the parent is a Firebase Auth principal."
    why: "COPPA — children under 13 must not have separate accounts. This constraint
      also determines the PIN's security ceiling (see treating_pin_as_data_access_boundary)."
    adr: docs/architecture/adr-0002-auth-pin-security-architecture.md
    referenced_by:
      - docs/architecture/adr-0002-auth-pin-security-architecture.md
      - design/gdd/auth-account.md
    added: 2026-07-07

  - pattern: treating_pin_as_data_access_boundary
    status: active
    description: "No system may rely on the child PIN as a data-access control. The
      PIN gates only the shipped app UI. Child data is protected solely by the parent
      Firebase Auth identity + Firestore rules scoped on request.auth.uid == parentId.
      Any shared-device session can read all sibling data at the data layer."
    why: "Firestore rules cannot distinguish parent-holding-device from child-holding-
      device under one shared auth identity (a direct consequence of the COPPA
      no-child-identity rule). Assuming the PIN protects data would build systems on
      a boundary that does not exist. See ADR-0002 Non-Goals."
    adr: docs/architecture/adr-0002-auth-pin-security-architecture.md
    referenced_by:
      - docs/architecture/adr-0002-auth-pin-security-architecture.md
      - design/gdd/auth-account.md
    added: 2026-07-07

  - pattern: absolute_set_on_balance_or_counters
    status: active
    description: "Never write an absolute value with set()/update() to a balance or counter
      field (xuBalance, seedCount, chestCount, approvedTaskCount, storedEnergy, totalXuEarned).
      Always use FieldValue.increment(delta)."
    why: "Firestore resolves field conflicts last-write-wins. Two devices editing a balance
      offline then syncing would clobber each other with absolute sets; increment() is
      server-side atomic and additively correct regardless of sync order."
    adr: docs/architecture/adr-0003-firestore-schema-persistence-strategy.md
    referenced_by:
      - docs/architecture/adr-0003-firestore-schema-persistence-strategy.md
      - docs/architecture/adr-0013-parent-approval-transaction-architecture.md
      - design/gdd/data-persistence-layer.md
      - design/gdd/currency-system.md
      - design/gdd/parent-approval.md
    added: 2026-07-07
    revised: "2026-07-17"
    # revision note: scoped exception added for seedCount drift correction — see
    # api_decisions: seedcount_drift_correction (ADR-0012). Server-only, transactional,
    # idempotent CF reconciliation does not carry the client-race risk this pattern bans.

  - pattern: systems_building_own_firestore_paths
    status: active
    description: "No system may construct Firestore collection/document paths inline. All
      reads and writes go through PersistenceRepository and its centralized path constants."
    why: "Ad-hoc paths drift from the schema and bypass the atomic-write contracts, producing
      inconsistent data models and partial-write bugs. One repository = one schema authority."
    adr: docs/architecture/adr-0003-firestore-schema-persistence-strategy.md
    referenced_by:
      - docs/architecture/adr-0003-firestore-schema-persistence-strategy.md
      - design/gdd/data-persistence-layer.md
    added: 2026-07-07

  - pattern: storing_credentials_on_profile_document
    status: active
    description: "pinHash/pinSalt must live only in children/{childId}/private/credentials,
      never on the children/{childId} profile document."
    why: "The profile document is read to render the child-selection list; keeping PIN material
      off it prevents credentials from being pulled into that working set on every render.
      Fetched via get() only at PIN-entry time, never streamed. (ADR-0002 §7 / ADR-0003)"
    adr: docs/architecture/adr-0003-firestore-schema-persistence-strategy.md
    referenced_by:
      - docs/architecture/adr-0003-firestore-schema-persistence-strategy.md
      - docs/architecture/adr-0002-auth-pin-security-architecture.md
      - design/gdd/data-persistence-layer.md
      - design/gdd/auth-account.md
    added: 2026-07-07

  - pattern: flame_to_flutter_callback
    status: active
    description: "The Flame layer must never call back into Flutter/Riverpod — no provider
      writes from a component, no callbacks into widgets. Cross-boundary data flow is one-way:
      Flutter→Bus→Flame. (Pet Interaction #14 emitting petInteracted directly is allowed — that
      is Flame→Bus→Flame, still never Flame→Flutter.)"
    why: "Bidirectional flow destroys the single-source-of-truth model (Flutter state is truth,
      Flame is display) and creates feedback loops / ordering ambiguity between the two runtimes."
    adr: docs/architecture/adr-0004-flutter-flame-event-bridge-architecture.md
    referenced_by:
      - docs/architecture/adr-0004-flutter-flame-event-bridge-architecture.md
      - design/gdd/flutter-flame-state-bridge.md
    added: 2026-07-07

  - pattern: subscribing_to_event_bus_in_onload
    status: active
    description: "Flame components must subscribe to GameEventBus in onMount(), NEVER onLoad().
      Keep cancel() in onRemove()."
    why: "isMounted is false throughout onLoad(), so the mandatory `if(!isMounted) return;` guard
      silently drops every event during the load→mount window (not queued — gone). onMount is
      guaranteed 1:1-paired with onRemove (onLoad is not → leak if removal races load), and onLoad
      runs only once (a re-added component stops receiving events under an onLoad subscribe).
      Verified against Flame 1.37.0 source, 2026-07-07."
    adr: docs/architecture/adr-0004-flutter-flame-event-bridge-architecture.md
    referenced_by:
      - docs/architecture/adr-0004-flutter-flame-event-bridge-architecture.md
      - design/gdd/flutter-flame-state-bridge.md
    added: 2026-07-07

  - pattern: sharing_gameevent_payload_types
    status: active
    description: "Each GameEventType owns a distinct payload type; never ship one type's payload
      shape under a different type. Every _onEvent handler checks event.type before casting event.data."
    why: "Reusing a payload across types caused a real runtime TypeError (a Triggered State enum
      EXCITED shipped inside petMoodChanged, whose payload is the Base-Mood PetMood enum). Distinct
      types = distinct payloads makes the mismatch impossible."
    adr: docs/architecture/adr-0004-flutter-flame-event-bridge-architecture.md
    referenced_by:
      - docs/architecture/adr-0004-flutter-flame-event-bridge-architecture.md
      - design/gdd/flutter-flame-state-bridge.md
      - design/gdd/parent-approval.md
    added: 2026-07-07

  - pattern: background_timer_or_recompute_for_energy
    status: active
    description: "Energy decay is computed on-foreground only, by Time & Decay's pure
      computeEnergy() function (recomputed on app resume + child-doc change). No background
      timer, no scheduled job, no per-second recalculation, and no system other than
      Time & Decay recomputes decay — everyone else reads energyProvider."
    why: "A background timer drains battery and hits platform background-execution limits for
      zero player-visible benefit (energy is only observed on foreground). A second computation
      site would drift from the canonical one. Keeping one on-foreground calc keeps it offline,
      testable (injected `now`), and race-free with Parent Approval's writes."
    adr: docs/architecture/adr-0005-time-decay-calculation-strategy.md
    referenced_by:
      - docs/architecture/adr-0005-time-decay-calculation-strategy.md
      - design/gdd/time-decay.md
    added: 2026-07-07

  - pattern: settable_pet_mood_state
    status: active
    description: "Base Mood must be a derived Provider<MoodState> (pure function of energy via the
      energy→mood lookup). Never a settable StateProvider, never set directly by any system."
    why: "Setting mood directly bypasses the energy→mood lookup — the single source of the mood value —
      and lets mood drift out of sync with energy, defeating Pillar 2 (pet mood mirrors real effort)."
    adr: docs/architecture/adr-0007-pet-state-machine-architecture.md
    referenced_by:
      - docs/architecture/adr-0007-pet-state-machine-architecture.md
      - design/gdd/pet-state-machine.md
    added: 2026-07-07

  - pattern: wall_clock_timer_for_flame_triggered_state
    status: active
    description: "Triggered-state (and any pausable in-game) timers must be frame-ticked — Flame
      TimerComponent/Timer/Effect advanced by update(dt) — never DateTime/Future.delayed/Stopwatch."
    why: "Flame pauses the game loop on background (pauseWhenBackgrounded), so a frame-ticked timer
      pauses and resumes correctly; a wall-clock timer keeps counting while backgrounded and the
      animation appears to jump on foreground, breaking TR-petstate-004 (resume, don't restart/skip)."
    adr: docs/architecture/adr-0007-pet-state-machine-architecture.md
    referenced_by:
      - docs/architecture/adr-0007-pet-state-machine-architecture.md
      - design/gdd/pet-state-machine.md
    added: 2026-07-07

  - pattern: disabling_pause_when_backgrounded
    status: active
    description: "No code may set pauseWhenBackgrounded=false on the shared FlameGame, and any
      override of FlameGame.lifecycleStateChange() MUST call super.lifecycleStateChange(state)."
    why: "The frame-ticked-timer pause/resume guarantee (TR-petstate-004) depends entirely on
      FlameGame auto-pausing the loop on background. Flipping the flag (e.g. to keep BGM playing
      backgrounded) or swallowing the lifecycle callback silently breaks every pausable timer with
      no visible link to this ADR. Constrains the audio ADR + whoever owns the root FlameGame (Pet Room UI)."
    adr: docs/architecture/adr-0007-pet-state-machine-architecture.md
    referenced_by:
      - docs/architecture/adr-0007-pet-state-machine-architecture.md
      - design/gdd/pet-state-machine.md
    added: 2026-07-07

  - pattern: dual_currency_or_iap
    status: active
    description: "xu is the ONLY currency. No premium/second currency, no in-app purchase, no
      ad-reward xu, no daily-login xu bonus. xu is earned only from task approval + gacha reward."
    why: "A second (purchasable) currency opens a pay-to-win path that directly violates Pillar 1
      (xu only from real effort, never shortcuts) — the game's core message about earned reward."
    adr: docs/architecture/adr-0008-currency-balance-mutation-rules.md
    referenced_by:
      - docs/architecture/adr-0008-currency-balance-mutation-rules.md
      - design/gdd/currency-system.md
    added: 2026-07-07

  - pattern: purchase_without_single_flight_guard
    status: active
    description: "Any spend flow (Shop item, Paid Chest) MUST hold a screen-scoped single-flight
      guard that disables ALL purchase buttons — not just the tapped one — while a purchase batch
      is in flight, released on completion/failure."
    why: "Affordability-check (read xuBalance from the stream) → decrement (WriteBatch) is a
      read-then-write with a gap. Without the guard, an honest child double-tapping two different
      item cards before the balance stream updates passes both checks against the stale balance,
      fires both decrements, and receives BOTH items with a negative balance — real economy
      corruption by a normal client, not a modified-client edge. Deeper server-side idempotency
      is the QQ-01 / TR-shop-003 ADR's job; this guard is the honest-client floor."
    adr: docs/architecture/adr-0008-currency-balance-mutation-rules.md
    referenced_by:
      - docs/architecture/adr-0008-currency-balance-mutation-rules.md
      - design/gdd/currency-system.md
      - design/gdd/shop-system.md
    added: 2026-07-07

  - pattern: client_settable_task_reward
    status: active
    description: "A task's xuReward/energyReward must equal the category reward table for its categoryId —
      validated by Security Rule at create, immutable on update. Never client-chosen, never parent-overridable.
      Custom tasks re-derive reward from categoryId; they do not carry their own reward values."
    why: "Approve grants the stored reward via a client-side offline transaction — a client-settable reward is
      a direct economy-forgery path (write inflated xuReward, then approve it). Data-driven table + write-time
      rule keeps the granted reward honest."
    adr: docs/architecture/adr-0009-task-lifecycle-reward-integrity.md
    referenced_by:
      - docs/architecture/adr-0009-task-lifecycle-reward-integrity.md
      - design/gdd/task-library.md
    added: 2026-07-08

  - pattern: blanket_recursive_firestore_rule
    status: active
    description: "Do NOT use blanket recursive wildcard match blocks (match /{document=**} { allow write: ... })
      that grant write across a whole subtree. Use explicit nested per-collection match blocks so stricter
      per-collection rules are effective."
    why: "Firestore Security Rules are OR'd across ALL matching match blocks (any allow = allowed; no
      narrowest-wins). A blanket wildcard silently defeats any stricter per-collection rule added alongside it —
      exactly what nearly made ADR-0009's tasks reward gate inert against ADR-0003's original blanket rule."
    adr: docs/architecture/adr-0009-task-lifecycle-reward-integrity.md
    referenced_by:
      - docs/architecture/adr-0009-task-lifecycle-reward-integrity.md
      - docs/architecture/adr-0003-firestore-schema-persistence-strategy.md
    added: 2026-07-08

  - pattern: client_side_fcm_send
    status: active
    description: "FCM push messages MUST be sent server-side (a Cloud Function via the Admin SDK), never
      from the client app."
    why: "A client send needs the server credential (a leak), and the device that triggers a notification
      is often the child's — it cannot reliably notify the parent, and an offline submit couldn't send at all."
    adr: docs/architecture/adr-0010-push-notification-delivery-architecture.md
    referenced_by:
      - docs/architecture/adr-0010-push-notification-delivery-architecture.md
      - design/gdd/push-notification.md
    added: 2026-07-08

  - pattern: reprompt_ios_notification_permission
    status: active
    description: "On iOS, never re-call requestPermission() to re-show the permission dialog — it is
      one-shot per install and a second call silently no-ops. Check getNotificationSettings().authorizationStatus;
      for a declined state, deep-link to Settings (UIApplication.openSettingsURLString). Android may re-prompt."
    why: "iOS UNUserNotificationCenter shows the system dialog once per install; a reminder that re-calls
      requestPermission() does nothing visible, stranding the parent with no way to enable notifications."
    adr: docs/architecture/adr-0010-push-notification-delivery-architecture.md
    referenced_by:
      - docs/architecture/adr-0010-push-notification-delivery-architecture.md
      - design/gdd/push-notification.md
      - design/gdd/parent-dashboard-ui.md
    added: 2026-07-08

  - pattern: regenerating_idempotency_token_on_retry
    status: active
    description: "A client-generated idempotency token (e.g. Paid Chest's purchaseId) must be
      generated ONCE per logical action attempt and reused across every retry of that SAME
      attempt (including a manual retry after a perceived failure). It must NOT be regenerated
      on every user tap/call."
    why: "The token's only job is to let the server recognize 'this exact request already
      happened.' If a perceived-failure retry mints a fresh token, the transaction sees an
      absent purchaseLog doc and proceeds normally — silently reproducing the exact
      double-charge the token exists to prevent, with no error signal. A new token is only
      correct after the PRIOR attempt has definitively resolved (success, or the user
      abandons the flow entirely) — not merely after the guard/button re-enables."
    adr: docs/architecture/adr-0011-shop-purchase-pipeline-idempotency-fix.md
    referenced_by:
      - docs/architecture/adr-0011-shop-purchase-pipeline-idempotency-fix.md
      - design/gdd/shop-system.md
    added: 2026-07-11

  - pattern: ref_watch_on_session_state_inside_router_provider
    status: active
    description: "routerProvider (and any Provider<GoRouter> equivalent) must use ref.listen on
      sessionStateProvider for its refresh bridge, never ref.watch."
    why: "ref.watch would rebuild/recreate the entire Provider<GoRouter> — and therefore the
      GoRouter instance — on every session-state change, tearing down BOTH StatefulShellRoute
      trees and destroying the branch-preservation guarantee (and Pet Room's live FlameGame
      instance) the whole navigation architecture exists to protect. Found in engine-specialist
      validation of ADR-0014, 2026-07-18 — a very common mistake in Riverpod+go_router tutorials."
    adr: docs/architecture/adr-0014-navigation-shell-route-guard-architecture.md
    referenced_by:
      - docs/architecture/adr-0014-navigation-shell-route-guard-architecture.md
    added: 2026-07-18

  - pattern: go_router_refresh_stream_usage
    status: active
    description: "Never import or reference GoRouterRefreshStream. Use a ValueNotifier bumped via
      ref.listen(sessionStateProvider, ...) as the refreshListenable instead."
    why: "GoRouterRefreshStream was removed from the go_router package itself in v5.0.0 and is not
      re-exported by the pinned go_router ^17.3.0 (verified directly against installed package
      source — it exists only in old CHANGELOG entries, not in lib/). Already found once during
      ADR-0002/Story 003; registered here so ADR-0014 and future navigation work don't reintroduce it."
    adr: docs/architecture/adr-0014-navigation-shell-route-guard-architecture.md
    referenced_by:
      - docs/architecture/adr-0002-auth-pin-security-architecture.md
      - docs/architecture/adr-0014-navigation-shell-route-guard-architecture.md
    added: 2026-07-18

  - pattern: will_pop_scope_usage
    status: active
    description: "Never use WillPopScope for back-button handling. Use PopScope with
      onPopInvokedWithResult (not the also-deprecated onPopInvoked)."
    why: "WillPopScope was removed in Flutter 3.22+ (confirmed in docs/engine-reference/flutter-flame/
      deprecated-apis.md and directly against the pinned Flutter 3.44.4 SDK source). This project's
      back-button behavior (Main Navigation Shell's per-shell, per-override-state confirm dialogs)
      depends on PopScope's real API shape."
    adr: docs/architecture/adr-0014-navigation-shell-route-guard-architecture.md
    referenced_by:
      - docs/architecture/adr-0014-navigation-shell-route-guard-architecture.md
    added: 2026-07-18

