    revised: ""

  - state: approved_task_count
    status: active
    owner_system: parent-approval   # INTERIM — formally owned by gacha-loot's GDD, which has no ADR/epic
      # of its own yet; same ordering rationale as total_xu_earned/pet_level above
    adr: docs/architecture/adr-0013-parent-approval-transaction-architecture.md
    interface: "children/{childId}.approvedTaskCount. Written only inside
      ParentApprovalRepository.approveTask()'s runTransaction, via FieldValue.increment(1). Read (in the
      same transaction) to compute hitChestMilestone = newApprovedTaskCount % gachaFreeChestMilestone == 0
      (gachaFreeChestMilestone = 5, design/registry/entities.yaml)."
    write_access: increment-only-via-parent-approval-transaction
    referenced_by:
