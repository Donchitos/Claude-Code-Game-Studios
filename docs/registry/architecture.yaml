    revised: ""

  - state: total_xu_earned
    status: active
    owner_system: parent-approval   # INTERIM — formally owned by pet-leveling-evolution's GDD, but that
      # system has no ADR/epic of its own yet; Parent Approval is the sole writer in MVP and registers the
      # write mechanism now rather than blocking on an epic that doesn't exist (ADR-0013 Ordering Note).
    adr: docs/architecture/adr-0013-parent-approval-transaction-architecture.md
    interface: "Lifetime effort counter on children/{childId}.totalXuEarned. Written only inside
      ParentApprovalRepository.approveTask()'s runTransaction, via FieldValue.increment(task.xuReward).
      Read (in the same transaction) to compute leveledUp against nextLevelThreshold(petLevel)."
    write_access: increment-only-via-parent-approval-transaction
    referenced_by:
