# Architecture Decision Registry
#
# PURPOSE: Single source of truth for key architectural stances that all ADRs
# must agree on. Skills check this before writing new ADRs to detect conflicts
# at authoring time — before stories are created against contradictory decisions.
#
# RULES:
#   - Register a stance when it constrains how OTHER systems must be built.
#     An internal implementation detail that affects only one ADR does not need
#     to be registered.
#   - Never delete entries — set status: superseded_by: ADR-NNNN instead.
#   - When a stance changes: update the entry, set revised: to today's date,
#     add a comment with the old value, and run /architecture-review to check
#     what ADRs are now invalidated.
#   - adr: is the authoritative source. All other ADRs that depend on this
#     stance list themselves in referenced_by.
#
# WRITTEN BY: /architecture-decision (Phase 5 — after ADR is approved)
# READ BY:    /architecture-decision (Step 2 — before authoring begins)
#             /architecture-review (Phase 4 — cross-ADR conflict baseline)
#             /create-stories (to embed architectural constraints in stories)
#             /dev-story (to check implementation against accepted stances)
#
# SEARCH PATTERNS (for skills using Grep):
#   All state owners:       Grep pattern="^  - state:" path="docs/registry/architecture.yaml"
#   Who owns player_health: Grep pattern="state: player_health"
#   All signal contracts:   Grep pattern="pattern: signal"
#   Budget for combat:      Grep pattern="system: combat"
#   All forbidden patterns: Grep pattern="^  - pattern:" (forbidden_patterns section)
#   Superseded entries:     Grep pattern="status: superseded"

version: 1
last_updated: "2026-08-21"   # ADR-0004 (Era lifecycle/init-ordering, Proposed) +1 state_ownership (era_lifecycle_state), +1 interface (era_lifecycle), +2 forbidden_patterns (reading_eradefinition_in_ready, era_lifecycle_driven_outside_eramanager). Prev 2026-08-21: ADR-0003 (Save/Persistencia, Proposed) +1 state_ownership (persisted_game_state), +1 interface (persistence_contract), +3 forbidden_patterns (json_for_int64_persistence, persisting_absolute_game_tick, deserializing_objects_from_save), +2 api_decisions (save_serialization store_var/get_var; save_corruption_checksum hash()). Prev 2026-08-21: ADR-0001 y ADR-0002 movidos Proposed->Accepted tras /architecture-review; cleanups aplicados (ADR-0001 tick source -> TimeControl.game_tick; ADR-0002 process_physics_priority=-1000 + PROCESS_MODE_ALWAYS). Prev 2026-08-18: ADR-0002 (TimeControl) +1 state_ownership (game_time_regime), +1 interface (time_regime), +2 forbidden_patterns; ADR-0001 instance_combat_stats.referenced_by += ADR-0002. Prev: ADR-0001 +1 state_ownership +1 interface +2 forbidden_patterns

# ─── STATE OWNERSHIP ─────────────────────────────────────────────────────────
# Who is the authoritative owner of each piece of shared game state.
# Conflicts: two ADRs claiming to own the same state = data race / authority bug.
#
# Register state when it is READ or WRITTEN by more than one system.
# Internal-only state (never accessed by another system) does not need to be registered.
#
# Required fields: state, owner_system, adr, interface, referenced_by[], added
# interface: how other systems access this state (read-only property, method call,
#   signal, shared resource, etc.) — this is the contract other ADRs depend on.

state_ownership:
  - state: instance_combat_stats
    status: active
    owner_system: combate-dano
    adr: docs/architecture/adr-0001-combat-stat-modifier-layer.md
    interface: "CombatState.effective(stat) / effective_attack_damage() -> int (read-only pull, on-read over per-type CombatProfile + Array[StatModifier]). Base CombatProfile is a per-type Resource, read-only, never mutated at runtime."
    write_access: combate-dano-only   # only Combate applies/expires modifiers and computes effective stats; sources call add_modifier
    referenced_by:
      - docs/architecture/adr-0001-combat-stat-modifier-layer.md
      - docs/architecture/adr-0002-time-control-service.md   # expiry_tick / sweep_expired now read TimeControl.game_tick (supersedes provisional Engine.get_physics_frames())
    added: 2026-08-18
    revised: "2026-08-18"   # ADR-0002: tick source for expiry is TimeControl.game_tick (pause-aware/scale-aware), not Engine.get_physics_frames()

  - state: game_time_regime
    status: active
    owner_system: time-control
    adr: docs/architecture/adr-0002-time-control-service.md
    interface: "TimeControl.time_scale (float, read-only), TimeControl.game_time_paused (bool, read-only; same semantics as Permadeath R4 game_time_paused), TimeControl.game_tick (int, monotonic game-time counter; advances scaled, freezes on pause). Regime set via request_regime(source_id, regime)/release_regime(source_id); effective = max precedence PAUSED>SLOWED>NORMAL."
    write_access: time-control-only   # only TimeControl mutates the regime; sources request/release, everyone else reads
    referenced_by:
      - docs/architecture/adr-0002-time-control-service.md
      - docs/architecture/adr-0001-combat-stat-modifier-layer.md   # blessing expiry reads game_tick
    added: 2026-08-18
    revised: ""

  - state: persisted_game_state
    status: active
    owner_system: save-persistence
    adr: docs/architecture/adr-0003-save-persistence-serialization.md
    interface: "SaveService owns the on-disk save file, the versioned envelope {payload:{schema_version, sistemas:{...}}, checksum:int}, and the serialization mechanism. Each persistable system implements a symmetric serialize_state()->Dictionary / deserialize_state(Dictionary)->void; SaveService assembles sub-dicts under a per-system key without inspecting their meaning. Read/write via request_save()->bool / request_load()->LoadResult. Format: FileAccess.store_var/get_var (binary, native int64). No system persists TimeControl.game_tick or an absolute expiry_tick — only remaining_ticks (relative), rebased on load."
    write_access: save-persistence-only   # only SaveService writes/reads the file; systems supply/receive plain-Variant dicts
    referenced_by:
      - docs/architecture/adr-0003-save-persistence-serialization.md
      - docs/architecture/adr-0001-combat-stat-modifier-layer.md   # StatModifier persistence (remaining_ticks) resolved here
      - docs/architecture/adr-0002-time-control-service.md          # expiry_tick rebasing defined against game_tick, resolved here
    added: 2026-08-21
    revised: ""

  - state: era_lifecycle_state
    status: active
    owner_system: era-lifecycle
    adr: docs/architecture/adr-0004-era-lifecycle-init-ordering.md
    interface: "EraManager owns the era state machine (UNLOADED/LOADING/LOADED/ACTIVE/ARCHIVED/FAILED) and the active EraDefinition. Drive via load_era(era_id)/activate_era()/archive_active_era(); read the active era via get_active_era() -> EraDefinition (null if none ACTIVE) or by handling era_loaded(era). Signals: era_loaded(era) [only after the validation gate passes], era_activated(era), era_archived(era), era_load_failed(era_id, reasons). EraDefinition stays a read-only Resource; EraManager never mutates it. Exactly one era ACTIVE at a time; ARCHIVED->ACTIVE forbidden without a fresh LOADING->LOADED cycle."
    write_access: era-lifecycle-only   # only EraManager drives transitions / loads eras; consumers read via signal or get_active_era()
    referenced_by:
      - docs/architecture/adr-0004-era-lifecycle-init-ordering.md
      - docs/architecture/adr-0003-save-persistence-serialization.md   # boot: SaveService.request_load() supplies era_id; per-era persisted state applied on era_loaded
    added: 2026-08-21
    revised: ""

