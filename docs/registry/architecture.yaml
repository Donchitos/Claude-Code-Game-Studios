# ─── PERFORMANCE BUDGETS ──────────────────────────────────────────────────────
# Frame time allocations per system, against a defined total frame budget.
# Conflicts: allocations that sum to more than the total budget = unshippable.
#
# Register a budget when an ADR explicitly claims a frame time allocation.
# The registry lets /architecture-review verify the total doesn't exceed the target.

performance_budgets:
  - system: flame_canvas_rendering
    status: active
    budget_draw_calls: 200
    platform: Mobile   # iOS + Android
    adr: docs/architecture/adr-0001-draw-call-budget-scope.md
    notes: "Applies ONLY to Flame-canvas rendering (renderable components — SpriteComponent
      etc. — post-SpriteBatch). Does NOT include Flutter widget compositing (GameWidget
      overlays, bottom sheets, app bars) — that is governed separately by frame
      build/raster time, held to the same 16.6ms/frame budget but NOT summed into
      this draw-call count. See api_decisions and forbidden_patterns entries below."
    referenced_by:
      - docs/architecture/adr-0001-draw-call-budget-scope.md
      - design/gdd/pet-room-screen-ui.md   # Formula 1, drawCalls_sceneFlame = 5
    added: 2026-07-07
    revised: ""

