# Architecture Decision Registry
#
# PURPOSE: Single source of truth for key architectural stances that all ADRs
# must agree on. Skills check this before writing new ADRs to detect conflicts
# at authoring time — before stories are created against contradictory decisions.
#
# RULES:
#   - Register a stance when it constrains how OTHER systems must be built.
#     An internal implementation detail that affects only one ADR does not need
#     to be registered.
#   - Never delete entries — set status: superseded_by: ADR-NNNN instead.
#   - When a stance changes: update the entry, set revised: to today's date,
#     add a comment with the old value, and run /architecture-review to check
#     what ADRs are now invalidated.
#   - adr: is the authoritative source. All other ADRs that depend on this
#     stance list themselves in referenced_by.
#
# WRITTEN BY: /architecture-decision (Phase 5 — after ADR is approved)
# READ BY:    /architecture-decision (Step 2 — before authoring begins)
#             /architecture-review (Phase 4 — cross-ADR conflict baseline)
#             /create-stories (to embed architectural constraints in stories)
#             /dev-story (to check implementation against accepted stances)
#
# SEARCH PATTERNS (for skills using Grep):
#   All state owners:       Grep pattern="^  - state:" path="docs/registry/architecture.yaml"
#   Who owns player_health: Grep pattern="state: player_health"
#   All signal contracts:   Grep pattern="pattern: signal"
#   Budget for combat:      Grep pattern="system: combat"
#   All forbidden patterns: Grep pattern="^  - pattern:" (forbidden_patterns section)
#   Superseded entries:     Grep pattern="status: superseded"

version: 1
last_updated: "2026-07-11"

# ─── STATE OWNERSHIP ─────────────────────────────────────────────────────────
# Who is the authoritative owner of each piece of shared game state.
# Conflicts: two ADRs claiming to own the same state = data race / authority bug.
#
# Register state when it is READ or WRITTEN by more than one system.
# Internal-only state (never accessed by another system) does not need to be registered.
#
# Required fields: state, owner_system, adr, interface, referenced_by[], added
# interface: how other systems access this state (read-only property, method call,
#   signal, shared resource, etc.) — this is the contract other ADRs depend on.

state_ownership: []

# Example:
#
# state_ownership:
#   - state: player_health
#     status: active           # active | superseded_by: ADR-NNNN
#     owner_system: health-system
#     adr: docs/architecture/adr-0001-health-system.md
#     interface: "HealthComponent.current_health (read-only float, range 0–max_health)"
#     write_access: health-system-only   # only owner can write; others read
#     referenced_by:
#       - docs/architecture/adr-0001-health-system.md
#       - docs/architecture/adr-0003-combat-system.md   # reads to apply damage
#       - docs/architecture/adr-0007-ui-system.md       # reads to display HUD
#     added: 2026-03-26
#     revised: ""


# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: resource_item_database_ready
    status: active
    pattern: signal
    producer: resource-item-database (Autoload)
    consumers:
      - GameWorld (Scene/World Management's World Root — gates injected-tier setup())
    adr: docs/architecture/adr-0005-boot-sequencing-initialization-gate.md
    signal_signature: "validation_complete(result: ValidationResult)  # result.success: bool, result.issues: Array[ValidationIssue]"
    referenced_by:
      - docs/architecture/adr-0005-boot-sequencing-initialization-gate.md
    added: 2026-07-11
    revised: ""

  - contract: walkability_predicates
    status: active
    pattern: direct_call
    producer: villager-ai (is_standable, is_step_legal — pure functions)
    consumers:
      - villager-ai (its own AStar3D-based pathfinding)
      - build-validation-navigability (its own independent BFS)
    adr: docs/architecture/adr-0007-ai-pathfinding-navigation-room-analysis.md
    signal_signature: "is_standable(cell: Vector3i) -> bool ; is_step_legal(from_cell: Vector3i, to_cell: Vector3i) -> bool"
    referenced_by:
      - docs/architecture/adr-0007-ai-pathfinding-navigation-room-analysis.md
    added: 2026-07-11
    revised: ""

  - contract: voxel_write_repath_ordering
    status: active
    pattern: signal
    producer: voxel-world (cell_changed / cells_changed_batch)
    consumers:
      - villager-ai (re-path filter — must be a DIRECT, non-deferred connection so it fires synchronously, same call stack as the write)
    adr: docs/architecture/adr-0009-deterministic-movement-occupancy-ordering.md
    signal_signature: "cell_changed(cell: Vector3i, before: CellData, after: CellData)"
    referenced_by:
      - docs/architecture/adr-0009-deterministic-movement-occupancy-ordering.md
    added: 2026-07-11
    revised: ""

  - contract: hover_suppression_flag
    status: active
    pattern: direct_call
    producer: building-ui (is_hover_suppressing_world_pick, event-driven via mouse_entered/exited)
    consumers:
      - building-system (before starting a new pick/drag)
      - villager-info-ui (before a new select/deselect)
    adr: docs/architecture/adr-0010-cross-system-ui-world-input-arbitration.md
    signal_signature: "is_hover_suppressing_world_pick() -> bool"
    referenced_by:
      - docs/architecture/adr-0010-cross-system-ui-world-input-arbitration.md
    added: 2026-07-11
    revised: ""

  - purpose: ui_timer_management
    status: active
    api: "Centralized expiry-timestamp manager: Dictionary[key, TimerRecord] + one shared _process(delta) loop, gated by a single _suspended boolean"
    not: "N per-issue Godot Timer nodes (one per active toast/warning/debounce subject)"
    adr: docs/architecture/adr-0011-ui-timer-expiry-management-pattern.md
    reason: "Zero per-timer Node-lifecycle overhead at potentially-dozens-of-subjects scale; direct consistency with Time & Tick System's own 'no per-consumer timers anywhere' precedent. Note: both approaches achieve equally exact pause fidelity (Timer.paused natively preserves time_left) — the choice is about overhead/consistency, not pause correctness."
    referenced_by:
      - docs/architecture/adr-0011-ui-timer-expiry-management-pattern.md
    added: 2026-07-11
    revised: ""

  - purpose: save_load_file_format
    status: active
    api: "Plain Dictionary serialized via FileAccess.store_var()/get_var() to a single binary file"
    not: "Custom Resource-derived class saved via ResourceSaver/ResourceLoader (ADR-0002/0006's pattern for a DIFFERENT data category — authored/designer-edited config and item data, not runtime save state)"
    adr: docs/architecture/adr-0012-save-load-serialization-strategy.md
    reason: "Save data is never designer-authored, Inspector-edited, or git-tracked — the Inspector-editability/diff-friendliness rationale that motivated ADR-0002/0006 doesn't apply here; store_var/get_var natively round-trips nested Dictionary/Array/Variant data with far less code"
    referenced_by:
      - docs/architecture/adr-0012-save-load-serialization-strategy.md
    added: 2026-07-11
    revised: ""

  - purpose: save_load_orchestration
    status: active
    api: "Each serializing system exposes serialize() -> Dictionary / deserialize(data: Dictionary) -> void; a Save/Load orchestrator module collects/distributes these under per-system keys, never inspecting contents"
    not: "A central Save/Load module that understands or reaches into any individual system's internal data format"
    adr: docs/architecture/adr-0012-save-load-serialization-strategy.md
    reason: "Honors the 'each system serializes itself' carry-forward directive structurally, not by convention"
    referenced_by:
      - docs/architecture/adr-0012-save-load-serialization-strategy.md
    added: 2026-07-11
    revised: ""

  - purpose: save_load_scale_strategy
    status: active
    api: "No chunking (single monolithic save file); no threading (synchronous save/load) for MVP/VS"
    not: "Spatial chunk partitioning; WorkerThreadPool-based async save"
    adr: docs/architecture/adr-0012-save-load-serialization-strategy.md
    reason: "World is bounded (ADR-0014 large world: packed-chunk payload ~150-250 MB worst case, re-measure at VS; chunked/async saves remain the named escape hatch); saves are transition-triggered so any brief synchronous cost hides behind the already-visible loading overlay. Both named as escape hatches if Full Vision scale later proves otherwise, matching ADR-0003/0008's identical reasoning pattern."
    referenced_by:
      - docs/architecture/adr-0012-save-load-serialization-strategy.md
    added: 2026-07-11
    revised: ""

  - purpose: multi_scene_world_model
    status: active
    api: "Shared World3D for Valley + Dungeon, with Dungeon content instantiated at a large fixed spatial offset (e.g. Vector3(100_000, 0, 0)) from Valley's origin"
    not: "Separate SubViewports (each with its own World3D) — narrower isolation benefit than assumed, given this project's near-zero physics/NavigationServer3D usage (ADR-0003/0004/0007) and the confirmed-false 'free input isolation' claim"
    adr: docs/architecture/adr-0013-multi-scene-concurrency-model.md
    reason: "No extra Viewport/render-target overhead; this project's already-minimal physics/navigation footprint narrows the isolation gap versus SubViewports to near zero"
    referenced_by:
      - docs/architecture/adr-0013-multi-scene-concurrency-model.md
    added: 2026-07-11
    revised: ""

  - purpose: global_rendering_state_toggle
    status: active
    api: "One persistent WorldEnvironment node with .environment resource swapped per active scene; Camera3D.current, AudioListener3D (make_current()), and each scene's DirectionalLight3D.visible explicitly toggled per active scene"
    not: "Multiple WorldEnvironment nodes relying on Godot's tree-proximity stacking rule; assuming spatial offset alone isolates DirectionalLight3D (it does not — directional lights are not distance-limited)"
    adr: docs/architecture/adr-0013-multi-scene-concurrency-model.md
    reason: "Explicit, unambiguous control over the few genuinely global (non-distance-limited) rendering/audio concerns, rather than relying on implicit engine stacking rules"
    referenced_by:
      - docs/architecture/adr-0013-multi-scene-concurrency-model.md
    added: 2026-07-11
    revised: ""

