# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: auth_providers
    status: active
    pattern: shared_resource   # a single canonical provider module every system imports
    producer: auth-account
    consumers:
      - data-persistence-layer
      - flutter-flame-state-bridge
      - currency-system
      - task-library
      - push-notification
      - main-navigation-shell
      - parent-dashboard-ui
    adr: docs/architecture/adr-0002-auth-pin-security-architecture.md
    signal_signature: "lib/providers/auth_providers.dart exports authStateProvider,
      activeChildProvider, parentOverrideProvider, sessionStateProvider,
      parentProfileProvider, resetChildPin(), verifyChildPin(). Downstream systems
      import these — they MUST NOT define their own auth/session providers."
    referenced_by:
      - docs/architecture/adr-0002-auth-pin-security-architecture.md
      - design/gdd/auth-account.md
    added: 2026-07-07
    revised: ""

  - contract: game_event_bus
    status: active
    pattern: event_bus
    producer: flutter-flame-state-bridge
    consumers:
      - pet-state-machine        # subscribes: petMoodChanged, petInteracted, taskApproved, petLeveledUp
      - seed-buffer              # subscribes: seedReceived
      - pet-equipment            # subscribes: itemEquipped
      - pet-leveling-evolution   # emits (via ref.listen adapter): petLeveledUp
      - pet-room-screen-ui       # subscribes: multiple
      - pet-interaction          # EMITS directly from a Flame component: petInteracted
    adr: docs/architecture/adr-0004-flutter-flame-event-bridge-architecture.md
    signal_signature: "GameEventBus() -> pure-Dart broadcast singleton; GameEvent(GameEventType type, dynamic data);
      GameEventType { petMoodChanged→PetMood, seedReceived→SeedData, itemEquipped→String,
      energyChanged→double, petLeveledUp→int, petInteracted→InteractionType, taskApproved→null }.
      Two sanctioned adapters: (a) ref.listen in ConsumerWidget → emit(); (b) Flame component emit()
      direct (#14 only, Flame→Bus→Flame). Subscribers MUST subscribe in onMount(), guard with isMounted,
      cancel() in onRemove(). One-way only: never Flame→Flutter."
    referenced_by:
      - docs/architecture/adr-0004-flutter-flame-event-bridge-architecture.md
      - design/gdd/flutter-flame-state-bridge.md
    added: 2026-07-07
    revised: ""

  - contract: fcm_notification_payload
    status: active
    pattern: rpc   # server → device push message with a machine-readable data block
    producer: push-notification
    consumers:
      - parent-dashboard-ui   # foreground onMessage banner
      - main-navigation-shell # deep-link routing + OS scheme registration
    adr: docs/architecture/adr-0010-push-notification-delivery-architecture.md
    signal_signature: "FCM message: notification{title,body} + data{ type:'task_submitted', taskId,
      childId, deepLink:'petquest://parent/tasks/pending' } (all data values STRINGS) +
      android.priority:'high' + apns.headers['apns-priority']:'10'. Deep-link URI scheme owned here;
      go_router route resolution owned by Nav Shell #17."
    referenced_by:
      - docs/architecture/adr-0010-push-notification-delivery-architecture.md
      - design/gdd/push-notification.md
    added: 2026-07-08
    revised: ""

  - contract: purchase_animation_complete
    status: active
    pattern: direct_call   # plain Dart callback, not an event bus — no Flame component involved
    producer: shop-system
    consumers:
      - shop-reward-ui   # navLocked guard (Formula 1) unlocks + auto-navigates on this callback
    adr: docs/architecture/adr-0011-shop-purchase-pipeline-idempotency-fix.md
    signal_signature: "typedef PurchaseAnimationCompleteCallback = void Function(); exposed as
      PaidChestCard.onAnimationComplete. Fired exactly once, only on a fresh
      PurchaseResult.success (never on alreadyProcessed/insufficientFunds/failure), from the
      local AnimationController's forward().whenComplete(...) AFTER the purchase transaction
      has already committed. Paid Chest path only — regular item purchases have no ceremony
      handoff and do not use this callback."
    referenced_by:
      - docs/architecture/adr-0011-shop-purchase-pipeline-idempotency-fix.md
      - design/gdd/shop-system.md
      - design/gdd/shop-reward-ui.md
    added: 2026-07-11
    revised: ""

  - contract: router_provider
    status: active
    pattern: shared_resource   # single root GoRouter instance every screen renders inside
    producer: main-navigation-shell
    consumers:
      - pet-room-screen-ui       # hosted at /child/pet-room, no epic yet
      - task-management-ui       # hosted at /child/tasks (+ /child/tasks/new), no epic yet
      - shop-reward-ui           # hosted at /child/shop, no epic yet
      - parent-dashboard-ui      # hosted at /parent/dashboard + /parent/family
    adr: docs/architecture/adr-0014-navigation-shell-route-guard-architecture.md
    signal_signature: "lib/providers/router_provider.dart exports routerProvider (Provider<GoRouter>)
      and AppRoutes path constants. Root redirect implements the 4-state sessionStateProvider guard
      (unauthenticated/parentAuthed/childSelected/parentView) — READS sessionStateProvider only,
      never re-derives it (see session_state's write_access: auth-account-only above). Two separate
      StatefulShellRoute trees: Child (3 branches: pet-room/tasks/shop) and Parent (2 branches:
      dashboard/family). Downstream screens register their content as a route builder inside the
      relevant branch — they do not define their own top-level routes or redirect logic."
    referenced_by:
      - docs/architecture/adr-0014-navigation-shell-route-guard-architecture.md
      - design/gdd/main-navigation-shell.md
    added: 2026-07-18
    revised: ""

