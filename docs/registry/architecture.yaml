# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: export_injected_autoload
    status: active
    description: "Injecting ResourceItemDatabase or TimeTickSystem via an @export property. These are called by their global Autoload name directly in method bodies, everywhere, with no injection layer."
    why: "A partial exemption (sometimes injected, sometimes global) creates a dual-access-path bug risk — a future contributor could reach the same service two different ways with different mocking behavior."
    adr: docs/architecture/adr-0001-inter-system-reference-dependency-injection-pattern.md
    added: 2026-07-11

  - pattern: ready_order_dependent_injection
    status: active
    description: "Reading an @export-injected dependency inside a module's own _ready() under the assumption another script (e.g. GameWorld) assigned it there."
    why: "Godot resolves the scene tree bottom-up — children's _ready() runs BEFORE their parent's — so code-assigned wiring in a parent's _ready() has not happened yet when a child's _ready() reads it. Scene-file-assigned exports are safe (resolved at deserialization); code-assigned wiring is not. Use an explicit setup() call instead."
    adr: docs/architecture/adr-0001-inter-system-reference-dependency-injection-pattern.md
    added: 2026-07-11

  - pattern: config_runtime_mutation
    status: active
    description: "Writing to a field on an injected/loaded config Resource at runtime, from any module, for any reason."
    why: "load()/preload() return Godot's ResourceLoader-cached, shared instance for as long as a strong reference is alive — a mutation by one holder is silently visible to every other holder of that same Resource, project-wide. Config must be read-only after boot-time validate()/clamp. A runtime-adjustable value needs its own explicitly-owned, non-shared state instead."
    adr: docs/architecture/adr-0002-tuning-config-data-strategy.md
    added: 2026-07-11

  - pattern: binary_config_resource
    status: active
    description: "Saving a tuning-config Resource as .res (binary) instead of .tres (text)."
    why: "Config data must stay git-diff-friendly for designer/tuner iteration; binary resources are opaque in diffs. Godot's export pipeline converts .tres to binary inside the built .pck automatically — that's expected and not a violation of this rule, which applies to source-controlled files."
    adr: docs/architecture/adr-0002-tuning-config-data-strategy.md
    added: 2026-07-11

  - pattern: gridmap_collision_reliance
    status: active
    description: "Any gameplay system depending on GridMap-generated physics collision against voxel blocks (raycasts, CharacterBody3D movement, Area3D overlap detection, etc.)."
    why: "GridMap's use_collision is explicitly disabled (ADR-0003) — nothing needs it, and relying on it would silently break since no collider exists. Villager movement is cell-based interpolation, not physics; block picking uses manual DDA against the data layer, not physics raycasts."
    adr: docs/architecture/adr-0003-voxel-world-rendering-approach.md
    added: 2026-07-11

  - pattern: injected_tier_setup_outside_boot_gate
    status: active
    description: "Calling any injected-tier module's setup() from anywhere other than GameWorld's boot-gate resolution path (i.e., before ResourceItemDatabase reports Ready, or from a location other than the single WIRING-state loop)."
    why: "The unified boot gate (ADR-0005) exists specifically to guarantee no module runs its setup logic before RID is ready. A second, uncontrolled setup() call site would bypass that guarantee silently."
    adr: docs/architecture/adr-0005-boot-sequencing-initialization-gate.md
    added: 2026-07-11

  - pattern: exposed_item_definition_resource
    status: active
    description: "Resource & Item Database returning its internal ItemDefinitionResource directly from any public method, instead of the getter-only ItemDefinition wrapper."
    why: "The immutability guarantee (ADR-0006) depends entirely on callers only ever holding the getter-only wrapper, never the underlying settable Resource. Exposing the internal type anywhere breaks the guarantee for every consumer, not just the call site that leaked it."
    adr: docs/architecture/adr-0006-data-definition-immutability-reference-format.md
    added: 2026-07-11

  - pattern: villager_ai_threading
    status: active
    description: "Using Thread or WorkerThreadPool anywhere in Villager AI's implementation for MVP/VS."
    why: "ADR-0008 explicitly rejected threading as premature — tick-staggering alone is expected sufficient at the 20-30 villager ceiling, and retrofitting thread-safety onto Voxel World's occupancy dict / AStar3D's graph / Needs & Mood's per-villager state is a real, avoidable complexity cost. WorkerThreadPool remains a named escape hatch only if the pre-VS spike proves staggering insufficient — not adopted now."
    adr: docs/architecture/adr-0008-villager-ai-execution-threading-strategy.md
    added: 2026-07-11

  - pattern: visual_position_as_logic_source
    status: active
    description: "Reading a villager's continuous _visual_position (or any interpolation-progress value) for an occupancy, targeting, or walled-in logic decision."
    why: "ADR-0009's whole resolution depends on every logic consumer reading the discrete current_cell, never the cosmetic interpolated position. A single stray read would reintroduce the exact ambiguity the ADR closed."
    adr: docs/architecture/adr-0009-deterministic-movement-occupancy-ordering.md
    added: 2026-07-11

  - pattern: per_issue_timer_nodes
    status: active
    description: "Instantiating a new Godot Timer node per active toast/warning/debounce subject in Building UI."
    why: "ADR-0011 chose a centralized expiry-timestamp manager specifically to avoid per-instance Node-lifecycle overhead at potentially-dozens-of-subjects scale, and to stay consistent with Time & Tick System's own no-per-consumer-timers precedent."
    adr: docs/architecture/adr-0011-ui-timer-expiry-management-pattern.md
    added: 2026-07-11

  - pattern: multiple_world_environment_nodes
    status: active
    description: "Adding a second (or more) WorldEnvironment node to the project instead of swapping a single persistent node's .environment resource."
    why: "Godot's rule for resolving which WorldEnvironment wins when more than one exists in a scene is a real footgun (tree-proximity/stacking-priority based, not simply 'first found') — confirmed during ADR-0013's engine validation. Swapping one node's resource sidesteps needing to reason about that rule entirely."
    adr: docs/architecture/adr-0013-multi-scene-concurrency-model.md
    added: 2026-07-11

