  - state: pet_level
    status: active
    owner_system: parent-approval   # INTERIM — see total_xu_earned above; same ordering rationale
    adr: docs/architecture/adr-0013-parent-approval-transaction-architecture.md
    interface: "children/{childId}.petLevel (1-5) + the denormalized children/{childId}.nextLevelThreshold
      cache field (ADR-0003 schema), kept in sync in the SAME write as petLevel — null at max level (5).
      Written only inside ParentApprovalRepository.approveTask()'s runTransaction, via
      FieldValue.increment(1) when leveledUp. nextLevelThreshold(currentLevel) is a pure lookup function
