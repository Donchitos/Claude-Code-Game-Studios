; Versioned copy: append as a free preset index to local export_presets.cfg.
; Do not overwrite existing platform settings or signing identities.
[preset.1]
name="Windows Internal"
platform="Windows Desktop"
runnable=false
advanced_options=false
dedicated_server=false
custom_features="internal_playtest"
export_filter="all_resources"
include_filter="assets/config/*.json,assets/fonts/OFL.txt"
exclude_filter="tests/*,production/*,design/*,docs/*,prototypes/*,.claude/*,*.md"
export_path="build/windows-internal/TrialInternal.exe"
script_export_mode=2

[preset.1.options]
custom_template/debug=""
custom_template/release=""
binary_format/architecture="x86_64"
binary_format/embed_pck=false
codesign/enable=false
application/file_version="0.1.0.0"
application/product_version="0.1.0.0"
application/product_name="Internal Playtest"
