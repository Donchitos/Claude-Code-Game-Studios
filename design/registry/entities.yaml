    status: active
    source: design/gdd/scene-world-management.md
    referenced_by:
      - design/gdd/scene-world-management.md
    value: 1.2
    unit: seconds
    added: 2026-07-09
    revised: ""

  - name: cell_size
    status: active
    source: design/gdd/voxel-world.md
    referenced_by:
      - design/gdd/voxel-world.md
      - design/art/visual-direction-note.md   # §2b locks flush blocks, no gap
      - design/gdd/camera-input.md            # pan-bound clamp uses world extent × cell_size
      - design/gdd/building-system.md         # flush-block rendering requirement
    value: 1.0
    unit: world units (cell edge length)
    added: 2026-07-09
    revised: ""

  - name: ticks_per_second
    status: active
    source: design/gdd/time-tick-system.md
    referenced_by:
      - design/gdd/time-tick-system.md
      - design/gdd/building-system.md        # F3 build-tick pacing
      - design/gdd/needs-mood-system.md      # decay/recovery per tick
      - design/gdd/villager-ai-behavior.md   # agent loop tick base
    value: 4.0
    unit: ticks/second (base rate at 1x time-warp)
    # was: 2.0 before 2026-07-23 — raised by time-tick-system.md
    # (Slice revision 2026-07-23, tick-rate/furniture resolution): the
    # vertical slice ran at 4.0 throughout; user adopted that pace
    # ("villagers should work more"). Required re-tuning pass flagged in
    # that GDD's Open Questions for any downstream per-tick rate consumer
    # (e.g. Needs & Mood System decay/recovery) documented as a real-time
    # equivalent under the old 2.0 rate.
    added: 2026-07-09
    revised: "2026-07-23"

  - name: max_ticks_per_frame
    status: active
    source: design/gdd/time-tick-system.md
    referenced_by:
      - design/gdd/time-tick-system.md
      - design/gdd/building-system.md        # F3 burst rule
      - design/gdd/needs-mood-system.md      # signal-ordering burst rule
      - design/gdd/villager-ai-behavior.md   # per-villager burst handling
    value: 12
    unit: ticks
    # Sprint 8 coordinated re-tune (10->12), story tick-007:
