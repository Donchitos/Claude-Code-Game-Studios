# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  - name: projectile_swept_query_radius
    status: active
    source: design/gdd/spatial-grid.md
    referenced_by:
      - design/gdd/spatial-grid.md
      - design/gdd/config-data-system.md
      - design/gdd/projectile-system.md
    variables:
      - segment_length
      - midpoint_cast_error
      - projectile_bound
      - max_enemy_bound
      - target_motion_bound
    output_range: [0, .inf]
    expression: "checked_sum(checked_mul(0.5, segment_length), midpoint_cast_error, projectile_bound, max_enemy_bound, target_motion_bound)"
    notes: "全部输入与每步加法必须 checked finite。segment_length 与
      midpoint_cast_error 使用 spatial-grid.md 的 float64 scalar canonical
      distance helper；中点先以四个 float64 分量计算，再 cast/readback Vector2。
      MVP target sampling 固定为 tick-end discrete committed snapshot，故
      target_motion_bound=0；这不构成 continuous relative-sweep 保证。"
    added: 2026-08-19
    revised: 2026-08-19

  - name: max_query_radius
    status: active
    source: design/gdd/spatial-grid.md
    referenced_by:
      - design/gdd/spatial-grid.md
      - design/gdd/config-data-system.md
      - design/gdd/enemy-system.md
      - design/gdd/projectile-system.md
      - design/gdd/weapon-system.md
      - design/gdd/drop-leveling-system.md
      # 待回填：最终 SkillConfig
    variables:
      - pickup_radius_max
      - target_range_max
      - max_skill_effect_radius
      - max_enemy_bound
      - separation_radius
      - max_separation_radius
      - max_projectile_segment_length
      - max_midpoint_cast_error
      - max_projectile_bound
      - max_target_motion_bound
    output_range: [0, .inf]
    expression: "checked_max(pickup_radius_max, target_range_max, checked_add(max_skill_effect_radius, max_enemy_bound), checked_sum(target_range_max, max_skill_effect_radius, max_enemy_bound), checked_add(separation_radius, max_separation_radius), checked_sum(checked_mul(0.5, max_projectile_segment_length), max_midpoint_cast_error, max_projectile_bound, max_enemy_bound, max_target_motion_bound), ...)"
    notes: "所有依赖 SpatialGrid 查询接口的系统实际传入宽相半径的全集上界，
      必须包含 target conservative bound 与 projectile swept segment expansion。
      Projectile 项不得遗漏 max_midpoint_cast_error 或数值为 0 的
      max_target_motion_bound 语义字段；MVP 分别固定为 sqrt(2)/32 与 0。
      用于配置审计、CELL_SIZE benchmark 候选和 workload 规划，不是合法查询
      半径上限；radius 大于 CELL_SIZE 仍须正确扫描，禁止 release clamp。
      当前 pickup_radius_base=1.8、pickup_radius_max=1.98、
      max_midpoint_cast_error=sqrt(2)/32、max_target_motion_bound=0 已冻结；
      target range、skill radius、projectile segment/bound 待对应 GDD；
      enemy/separation bound 由 EnemySystem GDD §4.6 定义上界（per-type 在
      Config，数值待调参）。输入变化时重跑 F3 sweep，
      不能未经 benchmark 直接令 CELL_SIZE=max_query_radius。"
    added: 2026-08-14
    revised: 2026-08-28

  - name: index_margin_lower_bound
    status: deprecated
    source: design/gdd/stage-map.md
    referenced_by:
      - design/gdd/spatial-grid.md
      - design/gdd/enemy-system.md
      - design/gdd/player-controller.md
    variables:
      - player_overshoot
      - enemy_overshoot_max
      - elite_charge_overshoot
      - knockback_max
      - max_enemy_bound
    output_range: [0, .inf]
    expression: "checked_add(player_overshoot, max(enemy_overshoot_max, elite_charge_overshoot), knockback_max, max_enemy_bound)"
    notes: "DEPRECATED 2026-09-02：Stage V2删除固定arena/index_margin；禁止production consumer使用。由world_reachability_budget替代。"
    added: 2026-08-19
    revised: 2026-09-02

  - name: world_reachability_budget
    status: active
    source: design/gdd/stage-map.md
    referenced_by:
      - design/gdd/stage-map.md
      - design/gdd/spatial-grid.md
      - design/gdd/enemy-system.md
      - design/gdd/player-controller.md
    variables:
      - max_battle_duration_seconds
      - player_speed
      - max_relative_runtime_extent
      - world_precision_guard
    output_range: [0, .inf]
    expression: "checked_sum(player_speed*max_battle_duration_seconds, max_relative_runtime_extent, world_precision_guard)"
    notes: "Stage V2 Loading期保守可达包络；必须小于等于world_safe_half_extent。
      这是防止有限技术域在1800秒技术时限内可见的证明输入，不是运行时边界、
      clamp预算或地图尺寸。更精确的运动积分证明可收紧该上界，但不得降低安全性。"
    added: 2026-08-19
    revised: 2026-09-02

  - name: world_precision_guard
    status: active
    source: design/gdd/stage-map.md
    referenced_by:
      - design/gdd/config-data-system.md
      - design/gdd/player-controller.md
      - design/gdd/drop-leveling-system.md
      - design/gdd/spatial-grid.md
    variables:
      - world_safe_half_extent
      - max_full_footprint_radius
      - max_single_tick_displacement
    output_range: [0, .inf]
    expression: "checked_sum(max_full_footprint_radius, max_single_tick_displacement, 4*ulp_real_t32(world_safe_half_extent))"
    notes: "技术域边缘的足迹、单tick位移与binary32量化冗余；不是玩法margin。"
    added: 2026-09-02
    revised: ""

  - name: required_pool_capacity
    status: active
    source: design/gdd/object-pooling.md
    referenced_by:
      - design/gdd/object-pooling.md
      - design/gdd/config-data-system.md
      - design/gdd/risk-choice-system.md
    variables:
      - max_concurrent_borrowed
      - max_pause_replacement_overlap
      - max_spawn_before_release_overlap
      - safety_spare
    output_range: [0, 512]
    expression: "checked_sum(max_concurrent_borrowed, max_pause_replacement_overlap, max_spawn_before_release_overlap, safety_spare)"
    notes: "Config schema v1的六key输出依次为320/6/1/448/320/96；
      configured_capacity必须等于或高于required且不得超过per-key硬上限512。
      RiskChoice裁决后的normal输入为298+0+12+10=320，elite为4+0+1+1=6；
      两fixed+两risk Elite的4 active由max_concurrent真实覆盖，不再借safety spare。"
    added: 2026-08-19
    revised: 2026-09-03

  - name: fixed_gameplay_dt
    status: active
    source: design/gdd/game-root-scene-flow.md
    referenced_by:
      - design/gdd/game-root-scene-flow.md
      - design/gdd/config-data-system.md
      - design/gdd/enemy-system.md
      - design/gdd/player-controller.md
    variables:
      - physics_ticks_per_second
    output_range: [0.016666666666666666, 0.016666666666666666]
    expression: "1.0 / physics_ticks_per_second"
    notes: "MVP physics_ticks_per_second 固定60；gameplay只消费1/60或PAUSE_PENDING技术drain的0.0，callback delta仅验证cadence。"
    added: 2026-08-28
    revised: 2026-08-28

  - name: fixed_movement_step
    status: active
    source: design/gdd/player-controller.md
    referenced_by:
      - design/gdd/player-controller.md
      - design/gdd/input-system.md
      # DropSystem、Weapon/TargetingSystem GDD 创建后追加其路径
    variables:
      - physics_ticks_per_second
      - player_speed
      - movement_direction
      - movement_active
    output_range: [0.0, 0.075000075]
    expression: "fixed_dt=1.0/physics_ticks_per_second; velocity_f64=movement_active?promote(direction_real_t32)*player_speed:(0,0); desired_displacement=readback_real_t32(Vector2(velocity_f64*fixed_dt))"
    notes: "output_range为单tick期望位移模长；ZERO为0，非ZERO包含Input单位向量容差。运算顺序固定为float64 velocity→乘预计算dt→Vector2构造/readback；Player不得再次归一化；最终committed位置须经过full_footprint_domain_guard。"
    added: 2026-09-01
    revised: 2026-09-02

  - name: full_footprint_clamp
    status: deprecated
    source: design/gdd/player-controller.md
    referenced_by:
      - design/gdd/stage-map.md
    variables:
      - arena_width
      - arena_height
      - player_collision_diameter
      - previous_position
      - desired_displacement
    output_range: [-20.0, 20.0]
    expression: "legacy arena clamp"
    notes: "DEPRECATED 2026-09-02：固定arena clamp已删除；禁止production consumer调用。由full_footprint_domain_guard替代。"
    added: 2026-09-01
    revised: 2026-09-02

  - name: full_footprint_domain_guard
    status: active
    source: design/gdd/player-controller.md
    referenced_by:
      - design/gdd/player-controller.md
      - design/gdd/stage-map.md
    variables:
      - world_safe_half_extent
      - player_collision_diameter
      - previous_position
      - desired_displacement
    output_range: [-16384.0, 16384.0]
    expression: "candidate=readback_real_t32(Vector2(promote(previous_position)+promote(desired_displacement))); require(abs(candidate.x)+player_radius<=world_safe_half_extent && abs(candidate.y)+player_radius<=world_safe_half_extent); candidate"
    notes: "只验证完整碰撞足迹位于world safe domain并原样返回candidate，不做clamp、wrap或origin rebasing。Loading期reachability proof应令正常战斗永不触发；触发即ControlledGameplayFault。"
    added: 2026-09-01
    revised: 2026-09-02

  - name: hp_application
    status: active
    source: design/gdd/player-controller.md
    referenced_by:
      - design/gdd/player-controller.md
      - design/gdd/damage-system.md
      - design/gdd/battle-ui.md
    variables:
      - current_hp
      - max_hp
      - final_damage
    output_range: [0.0, 1000000.0]
    expression: "final_damage >= current_hp ? 0.0 : current_hp - final_damage"
    notes: "输出为hp_after_damage；applied_damage=min(final_damage,current_hp)，不记录overkill。正伤害若相减后HP逐bit不变则拒绝，不引入隐藏最小伤害。"
    added: 2026-09-01
    revised: ""

  - name: player_resolved_starting_max_hp
    status: active
    source: design/gdd/player-controller.md
    referenced_by:
      - design/gdd/player-controller.md
      - design/gdd/config-data-system.md
      - design/gdd/damage-system.md
      - design/gdd/battle-ui.md
      # Progression、Preparation GDD 创建后追加其路径
    variables:
      - player_base_max_hp
      - player_progression_max_hp_bonus_ratio
      - player_preparation_max_hp_bonus_ratio
    output_range: [1.0, 1000000.0]
    expression: "player_base_max_hp * (1.0 + player_progression_max_hp_bonus_ratio + player_preparation_max_hp_bonus_ratio)"
    notes: "Config在BATTLE_LOADING以float64 checked finite计算并冻结；Player初始化时同时赋给max_hp/current_hp，Active不重算或热改。"
    added: 2026-09-02
    revised: ""

  - name: player_recovery_application
    status: active
    source: design/gdd/player-controller.md
    referenced_by:
      - design/gdd/player-controller.md
      - design/gdd/game-root-scene-flow.md
      - design/gdd/damage-system.md
      - design/gdd/risk-choice-system.md
      - design/gdd/battle-ui.md
    variables:
      - hp_after_damage
      - max_hp
      - final_recovery
      - lethal
    output_range: [0.0, 1000000.0]
    expression: "lethal ? hp_after_damage : hp_after_damage + min(final_recovery, max_hp - hp_after_damage)"
    notes: "固定damage后、lethal判定后执行；致命同tick恢复抑制且不结转，只有实际恢复量大于0才提交HEAL fact。"
    added: 2026-09-02
    revised: ""

