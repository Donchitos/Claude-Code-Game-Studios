# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  - name: procedural_terrain_height
    status: active
    source: design/gdd/voxel-world.md
    referenced_by:
      - design/gdd/voxel-world.md
    variables:
      - x
      - z
      - base_height
      - amplitude
      - frequency
      - noise2D
      - min_y
      - max_y
    output_range: [0, 16]   # = current min_y/max_y tuning knobs; revise if those change
                            # was: [0, 15] before 2026-07-09 — corrected by /consistency-check
                            # (source GDD voxel-world.md Tuning Knobs: max_y = 16)
    expression: "clamp(round(base_height + amplitude * noise2D(x * frequency, z * frequency)), min_y, max_y)"
    notes: "Defines only the height mechanism, not the 'hand-shaped valley'
      silhouette (basin/radial falloff) — that's an open question owned by
      level-designer/art-director. Output range moves if min_y/max_y tuning
      knobs change."
    added: 2026-07-09
    revised: "2026-07-09"

