# ─── CONSTANTS ───────────────────────────────────────────────────────────────
# Named numerical values referenced across multiple systems.
# Register a constant when it is defined in one GDD but another GDD must
# agree with it (e.g., gold carry limit defined in economy but checked in
# inventory, or base inventory slots defined in inventory but displayed in HUD).
#
# Required fields: name, status, source, referenced_by, value, unit, added

constants:
  - name: world_unit_scale
    status: active
    source: design/gdd/datos-de-era-civilizacion.md
    referenced_by:
      - design/gdd/datos-de-era-civilizacion.md
      - design/gdd/input.md
      - design/gdd/control-y-seleccion-de-unidades.md
      - design/gdd/ui-hud.md      # world_to_screen_transform (F2) lo usa para proyectar overlays anclados a mundo
    value: 48
    unit: px_per_world_unit
    added: 2026-07-23
    revised: ""

  - name: camera_pan_speed
    status: active
    source: design/gdd/datos-de-era-civilizacion.md
    referenced_by:
      - design/gdd/datos-de-era-civilizacion.md
      - design/gdd/input.md
      - design/gdd/control-y-seleccion-de-unidades.md
    value: 30
    unit: world_units_per_sec
    added: 2026-07-23
    revised: ""
    # Nota: control-y-seleccion-de-unidades.md aplica compensación por zoom
    # (effective_pan_speed = camera_pan_speed × zoom, Fórmula 4). El valor base 30 (a zoom 1.0) no cambia.

  - name: zoom_min
    status: active
    source: design/gdd/datos-de-era-civilizacion.md
    referenced_by:
      - design/gdd/datos-de-era-civilizacion.md
      - design/gdd/input.md
      - design/gdd/control-y-seleccion-de-unidades.md
      - design/gdd/ui-hud.md      # world_to_screen_transform (F2) opera con zoom en [zoom_min, zoom_max]
    value: 0.5
    unit: zoom_multiplier
    added: 2026-07-23
    revised: ""

  - name: zoom_max
    status: active
    source: design/gdd/datos-de-era-civilizacion.md
    referenced_by:
      - design/gdd/datos-de-era-civilizacion.md
      - design/gdd/input.md
      - design/gdd/control-y-seleccion-de-unidades.md
      - design/gdd/ui-hud.md      # world_to_screen_transform (F2) opera con zoom en [zoom_min, zoom_max]
    value: 1.5
    unit: zoom_multiplier
    added: 2026-07-23
    revised: ""

  - name: reinforcement_ratio
    status: active
    source: design/gdd/sistema-de-tropas.md
    referenced_by:
      - design/gdd/sistema-de-tropas.md
    value: 0.25
    unit: fraction
    added: 2026-07-23
    revised: ""
    # Rango tuneable 0.15–0.35. La UI de Preparación (sin GDD) consumirá max_reinforcements derivado de este ratio.

  - name: telegraph_duration_s
    status: active
    source: design/gdd/encuentro-con-kaiju.md
    referenced_by:
      - design/gdd/encuentro-con-kaiju.md
      - design/gdd/ui-hud.md      # telegraph_vignette_intensity (F3) reparte los 3 tercios de la viñeta periférica sobre esta duración
    value: 14.0
    unit: seconds
    added: 2026-08-10
    revised: 2026-08-12          # ui-hud.md añadido a referenced_by (F3 consume la duración para el canal periférico KV-1b)
    # Rango seguro [12.5,17.0]. Mínimo matemático duro: 12.0s exacto (por debajo rompe la garantía de ~30s
    # de Héroes AC-H29 para el héroe de menor TTK crudo — no es solo un valor de feel, ver Encuentro con
    # Kaiju F2/AC-K21/AC-K22). Futuros consumidores esperados: Audio (KA-1) y UI/HUD (KU-1), sin GDD aún.

  - name: guard_radius
    status: active
    source: design/gdd/sistema-de-heroes.md
    referenced_by:
      - design/gdd/sistema-de-heroes.md
      - design/gdd/encuentro-con-kaiju.md   # KV-2 renderiza el radio; una muerte dentro de él satisface P=1 vía defensiva (Regla 5)
      - design/gdd/combate-dano.md          # AC-C32 computa P=1 vía defensiva: muerte dentro de guard_radius de un marked_target
      - design/gdd/ui-hud.md                # renderiza el anillo secundario de guard_radius (Core Rule 9 / HU-7); la runa de suelo la posee Encuentro (KV-2)
    value: 4.0
    unit: world_units
    added: 2026-08-12
    revised: ""
    # Rango seguro 2.5–6.0 (Héroes). Radio alrededor de un objetivo/aliado marcado dentro del cual una
    # muerte lo protege (vía defensiva de P). <2.5: proteger casi imposible; >6.0: estar vagamente cerca
    # ya cuenta. Valor final confirmado con Combate/Kaiju (Héroes OQ-2). Encuentro con Kaiju lo cita como
    # =4.0 (KV-2); Combate lo usa en la clasificación P (AC-C32).

  - name: invocation_charges
    status: active
    source: design/gdd/reliquias-bendiciones.md
    referenced_by:
      - design/gdd/reliquias-bendiciones.md
      # Posibles referenciadores (a confirmar): datos-de-era-civilizacion.md (EraDefinition puede autorar el valor por era, OQ-RB4); ui-hud.md (renderiza cargas restantes, RU-1)
    value: 3
    unit: charges_per_era
    added: 2026-08-16
    revised: ""
    # Rango seguro 2–4. Recurso finito por era (anti-farmeo, Regla 5): invocar gasta 1; se resetea por era, NO se acumula.
    # <2: una sola decisión en un CLIMAX largo. >4: erosiona escasez + carga cognitiva en tiempo real (sin pausa).

  - name: draw_size
    status: active
    source: design/gdd/reliquias-bendiciones.md
    referenced_by:
      - design/gdd/reliquias-bendiciones.md
      # Posibles referenciadores (a confirmar): datos-de-era-civilizacion.md (posible override por era); ui-hud.md (renderiza la oferta 3-choose-1, RU-3)
    value: 3
    unit: relics_per_draw
    added: 2026-08-16
    revised: ""
    # Rango seguro 2–4 (≥1 duro). Sorteo Hades-style: gastar carga → ofrecer draw_size reliquias → elegir 1 (F-RB3).
    # Si P<draw_size se ofrecen las que haya (nunca rellena). 1: no hay elección. >4: demasiadas opciones bajo presión sin pausa.

  - name: pool_cap
    status: active
    source: design/gdd/reliquias-bendiciones.md
    referenced_by:
      - design/gdd/reliquias-bendiciones.md
      # Posibles referenciadores futuros: salon-conmemorativo-panteon.md (#14, sin GDD — exhibe las reliquias retiradas del pool activo por FIFO); datos-de-era-civilizacion.md (posible override)
    value: 16
    unit: relics
    added: 2026-08-16
    revised: ""
    # Rango seguro 10–24. Tope del pool invocable (F-RB5, Rule A): al exceder, la reliquia de menor forge_index se retira a
    # solo-exhibición en Panteón (la RelicRecord NUNCA se borra). Acota el crecimiento del pool entre eras (riesgo ALTO flageado).
    # <10: variedad de sorteo colapsa. >24: reliquias dejan de ser reconocibles/especiales.

  - name: max_band_size
    status: active
    source: design/gdd/datos-de-era-civilizacion.md   # autorado por era en EraDefinition (dueño); NO cuenta héroes
    referenced_by:
      - design/gdd/datos-de-era-civilizacion.md
      - design/gdd/sistema-de-tropas.md         # Fórmula E: enforcement + expone band_headroom = max(0, max_band_size − alive_troop_count); AC-32/33/34
      - design/gdd/reliquias-bendiciones.md      # rally surte min(rally_N, band_headroom), read-only (OQ-RB7, F2-B5)
    value: per-era   # autorado por EraDefinition; sin valor global único. Recom. ~1.5–2× el roster inicial de tropas
    unit: troops
    added: 2026-08-21
    revised: ""
    # Cierra F2-B5 (tope de banda para rally). Tope de TROPAS simultáneas vivas del jugador esta era; ambos grifos
    # (reclutamiento de PREPARATION Fórmula C + rally de CLIMAX de Reliquias) respetan este techo total. Restricción de
    # autoría (loud-fail al cargar EraDefinition, AC-34): max_band_size ≥ Σ starting_count_[tipo] del unit_roster.
    # band_headroom es su salida derivada read-only (Fórmula E), no un knob independiente — no se registra por separado.
    # = roster inicial: rally y reclutamiento siempre no-op. Muy alto: diluye escasez del Pilar 3 + presupuesto de entidades.

