# ─── ITEMS ───────────────────────────────────────────────────────────────────
# Named collectables, equipment, consumables, crafting materials, currency.
# Register an item when its name or value appears in more than one GDD.
#
# Required fields: name, status, source, referenced_by, added
# Attribute fields: value_gold, weight, stackable, category, and any stat
#   modifiers that another system (e.g., economy, crafting) might reference.

items:
  - name: relic_record
    status: active
    source: design/gdd/forja-de-legado.md   # Forja construye y posee la RelicRecord (Regla 3); dueño canónico del dato de reliquia
    referenced_by:
      - design/gdd/forja-de-legado.md
      - design/gdd/reliquias-bendiciones.md      # consumidor real: lee relic_category + tier + identidad (source_hero_name/epitaph/forge_index) para construir el pool de invocación (Regla 1); desbloquea Forja AC-FL19/OQ-FL2
      # Consumidores futuros (sin GDD aún — añadir su path cuando existan):
      #   Salón Conmemorativo/Panteón (#14): lee el registro para exhibición (OQ-FL3, AC-FL20 bloqueado)
      #   Transición de Era (#15): arrastra el registro entre eras
      #   Narrativa Ambiental (#17): consume relic_id vía EraDefinition.legacy_props
      - design/gdd/datos-de-era-civilizacion.md  # EraDefinition.legacy_props referencia los relic_id que Forja asigna (Regla 4)
      - design/gdd/guardado-persistencia.md      # persiste el registro por referencia (IDs + campos), nunca por copia (Guardado Regla 4)
    category: legacy_relic
    fields:                        # estructura de la RelicRecord (Forja Regla 3) — fuente de verdad, no redefinir en otro GDD
      - relic_id                   # estable, único, derivado determinísticamente de forge_index; nunca get_instance_id() (Regla 4, OQ-FL5)
      - source_hero_id             # transportado del veredicto de Permadeath
      - source_hero_name           # transportado
      - relic_category             # offensive | defensive | rally (fijo por héroe, owned por sistema-de-heroes.md)
      - relic_quality              # float [0.10,1.00] exacto, transportado (ver formula relic_quality); NO recalculado
      - tier                       # Delgada | Sólida | Legendaria, derivado vía FL1 de relic_quality (cortes owned por Héroes)
      - origin_era_id              # era ACTIVE al forjar (leído de Datos de Era)
      - forge_index                # int monótono persistido, orden de forja en el legado (FL2); nunca reiniciado entre eras
      - epitaph                    # descriptor de procedencia derivado de relic_category × tier (epitaph_templates); narrativa, no efecto
    notes: "Alcance DELGADO: Forja produce/persiste la RelicRecord pero NO define el efecto de combate (Reliquias/Bendiciones #12) ni la exhibición (Panteón #14). Una muerte de héroe → exactamente una reliquia, nunca cero (anti-nihilismo, Pilar 2, Regla 5), incluso en relic_quality=0.10 (Tier Delgada). Dedup defensivo por (source_hero_id, origin_era_id) (Regla 8). Cierra Permadeath OQ-P3/AC-P16."
    added: 2026-08-16
    revised: ""

