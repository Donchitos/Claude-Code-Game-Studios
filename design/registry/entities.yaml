    status: active
    source: design/gdd/spatial-grid.md
    referenced_by:
      - design/gdd/spatial-grid.md
      - design/gdd/config-data-system.md
      # ProjectileSystem GDD 创建后追加其路径
    value: 0.04419417382415922
    unit: world_units
    added: 2026-08-19
    revised: 2026-08-19
    notes: "sqrt(2)/32；MVP production export 固定 real_t32，且
      abs(world_coordinate)<=1000000。运行时查询使用逐次实际 cast error，
      此值只用于配置全集上界。"

