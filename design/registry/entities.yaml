# Game World Entity Registry
#
# PURPOSE: Single source of truth for all named game-world facts that appear
# in more than one document. Skills check this before writing new content to
# detect cross-doc inconsistencies at authoring time.
#
# RULES:
#   - Only register facts that cross system boundaries. Internal-only facts
#     (a formula used in one GDD only) do NOT need to be registered.
#   - Never delete entries — set status: deprecated instead.
#   - When a value changes: update the value, set revised: to today's date,
#     and add a comment with the old value and which GDD changed it.
#   - source: is the authoritative GDD — the one that "owns" this fact.
#     Other GDDs that reference it list themselves in referenced_by.
#   - When a new GDD references an existing entry, append its path to
#     referenced_by. Do not create a duplicate entry.
#
# WRITTEN BY: /design-system (Phase 5 — after GDD sections are approved)
#             /consistency-check (when resolving conflicts)
# READ BY:    /design-system (Phase 2 — before authoring begins, and after
#               Section C/D writes to conflict-check new entities/formulas)
#             /consistency-check (primary input — grep-first, GDD-second)
#             /review-all-gdds (Phase 1 — baseline for Phase 2 checks)
#             /architecture-review (data structure and interface validation)
#
# SEARCH PATTERNS (for skills using Grep):
#   All entity names:        Grep pattern="^  - name:" path="design/registry/entities.yaml"
#   Specific entity:         Grep pattern="  - name: goblin" path="design/registry/entities.yaml"
#   All items:               Grep pattern="^  - name:" path="design/registry/entities.yaml" (items section)
#   What combat.md owns:     Grep pattern="source: design/gdd/combat.md"
#   What inventory.md uses:  Grep pattern="referenced_by.*inventory"
#   All gold values:          Grep pattern="value_gold:"
#   Deprecated entries:      Grep pattern="status: deprecated"
#
# FORMAT: YAML. Consistent indentation is critical for grep reliability.
#   Sections: entities | items | formulas | constants
#   Each entry: name, status, source, referenced_by[], attributes{}, added, revised

version: 1
last_updated: "2026-08-24"

# ─── ENTITIES ────────────────────────────────────────────────────────────────
# Named game-world objects: enemies, NPCs, characters, factions, bosses.
# Register an entity here when it appears in more than one GDD — e.g., an
# enemy defined in combat.md that also drops items listed in inventory.md.
#
# Required fields: name, status, source, referenced_by, added
# Attribute fields: any key stats that could appear in another GDD
#   (health, damage, drops, faction, etc.)

entities: []

# Example (remove when first real entry is added):
#
# entities:
#   - name: goblin
#     status: active              # active | deprecated
#     source: design/gdd/combat.md
#     referenced_by:
#       - design/gdd/combat.md
#       - design/gdd/inventory.md
#     health: 40
#     damage: 8
#     drops:
#       - item: goblin_arm        # must match an entry in items section
#         qty: 1
#         drop_rate: 0.8          # 0.0–1.0
#     added: 2026-03-26
#     revised: ""


# ─── ITEMS ───────────────────────────────────────────────────────────────────
# Named collectables, equipment, consumables, crafting materials, currency.
# Register an item when its name or value appears in more than one GDD.
#
# Required fields: name, status, source, referenced_by, added
# Attribute fields: value_gold, weight, stackable, category, and any stat
#   modifiers that another system (e.g., economy, crafting) might reference.

items: []

# Example:
#
# items:
#   - name: goblin_arm
#     status: active
#     source: design/gdd/combat.md   # drop defined in combat GDD
#     referenced_by:
#       - design/gdd/combat.md
#       - design/gdd/inventory.md    # inventory GDD lists its weight/stack rules
#       - design/gdd/economy.md      # economy GDD references its sell price
#     value_gold: 5
#     weight: 1
#     stackable: true
#     category: crafting_material
#     added: 2026-03-26
#     revised: ""


# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  - name: projectile_swept_query_radius
    status: active
    source: design/gdd/spatial-grid.md
    referenced_by:
      - design/gdd/spatial-grid.md
      - design/gdd/config-data-system.md
      # ProjectileSystem GDD 创建后追加其路径
    variables:
      - segment_length
      - midpoint_cast_error
      - projectile_bound
      - max_enemy_bound
      - target_motion_bound
    output_range: [0, .inf]
    expression: "checked_sum(checked_mul(0.5, segment_length), midpoint_cast_error, projectile_bound, max_enemy_bound, target_motion_bound)"
    notes: "全部输入与每步加法必须 checked finite。segment_length 与
      midpoint_cast_error 使用 spatial-grid.md 的 float64 scalar canonical
      distance helper；中点先以四个 float64 分量计算，再 cast/readback Vector2。
      MVP target sampling 固定为 tick-end discrete committed snapshot，故
      target_motion_bound=0；这不构成 continuous relative-sweep 保证。"
    added: 2026-08-19
    revised: 2026-08-19

  - name: max_query_radius
    status: active
    source: design/gdd/spatial-grid.md
    referenced_by:
      - design/gdd/spatial-grid.md
      - design/gdd/config-data-system.md
      - design/gdd/enemy-system.md
      # 待回填：PlayerController, SkillConfig, ProjectileSystem GDD
      # 完成后将其路径追加至此
    variables:
      - pickup_radius_max
      - target_range_max
      - max_skill_effect_radius
      - max_enemy_bound
      - separation_radius
      - max_projectile_segment_length
      - max_midpoint_cast_error
      - max_projectile_bound
      - max_target_motion_bound
    output_range: [0, .inf]
    expression: "checked_max(pickup_radius_max, target_range_max, checked_add(max_skill_effect_radius, max_enemy_bound), checked_add(separation_radius, separation_radius), checked_sum(checked_mul(0.5, max_projectile_segment_length), max_midpoint_cast_error, max_projectile_bound, max_enemy_bound, max_target_motion_bound), ...)"
    notes: "所有依赖 SpatialGrid 查询接口的系统实际传入宽相半径的全集上界，
      必须包含 target conservative bound 与 projectile swept segment expansion。
      Projectile 项不得遗漏 max_midpoint_cast_error 或数值为 0 的
      max_target_motion_bound 语义字段；MVP 分别固定为 sqrt(2)/32 与 0。
      用于配置审计、CELL_SIZE benchmark 候选和 workload 规划，不是合法查询
      半径上限；radius 大于 CELL_SIZE 仍须正确扫描，禁止 release clamp。
      当前 pickup_radius_base=1.8、pickup_radius_max=1.98、
      max_midpoint_cast_error=sqrt(2)/32、max_target_motion_bound=0 已冻结；
      target range、skill radius、projectile segment/bound 待对应 GDD；
      enemy/separation bound 由 EnemySystem GDD §4.6 定义上界（per-type 在
      Config，数值待调参）。输入变化时重跑 F3 sweep，
      不能未经 benchmark 直接令 CELL_SIZE=max_query_radius。"
    added: 2026-08-14
    revised: 2026-08-19

  - name: index_margin_lower_bound
    status: active
    source: design/gdd/stage-map.md
    referenced_by:
      - design/gdd/stage-map.md
      - design/gdd/spatial-grid.md
      - design/gdd/enemy-system.md
      # Combat/DamageSystem GDD 完成后追加其路径（knockback_max owner）
    variables:
      - player_overshoot
      - enemy_overshoot_max
      - elite_charge_overshoot
      - knockback_max
      - max_enemy_bound
    output_range: [0, .inf]
    expression: "checked_add(player_overshoot, max(enemy_overshoot_max, elite_charge_overshoot), knockback_max, max_enemy_bound)"
    notes: "越界容忍带下界。因 spawn 在 arena AABB 内侧（stage-map R3），下界不含
      spawn overshoot，只覆盖移动/knockback/形状扩张。player_overshoot=4.5/60=0.075
      已冻结；enemy_overshoot_max/elite_charge_overshoot/max_enemy_bound 由 EnemySystem
      GDD §4.6 定义（数值待 Config 调参），knockback_max 归 Combat/DamageSystem owner
      （Open Question #2，待 DamageSystem GDD 确认）；数值未冻结前下界仅 0.075。
      配置 index_margin=2.0 spike 安全高于下界；EnemySystem §4.7 约束
      max(enemy_overshoot_max, elite_charge_overshoot)+knockback_max+max_enemy_bound
      ≤ 1.925（F-1 fix 传播,第三轮复审 B-1:普通敌越界与精英冲刺越界取大者非相加）；
      数值冻结后须重跑 SpatialGrid F3 sweep，不得直接当生产承诺。
      arena.grow(index_margin) 四边不得越 spatial_max_abs_world_coord。"
    added: 2026-08-19
    revised: 2026-08-19

  - name: required_pool_capacity
    status: active
    source: design/gdd/object-pooling.md
    referenced_by:
      - design/gdd/object-pooling.md
      - design/gdd/config-data-system.md
    variables:
      - max_concurrent_borrowed
      - max_pause_replacement_overlap
      - max_spawn_before_release_overlap
      - safety_spare
    output_range: [0, 512]
    expression: "checked_sum(max_concurrent_borrowed, max_pause_replacement_overlap, max_spawn_before_release_overlap, safety_spare)"
    notes: "Config schema v1的六key输出依次为320/6/1/448/320/96；
      configured_capacity必须等于或高于required且不得超过per-key硬上限512。
      enemy_elite 4→6：MVP 方案 5.3 两固定精英 + 8.1 冒险夺宝持久化精英最坏 4 并发，
      safety_spare 1→3 吸收，Σ=6/total=1191。"
    added: 2026-08-19
    revised: 2026-08-24

