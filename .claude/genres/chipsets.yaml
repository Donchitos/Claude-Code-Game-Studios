    matches: extraction shooter, full-loot PvP, raid, a game like Escape from Tarkov, Hunt Showdown or Dark and Darker
  fishing:
    is: Cast, wait, hook and reel in fish, and fill a log of catches
    matches: fishing, hunting, a game like Dredge, Ridiculous Fishing or Stardew Valley's fishing
  mining:
    is: Dig down, collect ore, sell it and upgrade to dig deeper
    matches: digging, dig-down, a game like Motherload, SteamWorld Dig or Dome Keeper
  pet-raising:
    is: Raise and care for a creature that grows from how you treat it
    matches: virtual pet, creature raising, creature simulation, a game like Tamagotchi, Neko Atsume or Viva Piñata
  cozy-cleanup:
