# Dont-Know-Studios studio configuration — see STUDIO.md.
#
# Read by .claude/scripts/studio-check.sh, .claude/hooks/studio-session.sh,
# tools/new-game.sh and tools/template-update-check.sh. Plain KEY=value lines,
# no spaces around `=`, no quotes: they are sourced by bash and read by awk.
#
# This file is studio-owned: upstream (Donchitos) never ships it, so an upstream
# merge never conflicts here.

# The studio template repo: every game is cloned from it.
STUDIO_REPO=Dont-Know-Studios/Claude-Code-Game-Studios

# The framework the studio template tracks.
UPSTREAM_REPO=Donchitos/Claude-Code-Game-Studios

# Studio release tags are STUDIO_TAG_PREFIX + x.y.z, e.g. studio-v1.0.0. The
# prefix keeps them apart from upstream's own v1.3.0-style tags, which are in
# the same history.
STUDIO_TAG_PREFIX=studio-v

# The studio release these files belong to. Bump it in the commit you tag as a
# studio release (STUDIO.md, "Cutting a studio release"). The session-start
# update notice compares it with the newest studio release.
STUDIO_VERSION=1.0.0
